  ["1. Кто обрабатывает данные", "Оператор персональных данных — [ФИО индивидуального предпринимателя / самозанятого или наименование организации], ИНН [ИНН], ОГРН/ОГРНИП [номер, если есть], адрес: [адрес]. Связаться с оператором можно по адресу [e-mail для обращений]."],
  ["2. Какие данные мы собираем", "• Данные профиля: имя или псевдоним для рейтинга, выбранный аватар.\n• Данные для входа: адрес электронной почты, номер телефона или данные аккаунта Google (имя, e-mail, идентификатор) — в зависимости от выбранного способа входа.\n• Учебные данные: пройденные уроки, результаты тестов и экзаменов, опыт, серия дней, достижения, карточки и их расписание повторений, созданные вами карточки.\n• Данные партнёрской программы: ваш код приглашения, кто пригласил вас, начисления.\n• Данные об оплате: сумма, дата, статус и идентификатор платежа. Данные банковских карт и счетов мы не получаем и не храним — их обрабатывает платёжный сервис.\n• Вопросы ИИ-репетитору: текст вопросов и ответов в рамках текущего разговора.\n• Технические данные: тип устройства и браузера, дата и время входа, данные в локальном хранилище браузера."],
  ["3. Зачем мы их используем", "• чтобы создать аккаунт и пускать вас в него;\n• чтобы сохранять учебный прогресс и показывать его на любом устройстве;\n• чтобы показывать общий рейтинг учеников (только имя для рейтинга, аватар, опыт, серию и уровень);\n• чтобы принимать оплату и начислять бонусы по партнёрской программе;\n• чтобы отвечать на обращения и сообщать о важных изменениях;\n• чтобы обеспечивать безопасность и предотвращать злоупотребления."],
  ["4. Правовые основания", "Мы обрабатываем данные на основании вашего согласия, которое вы даёте при регистрации, а также для исполнения договора (пользовательского соглашения) и выполнения требований закона (например, налогового учёта платежей)."],
  ["5. Где хранятся данные", "Персональные данные граждан России записываются и хранятся в базах данных, расположенных на территории Российской Федерации, как требует ч. 5 ст. 18 152-ФЗ: [название хостинга и города дата-центра]. Учебный прогресс также сохраняется в памяти вашего браузера. Текущая версия приложения может работать на платформе Claude (Anthropic); в этом случае данные хранятся в инфраструктуре этой платформы."],
  ["6. Кому мы передаём данные", "Только тем, кто помогает работать сервису, и только в нужном объёме:\n• хостинг-провайдер — [название];\n• платёжный сервис ЮKassa (ООО НКО «ЮМани») — для приёма оплаты и выдачи чеков;\n• сервис отправки SMS — [название] — для кодов подтверждения;\n• Google — если вы входите через аккаунт Google;\n• поставщик ИИ-модели — текст ваших вопросов репетитору, без имени и контактов.\nМы не продаём данные и не передаём их для рекламы."],
  ["7. Сколько мы храним данные", "Пока действует ваш аккаунт. После удаления аккаунта данные удаляются в течение 30 дней, кроме сведений о платежах, которые хранятся столько, сколько требует налоговое законодательство."],
  ["8. Ваши права", "Вы можете: узнать, какие данные о вас хранятся; исправить их; скачать копию прогресса (в профиле — «Скачать копию»); удалить аккаунт и данные; отозвать согласие на обработку. Для этого напишите на [e-mail для обращений]. Мы ответим в течение 10 рабочих дней. Вы также вправе обратиться в Роскомнадзор."],
  ["9. Защита данных", "Соединение с сервисом шифруется (HTTPS). Пароли хранятся только в виде хэшей. Доступ к базе данных ограничен правилами: каждый пользователь видит только свои учебные данные, а в общем рейтинге — только публичные поля. Коды подтверждения ограничены по числу попыток."],
  ["10. Файлы cookie и локальное хранилище", "Приложение сохраняет настройки и прогресс в памяти браузера (localStorage), чтобы работать быстрее и без интернета. Рекламные и сторонние трекеры мы не используем. Очистка данных браузера удалит локальную копию, но не данные аккаунта."],
  ["11. Дети", "Сервис рассчитан на пользователей старше 14 лет. Если ребёнку меньше 14 лет, регистрироваться должен его родитель или законный представитель."],
  ["12. Изменения политики", "Мы можем обновлять эту политику. О существенных изменениях сообщим в приложении. Дата последнего обновления указана вверху."]
 ]},
consent: { title: "Согласие на обработку персональных данных", updated: "8 октября 2026",
 intro: "Отмечая галочку «Даю согласие на обработку персональных данных» при регистрации, я, пользователь приложения «Türkçe каждый день», свободно, своей волей и в своём интересе даю согласие на обработку моих персональных данных на условиях ниже (ст. 9 Федерального закона № 152-ФЗ «О персональных данных»).",
 sections: [
  ["1. Оператор", "[ФИО индивидуального предпринимателя / самозанятого или полное наименование организации], ИНН [ИНН], ОГРН/ОГРНИП [если есть], адрес: [адрес], e-mail: [e-mail]."],
  ["2. Цели обработки", "Регистрация и вход в приложение; сохранение учебного прогресса; показ имени, аватара и результатов в общем рейтинге; приём оплаты и начисления по партнёрской программе; ответы на обращения."],
  ["3. Перечень данных", "Имя или псевдоним, аватар; адрес электронной почты и/или номер телефона и/или идентификатор и e-mail аккаунта Google; учебные данные (прогресс, результаты, карточки); код приглашения и сведения о приглашённых; сведения о платежах (сумма, дата, статус, без данных карт); технические данные (тип устройства и браузера, время входа)."],
  ["4. Действия с данными", "Сбор, запись, систематизация, накопление, хранение, уточнение (обновление, изменение), извлечение, использование, передача (предоставление, доступ) лицам, указанным в Политике конфиденциальности и действующим по поручению оператора, обезличивание, блокирование, удаление, уничтожение. Обработка — автоматизированная, с использованием баз данных на территории Российской Федерации."],
  ["5. Срок действия и отзыв", "Согласие действует до удаления аккаунта или до отзыва. Отозвать согласие можно, направив заявление на [e-mail]. После отзыва оператор прекращает обработку и удаляет данные в течение 30 дней, кроме данных, которые нужно хранить по закону."],
  ["6. Подтверждение", "Согласие считается подписанным простой электронной подписью при отметке галочки. Оператор сохраняет дату, время и версию текста согласия."]
 ]},
terms: { title: "Пользовательское соглашение", updated: "8 октября 2026",
 intro: "Это соглашение — договор между вами и [ФИО / наименование], ИНН [ИНН] (далее — «мы»), о пользовании приложением «Türkçe каждый день». Регистрируясь или пользуясь приложением, вы принимаете эти условия.",
 sections: [
  ["1. Что это за сервис", "Приложение помогает самостоятельно учить турецкий язык: курсы по уровням, конспекты, упражнения, карточки, словарь, озвучка, ИИ-репетитор, рейтинг и достижения. Сервис не является образовательной организацией и не выдаёт документов об образовании."],
  ["2. Аккаунт", "• Регистрация — по e-mail, номеру телефона или через аккаунт Google.\n• Указывайте достоверные контакты: через них восстанавливается доступ.\n• Не передавайте доступ к аккаунту другим людям. Вы отвечаете за действия в своём аккаунте.\n• Имя для рейтинга видно другим ученикам. Не используйте оскорбительные или чужие имена — такие имена мы можем изменить."],
  ["3. Бесплатные и платные функции", "Часть функций доступна бесплатно. Платный доступ (подписка) открывает [перечень: например, курсы A1–B2, ИИ-репетитора без ограничений]. Актуальные цены и состав подписки указаны в приложении перед оплатой."],
  ["4. Оплата и подписка", "• Оплата принимается через платёжный сервис ЮKassa (ООО НКО «ЮМани») — через Систему быстрых платежей (СБП), банковские карты, SberPay и T-Pay. Данные карт вводятся на стороне ЮKassa, мы их не получаем.\n• Подписка продлевается автоматически, только если вы дали на это согласие при оплате. Мы напомним о списании заранее, не позднее чем за 24 часа.\n• Отключить автопродление можно в любой момент в профиле; доступ сохранится до конца оплаченного периода.\n• Возврат: если вы не пользовались платными функциями, деньги можно вернуть в течение 14 дней после оплаты по заявке на [e-mail]. В остальных случаях — пропорционально неиспользованному периоду. Возврат идёт тем же способом, которым была оплата.\n• Чек направляется на e-mail или телефон, указанные при оплате."],
  ["5. Партнёрская программа", "• У каждого ученика есть код приглашения.\n• Когда приглашённый вами человек оплачивает подписку, вам начисляется 10% от суммы его платежа на бонусный счёт в приложении. Начисление происходит после того, как платёж прошёл и не был возвращён; при возврате платежа бонус списывается.\n• Бонусами можно оплатить свою подписку. Вывод денег возможен [условия: например, для партнёров со статусом самозанятого, от суммы X ₽] — в соответствии с налоговым законодательством.\n• Запрещено приглашать самого себя, создавать фиктивные аккаунты и распространять код через спам. При нарушении бонусы аннулируются.\n• Бонусы за приглашение без оплаты (опыт и заморозки серии) — игровые и денежной ценности не имеют."],
  ["6. Промокоды", "Промокод даёт указанную в нём награду один раз на аккаунт. Промокоды не обмениваются на деньги."],
  ["7. ИИ-репетитор", "Ответы репетитора генерирует искусственный интеллект. Они могут содержать неточности; проверяйте важное. Не отправляйте репетитору личные данные."],
  ["8. Учебные материалы", "Тексты, упражнения, озвучка и оформление принадлежат нам или используются по лицензии. Их можно использовать для личного обучения, но нельзя копировать для распространения или продажи. Карточки, которые вы создаёте сами, принадлежат вам."],
  ["9. Ограничение ответственности", "Мы стараемся, чтобы сервис работал без сбоев, но не гарантируем непрерывную работу и не отвечаем за результат обучения, который зависит от регулярности занятий. Мы не несём ответственности за сбои платёжных сервисов, операторов связи и провайдеров интернета."],
  ["10. Удаление аккаунта", "Вы можете удалить аккаунт в любой момент, написав на [e-mail]. Мы можем ограничить доступ при нарушении этого соглашения, сообщив причину."],
  ["11. Изменения соглашения", "Мы можем изменять соглашение, публикуя новую редакцию в приложении. Если вы не согласны с изменениями, вы можете прекратить пользоваться сервисом и запросить возврат за неиспользованный период подписки."],
  ["12. Реквизиты и контакты", "[ФИО / наименование]\nИНН [ИНН], ОГРН/ОГРНИП [если есть]\nАдрес: [адрес]\nE-mail: [e-mail]\nТелефон: [телефон]"]
 ]}

let noiseBuf=null;
function tapSound(kind){
  if(!P.sound||!P.taps)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();
    const t=actx.currentTime;
    if(!noiseBuf){noiseBuf=actx.createBuffer(1,Math.floor(actx.sampleRate*.04),actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}
    const n=actx.createBufferSource();n.buffer=noiseBuf;const bp=actx.createBiquadFilter();bp.type="bandpass";bp.Q.value=1.2;
    const g=actx.createGain();const o=actx.createOscillator(),og=actx.createGain();o.type="sine";
    const cfg={tap:[2600,.10,520,.10],soft:[3400,.06,880,.05],pop:[1900,.12,660,.14],nav:[2200,.08,390,.12],big:[1500,.14,300,.16]}[kind]||[2600,.1,520,.1];
    bp.frequency.value=cfg[0];g.gain.setValueAtTime(cfg[1],t);g.gain.exponentialRampToValueAtTime(.0005,t+.035);
    n.connect(bp);bp.connect(g);g.connect(actx.destination);n.start(t);
    o.frequency.setValueAtTime(cfg[2]*1.25,t);o.frequency.exponentialRampToValueAtTime(cfg[2],t+.05);
    og.gain.setValueAtTime(0,t);og.gain.linearRampToValueAtTime(cfg[3],t+.004);og.gain.exponentialRampToValueAtTime(.0005,t+.07);
    o.connect(og);og.connect(actx.destination);o.start(t);o.stop(t+.08);
  }catch(e){}
}

/* ================= EXERCISE GENERATION ================= */
function optsFor(target,pool,field,n){
  const seen=new Set([norm(target[field]),norm(target.tr)]);const multi=target.tr.includes(" ");
  const cand=shuffle(pool.filter(w=>!seen.has(norm(w[field]))&&!seen.has(norm(w.tr))));
  const same=cand.filter(w=>w.tr.includes(" ")===multi);const list=[...same,...cand.filter(w=>!same.includes(w))];
  const out=[],used=new Set();for(const w of list){const k=norm(w[field]);if(used.has(k))continue;used.add(k);out.push(w);if(out.length>=n-1)break}
  return shuffle([target,...out]);
}
function pickPairs(items,n){const out=[],tr=new Set(),ru=new Set();for(const w of shuffle(items)){const a=norm(w.tr),b=norm(w.ru);if(tr.has(a)||ru.has(b))continue;tr.add(a);ru.add(b);out.push(w);if(out.length>=n)break}return out}
function drillEx(mode,n,d){const D=DRILLS[mode];return pick(D.items,n).map(([base,right])=>{const wrong=shuffle(D.sfx.map(s=>base+s).filter(x=>x!==right));return {type:"suffix",mode,base,right,opts:shuffle([right,...wrong.slice(0,Math.max(1,Math.min(d.opts,D.sfx.length)-1))])}})}
function letterEx(n){const sp=ABC.filter(x=>x[4]),rest=ABC.filter(x=>!x[4]);const a=pick(sp,Math.min(n,sp.length));while(a.length<n)a.push(pick(rest,1)[0]);return a.map((L,i)=>i%3===2?{type:"soundof",L}:{type:"letter",L})}
function makeSession({items,len,diff,only,drill,abc,exam}){
  const d=DIFF[diff];const pool=[...items,...ALL];
  const multi=items.filter(w=>toks(w.tr).length>=2&&toks(w.tr).length<=7);
  const shortOnes=items.filter(w=>toks(w.tr).length<=3&&w.tr.length<=22);
  const basic=(t,w)=>t==="choice_tr"?{type:t,w,opts:optsFor(w,pool,"ru",d.opts)}:t==="choice_ru"||t==="listen"?{type:t,w,opts:optsFor(w,pool,"tr",d.opts)}:{type:t,w};
  let ex=[];
  if(only){
    if(only==="letter")return letterEx(len);
    if(only==="suffix")return drillEx(drill||"pl",len,d);
    if(only==="speed"){const src=items.filter(w=>w.tr.length<=18&&w.ru.length<=24);return [{type:"speed",pairs:pickPairs(src.length>=6?src:items,6)}]}
    if(only==="wordle"){const ok=w=>{const u=w.tr.toLocaleUpperCase("tr");return /^[A-ZÇĞİÖŞÜ]{4,6}$/.test(u)};let src=items.filter(ok);if(src.length<3)src=ALL.filter(w=>ok(w)&&w.ci<=Math.max(0,currentCourse()));return pick(src,Math.min(len,5)).map(w=>({type:"wordle",w}))}
    if(only==="hang"){const src=items.filter(w=>!w.tr.includes(" ")&&w.tr.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,"").length>=3&&w.tr.length<=12);return pick(src.length?src:items,Math.min(len,8)).map(w=>({type:"hang",w}))}
    if(only==="match"){for(let i=0;i<Math.max(2,Math.round(len/4));i++)ex.push({type:"match",pairs:pickPairs(items,d.pairs)});return ex}
    let src=only==="build"?multi:(only==="type"||only==="dictation")?shortOnes:items;if(!src.length)src=items;
    let q=[];while(ex.length<len){if(!q.length)q=shuffle(src);ex.push(basic(only,q.pop()))}
    return ex;
  }
  if(abc)ex.push(...letterEx(6));
  if(drill)ex.push(...drillEx(drill,4,d));
  if(items.length>=d.pairs&&ex.length<len-2)ex.push({type:"match",pairs:pickPairs(items,d.pairs)});
  pick(multi,Math.min(exam?3:2,multi.length)).forEach(w=>{if(ex.length<len-2)ex.push({type:"build",w})});
  pick(shortOnes,d.type+(exam?1:0)).forEach(w=>{if(ex.length<len-1)ex.push({type:"type",w})});
  pick(shortOnes,d.dict).forEach(w=>{if(ex.length<len-1)ex.push({type:"dictation",w})});
  const kinds=["choice_tr","listen","choice_ru"];let k=0,q=[];
  while(ex.length<len){if(!q.length)q=shuffle(items);ex.push(basic(kinds[k++%3],q.pop()))}
  ex=shuffle(ex);const first=ex.filter(e=>e.type==="letter"||e.type==="soundof");
  return [...first,...ex.filter(e=>!first.includes(e))];
}

/* ================= SRS (Anki-style) ================= */
const MASTER=21;
const ALLTR=new Set(ALL.map(w=>w.tr));
function cardId(w){return w.cid&&!ALLTR.has(w.tr)?"c:"+w.cid:w.tr}
function allCustom(){return S.custom.filter(c=>!c.del).map(c=>({tr:c.tr,ru:c.ru,cid:c.id}))}
function noteWords(){const out=[];COURSES.forEach(c=>c.lessons.forEach(l=>{if(isDone(l)&&l.note)l.note.e.forEach(([tr,ru])=>out.push({tr,ru}))}));const m=new Map();out.forEach(w=>{if(!m.has(w.tr))m.set(w.tr,w)});return [...m.values()]}
function decks(){
  const d=[{id:"learned",name:"Выученные слова",desc:"Из пройденных уроков",ic:"book",col:"#2255C4",cards:learnedWords()},
    {id:"own",name:"Мои карточки",desc:"Карточки, которые вы создали",ic:"pen",col:"#7C4CC2",cards:allCustom()},
    {id:"notes",name:"Из конспектов",desc:"Примеры из конспектов пройденных уроков",ic:"note",col:"#12908A",cards:noteWords()},
    {id:"mist",name:"Мои ошибки",desc:"Слова, где были ошибки",ic:"target",col:"#D9483B",cards:Object.keys(S.mistakes).map(tr=>ALL.find(w=>w.tr===tr)).filter(Boolean)}];
  COURSES.forEach((c,ci)=>{if(courseOpen(ci))d.push({id:"c"+ci,name:cname(ci),desc:"Все слова курса",ic:"cards",col:["#2255C4","#0E7F79","#7C4CC2","#C2582B","#B0306A"][ci],cards:c.lessons.flatMap(l=>l.words)})});
  d.forEach(x=>{const m=new Map();x.cards.forEach(w=>{const k=cardId(w);if(!m.has(k))m.set(k,w)});x.cards=[...m.values()]});
  return d;
}
function reviewCards(ds){const m=new Map();const learned=new Set(ds[0].cards.map(cardId));ds.forEach(dk=>dk.cards.forEach(w=>{const k=cardId(w);if(m.has(k))return;if(S.srs[k]||learned.has(k)||dk.id==="own")m.set(k,w)}));return [...m.values()]}
function deckStats(dk){
  const t=today();let nw=0,due=0,mast=0;
  dk.cards.forEach(w=>{const s=S.srs[cardId(w)];if(!s){nw++;return}if(s.d<=t)due++;mast+=Math.min(1,(s.i||0)/MASTER)});
  return {nw,due,pct:dk.cards.length?Math.round(mast/dk.cards.length*100):0};
}
const newLeft=()=>Math.max(0,P.newPerDay-(S.newDone[today()]||0));
function ivlLabel(days){if(days<=0)return "<10 мин";if(days<30)return days+" д";if(days<365)return Math.round(days/30)+" мес";return (days/365).toFixed(1)+" г"}
function nextIvl(s,g){
  s=s||{i:0,e:2.5,r:0};let i=s.i||0,e=s.e||2.5,r=s.r||0;
  if(g===1)return {i:0,e:Math.max(1.3,e-.2),r:0};
  if(g===2)return {i:Math.max(1,Math.round((i||1)*1.2)),e:Math.max(1.3,e-.15),r:r+1};
  if(g===3)return {i:r===0?1:r===1?3:Math.round(i*e),e,r:r+1};
  return {i:r===0?4:Math.round(i*e*1.3),e:e+.15,r:r+1};
}
let C=null;
function startCards(dk){
  const t=today();
  const due=shuffle(dk.cards.filter(w=>{const s=S.srs[cardId(w)];return s&&s.d<=t}));
  const fresh=dk.cards.filter(w=>!S.srs[cardId(w)]).slice(0,newLeft());
  const q=[...due,...fresh];
  if(!q.length){toast("✅","На сегодня всё повторено","Новые карточки появятся завтра, или увеличьте лимит в настройках");return}
  C={deck:dk.name,q,done:0,again:0,shown:false,start:Date.now()};
  const pk=new Set(["common"]);q.forEach(w=>pk.add(PACK.get(w.tr)));preloadPacks([...pk]);

  document.body.style.overflow="hidden";$("#cx").onclick=endCards;renderCard();
}
function endCards(){C=null;lessonVoice=null;$("#overlay").innerHTML="";document.body.style.overflow="";persist();render()}

    $("#ccheck").innerHTML=`<div class="check-in"><button class="btn primary" id="cdone">Готово</button></div>`;$("#cdone").onclick=endCards;chime(true);return;
  }
  const w=C.q[0];const dir=P.cardDir==="mix"?(C.done%2?"ru":"tr"):P.cardDir;
  lessonVoice=nextVoice();
  const total=C.done+C.q.length;$("#cbar").style.width=(C.done/total*100)+"%";$("#cleft").textContent=C.q.length+" ост.";
  const front=dir==="tr"?`<div class="front">${trHTML(w.tr)}</div>`:`<div class="front">${esc(w.ru)}</div>`;
  const back=dir==="tr"?`<hr><div class="back">${esc(w.ru)}</div>`:`<hr><div class="back" style="color:var(--ink)">${trHTML(w.tr)}</div>`;
  $("#cbody").innerHTML=`<div class="flash">${S.srs[cardId(w)]?"":`<span class="tag">Новая карточка</span>`}${front}${C.shown?back:""}${(dir==="tr"||C.shown)&&hasClip(w.tr)?sayBtns(w.tr):""}</div>`;
  wireSay($("#cbody"));

  if(!C.shown){$("#ccheck").className="check";$("#ccheck").innerHTML=`<div class="check-in"><button class="btn primary" id="cshow">Показать ответ</button></div>`;$("#cshow").onclick=()=>{C.shown=true;renderCard();if(dir==="ru")speak(w.tr)};return}
  $("#ccheck").innerHTML=`<div class="check-in"><div class="grades">${[[1,"Снова"],[2,"Трудно"],[3,"Хорошо"],[4,"Легко"]].map(([g,n])=>`<button class="g${g}" data-g="${g}">${n}<small>${ivlLabel(nextIvl(s,g).i)}</small></button>`).join("")}</div></div>`;
  $("#ccheck").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>grade(+b.dataset.g));
}
function grade(g){
  const w=C.q.shift();const id=cardId(w);const was=S.srs[id];
  if(!was){S.newDone[today()]=(S.newDone[today()]||0)+1}
  const n=nextIvl(was,g);S.srs[id]={...n,d:addDays(today(),n.i),l:(was&&was.l||0)+(g===1?1:0),u:Date.now()};
  if(g===1){C.again++;C.q.splice(Math.min(C.q.length,3),0,w)}else{C.done++;addXp(1);S.stats.cards++;questBump("cards",1)}
  C.shown=false;if(C.done%10===0)persist();renderCard();
}
async function exportAnki(dk){

}

async function applyRefCode(code){
  code=(code||"").trim().toUpperCase();
  if(!lbCol)return WEB?NOACC:"Войдите в аккаунт Claude, чтобы использовать код";
  if(S.refBy)return "Вы уже ввели код приглашения";
  if(code===myCode)return "Это ваш собственный код";
  if(!/^[A-Z0-9]{6}$/.test(code))return "Код состоит из 6 букв и цифр";
  try{const s=await lbCol.where("refCode","==",code).limit(1).get();if(s.empty)return "Такой код не найден";
    S.refBy=code;S.bonus+=50;S.freezes+=1;persist();toast("🎁","Код друга принят","+50 XP и заморозка серии");return null}catch(e){return "Не получилось проверить код, попробуйте позже"}
}
async function applyPromo(code){
  code=(code||"").trim().toUpperCase();if(!code)return "Введите промокод";
  if(!DB)return WEB?NOACC:"Войдите в аккаунт Claude, чтобы использовать промокоды";
  const h=await sha("promo:"+code);if(S.promos.includes(h))return "Этот промокод уже использован";
  try{const d=await DB.doc("promos/"+h).get();if(!d.exists)return "Промокод не найден";const p=d.data();
    if(p.until&&p.until<today())return "Срок действия промокода истёк";
    S.promos.push(h);S.bonus+=+p.xp||0;S.freezes+=+p.freezes||0;persist();
    toast("🎁","Промокод активирован",[p.xp?`+${p.xp} XP`:"",p.freezes?`заморозок серии: ${p.freezes}`:""].filter(Boolean).join(", "));return null}catch(e){return "Не получилось проверить промокод"}
}

let chatTurns=[],chatCtx=null,chatBusy=false,chatCtl=null;
function tutorRules(){
  const lvl=COURSES[currentCourse()];
  let ctx=`Ты — доброжелательный репетитор турецкого языка для русскоязычной ученицы старшего возраста. Её текущий уровень: ${lvl.level} (${cshort(currentCourse())}). Отвечай по-русски, коротко и понятно: 3–8 предложений, турецкие примеры с переводом. Без markdown-разметки, без таблиц. Если просят проверить фразу — укажи ошибки и дай правильный вариант. Не выдумывай правила; если не уверен, скажи об этом.`;
  if(chatCtx){const l=findLesson(chatCtx);if(l){ctx+=`\n\nСейчас она изучает урок «${l.t}» (${cname(l.ci)}). Конспект: ${l.note?l.note.s+" "+l.note.p.join(" "):""}\nСлова урока: ${lessonWords(l).slice(0,25).map(w=>w.tr+" — "+w.ru).join("; ")}`}}
  return ctx;
}
async function askTutor(q){
  if(!sampleApi||chatBusy||!q.trim())return;
  chatTurns.push({role:"user",content:q.trim()});chatBusy=true;S.stats.tutor++;saveLocal();checkAchievements();
  chatTurns.push({role:"assistant",content:"Думаю…",pending:true});render();scrollChat();
  chatCtl=new AbortController();
  const turns=[{role:"user",content:tutorRules()},{role:"assistant",content:"Понял. Готов помогать."},...chatTurns.filter(t=>!t.pending)];
  try{
    const {text}=await sampleApi(turns,{cache:false,signal:chatCtl.signal,modelTier:"default",onText:({text})=>{const last=chatTurns[chatTurns.length-1];last.content=text;const el=document.querySelector(".msg.ai:last-of-type");if(el)el.textContent=text;scrollChat()}});
    const last=chatTurns[chatTurns.length-1];last.content=text;delete last.pending;
  }catch(e){const last=chatTurns[chatTurns.length-1];delete last.pending;
    last.content=(e&&e.text)||({not_granted:"Чтобы пользоваться репетитором, разрешите приложению обращаться к Claude.",rate_limited:"Слишком много вопросов подряд. Подождите минуту и спросите снова.",cancelled:"Остановлено."}[e&&e.code]||"Не получилось получить ответ. Попробуйте ещё раз.")}
  chatBusy=false;persist();render();scrollChat();
}

function monthName(){const m=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];const [y,mo]=today().split("-").map(Number);return m[mo-1]+" "+y}
function calendar(){
  const [y,m]=today().split("-").map(Number);const first=new Date(y,m-1,1),n=new Date(y,m,0).getDate(),lead=(first.getDay()+6)%7;
  let h=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>`<span class="h">${x}</span>`).join("");for(let i=0;i<lead;i++)h+=`<span></span>`;
  for(let d=1;d<=n;d++){const k=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");const x=S.xp[k]||0;const lv=x===0?"":x<P.goal?"l1":x<P.goal*2?"l2":"l3";h+=`<span class="c ${lv} ${k===today()?"now":""}" title="${d}: ${x} XP">${d}</span>`}
  return `<div class="cal">${h}</div>`;
}
function xpChart(){
  const t=today(),days=[...Array(14)].map((_,i)=>addDays(t,i-13)),vals=days.map(d=>S.xp[d]||0);
  const top=Math.ceil(Math.max(P.goal*1.5,...vals)/10)*10;
  const W=340,H=170,pl=26,pr=4,pt=10,pb=24,cw=(W-pl-pr)/14,bw=Math.min(16,cw-4),y=v=>pt+(H-pt-pb)*(1-v/top);
  let g="";[0,top/2,top].forEach(v=>{g+=`<line class="grid-line" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`});
  g+=`<line class="goal-line" x1="${pl}" x2="${W-pr}" y1="${y(P.goal)}" y2="${y(P.goal)}"/>`;
  days.forEach((d,i)=>{const x=pl+i*cw+(cw-bw)/2,v=vals[i],hg=Math.max(0,y(0)-y(v));
    if(v>0){const r=Math.min(4,hg);g+=`<path class="bar-r ${d===t?"today":""}" d="M${x},${y(0)} v${-(hg-r)} q0,${-r} ${r},${-r} h${bw-2*r} q${r},0 ${r},${r} v${hg-r} z"><title>${+d.slice(8)}.${d.slice(5,7)}: ${v} XP</title></path>`}
    if(i%2===1||d===t)g+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" ${d===t?'style="fill:var(--ink)"':""}>${d===t?"сег.":+d.slice(8)}</text>`});
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Опыт по дням за две недели">${g}</svg></div>`;
}

  root.querySelector("#pSave").onclick=async()=>{

/* backup */
async function backupSave(){
  const data=JSON.stringify({app:"turkce",v:3,at:new Date().toISOString(),state:S},null,1);
  if(dlApi){try{await dlApi.save({filename:`turkce-progress-${today()}.json`,data});toast("💾","Копия прогресса сохранена","Её можно загрузить на любом устройстве")}catch(e){if(e&&e.code!=="declined")toast("⚠️","Не удалось сохранить файл","")}}
  else{try{await navigator.clipboard.writeText(data);toast("📋","Копия скопирована в буфер","Сохраните текст в файл .json")}catch(e){toast("⚠️","Сохранение файла недоступно в этом окне","")}}
}
function backupLoad(file){
  const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||j.app!=="turkce"||!j.state)throw 0;j.state.resetAt=S.resetAt||0;S=mergeState(S,j.state);persist();render();toast("📂","Прогресс загружен","Данные объединены с текущими")}catch(e){toast("⚠️","Это не файл прогресса","Выберите файл turkce-progress-….json")}};r.readAsText(file);
}

const reduceMotion=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(){

  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const cols=["#58CC02","#1CB0F6","#FFC800","#FF4B4B","#CE82FF","#FF9600"];
  const ps=Array.from({length:110},(_,i)=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[i%cols.length]}));

function todayQuests(){
  const d=today();let h=0;for(const ch of d)h=(h*31+ch.charCodeAt(0))>>>0;
  const out=[],kinds=new Set();let i=0;
  while(out.length<3&&i<50){const q=QUESTS[(h+i*7)%QUESTS.length];i++;if(kinds.has(q.k))continue;kinds.add(q.k);out.push(q)}
  return out;
}
function daily(){const d=today();if(!S.daily||S.daily.d!==d)S.daily={d,p:{},chest:false};return S.daily}
function questBump(k,n){
  const D=daily();const qs=todayQuests();const before=qs.filter(q=>(D.p[q.k]||0)>=q.n).length;
  D.p[k]=(D.p[k]||0)+n;
  const doneNow=qs.filter(q=>q.k===k&&(D.p[q.k]-n)<q.n&&D.p[q.k]>=q.n);
  const host=L||ST;
  if(doneNow.length&&!host)doneNow.forEach(q=>toast(q.ic,"Задание дня выполнено",q.t));
  else if(doneNow.length)(host.questsDone=host.questsDone||[]).push(...doneNow.map(q=>q.t));
}

    body=(top.length?`<div class="card stack"><h3 style="margin:0">Чаще всего жалуются на</h3>${top.map(([k,n])=>`<div style="display:flex;justify-content:space-between;font-weight:800"><span>${esc(k)}</span><span>${n}</span></div>`).join("")}</div>`:"")+reportsAdmin();
  }else body=adminHTML();
  return `<button class="back" data-aback>${I.back} Профиль</button><h1 class="sec-title">Админка</h1><p class="sec-lead">Видите только вы как владелец приложения.</p>
   <div class="stack"><div class="tabs2" style="flex-wrap:wrap">${tabs.map(([k,n])=>`<button data-atab="${k}" aria-pressed="${Atab===k}">${n}</button>`).join("")}</div>${body}
   <button class="btn sm" id="aRefresh">Обновить данные</button></div>`;
}

/* ================= XP LEVELS ================= */
const lvlXp=n=>20*(n-1)*n;
function lvlOf(x){let n=1;while(lvlXp(n+1)<=x)n++;return n}
const LVL_TITLES=[[30,"Легенда"],[20,"Эксперт"],[15,"Мастер"],[10,"Знаток"],[5,"Ученик"],[1,"Новичок"]];
const lvlTitle=n=>LVL_TITLES.find(([k])=>n>=k)[1];
function lvlInfo(){const x=totalXp(),n=lvlOf(x),a=lvlXp(n),b=lvlXp(n+1);return {n,x,into:x-a,need:b-a,pct:(x-a)/(b-a)*100,title:lvlTitle(n)}}
function checkLevelUp(){
  const n=lvlOf(totalXp());if(S.lvlSeen==null){S.lvlSeen=n;return}
  if(n>S.lvlSeen){S.lvlSeen=n;saveLocal();setTimeout(()=>{toast("⭐",`Новый уровень: ${n}`,n%5===0||n===10?`Звание «${lvlTitle(n)}»`:`До уровня ${n+1} — ${lvlXp(n+1)-totalXp()} XP`);confetti();chime(true)},L?1600:300)}
}
function levelCard(){
  const v=lvlInfo();
  return `<div class="lvl-card"><div class="lvl-badge" aria-label="Уровень ${v.n}"><small>ур.</small><b>${v.n}</b></div><div style="flex:1;min-width:0"><b class="lvl-t">${esc(v.title)}</b><div class="pbar"><i style="width:${v.pct}%;background:var(--violet)"></i></div><small class="help">${v.into} / ${v.need} XP до уровня ${v.n+1}</small></div></div>`;
}
const starsOf=l=>{const b=(S.lessons[l.key]||{}).best||0;return b>=95?3:b>=80?2:1};

/* ================= CLUB CHAT ================= */
const CLUB_TOPICS=[["Что вы ели сегодня на завтрак?","Bugün kahvaltıda ne yediniz?"],["Какая сегодня погода у вас?","Bugün hava nasıl?"],["Куда вы хотите поехать в Турции?","Türkiye'de nereye gitmek istiyorsunuz?"],["Расскажите о своей семье.","Ailenizi anlatın."],["Что вы делали вчера вечером?","Dün akşam ne yaptınız?"],["Какой ваш любимый турецкий сериал?","En sevdiğiniz Türk dizisi hangisi?"],["Что вы будете делать в выходные?","Hafta sonu ne yapacaksınız?"],["Кем вы работаете или работали?","Ne iş yapıyorsunuz?"],["Какое турецкое блюдо вы любите?","Hangi Türk yemeğini seviyorsunuz?"],["Почему вы учите турецкий?","Neden Türkçe öğreniyorsunuz?"],["Опишите свой город.","Şehrinizi anlatın."],["Что вы купили бы на рынке?","Pazarda ne alırdınız?"],["Какое у вас хобби?","Hobiniz ne?"],["Расскажите про свой день.","Gününüzü anlatın."]];
const clubTopic=()=>CLUB_TOPICS[dayDiff("2026-01-01",today())%CLUB_TOPICS.length];
let clubRows=null,clubSub=false,clubFix=null,clubBusy=false,clubLast=0,clubDraft="";
const BAD_RE=/(https?:\/\/|www\.|t\.me|\b[a-z0-9-]+\.(ru|com|net|org|me|tr|io)\b|@[a-z0-9_]{4,}|\+?\d[\d\s\-()]{8,}\d)/i;
function subClub(){
  if(clubSub||!DB)return;clubSub=true;
  try{DB.collection("chat").limit(400).onSnapshot(s=>{clubRows=s.docs.map(d=>({id:d.id,...d.data()}));if(view==="rating"&&Rtab==="club")renderClubList()},()=>{clubRows=clubRows||[];clubSub=false})}catch(e){clubSub=false}
}
function clubMsgs(){
  const out=[],likes={};
  (clubRows||[]).forEach(r=>(r.likes||[]).forEach(k=>likes[k]=(likes[k]||0)+1));
  (clubRows||[]).forEach(r=>(r.msgs||[]).forEach(m=>out.push({...m,uid:r.id,name:r.name,avatar:r.avatar,lvl:r.lvl,key:r.id+":"+m.id,likes:likes[r.id+":"+m.id]||0})));
  return out.sort((a,b)=>a.at-b.at).slice(-80);
}
function myClub(){return (clubRows||[]).find(r=>r.id===myId)||{msgs:[],likes:[]}}
function viewClub(){
  subClub();const [ru,tr]=clubTopic();
  if(!S.profile)return `<div class="card"><p class="help" style="margin:0">Создайте профиль, чтобы писать в клубе.</p></div>`;
  return `<div class="card stack club-topic"><span class="kicker">Тема дня</span><b class="t">${trHTML(tr)}</b><span class="help" style="margin:0">${esc(ru)} Ответьте по-турецки одной-двумя фразами. Ошибаться можно — тут все учатся.</span></div>
   <div class="club" id="clubList">${clubListHTML()}</div>
   <div class="card stack club-send">
     <div id="clubFix">${clubFixHTML()}</div>
     <textarea class="search" id="clubIn" rows="2" maxlength="300" placeholder="Напишите по-турецки…">${esc(clubDraft)}</textarea>
     <div class="kb-mini">${["ç","ş","ğ","ı","ö","ü","İ"].map(c=>`<button data-ck="${c}">${c}</button>`).join("")}</div>
     <div class="grid2">${sampleApi?`<button class="btn sm" id="clubCheck" ${clubBusy?"disabled":""}>${I.chat} Проверить ошибки</button>`:"<span></span>"}<button class="btn primary sm" id="clubSend">Отправить</button></div>
     <p class="help" style="margin:0">Правила: по-доброму, без телефонов, адресов и ссылок. Сообщения видят все ученики. Нарушения удаляются.</p>
   </div>`;
}
function clubListHTML(){
  if(!clubRows)return `<p class="help" style="margin:0;padding:12px">Загружаю сообщения…</p>`;
  const ms=clubMsgs();if(!ms.length)return `<div class="mascot-row" style="padding:12px"><div>${catSVG("",70)}</div><div class="speech">Здесь пока тихо. Напишите первым!</div></div>`;
  const mine=new Set(myClub().likes||[]);
  return ms.map(m=>{const me=m.uid===myId;const t=new Date(m.at);
    return `<div class="cmsg ${me?"me":""}"><span class="avatar sm">${esc(m.avatar||"🙂")}</span><div class="cb"><b>${esc(me?"Вы":m.name||"Ученик")}${m.lvl?`<span class="lvl-chip">ур. ${m.lvl}</span>`:""}<small>${t.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})} ${t.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</small></b><div class="t">${trHTML(m.t)}</div>
      <div class="cact"><button class="clike ${mine.has(m.key)?"on":""}" data-clike="${esc(m.key)}" ${me?"disabled":""}>👏 ${m.likes||""}</button>${me||isOwner?`<button data-cdel="${esc(m.key)}">Удалить</button>`:`<button data-crep="${esc(m.key)}">Пожаловаться</button>`}</div></div></div>`}).join("");
}
function clubFixHTML(){
  if(!clubFix)return "";
  if(clubFix.loading)return `<p class="help" style="margin:0">Репетитор проверяет…</p>`;
  if(clubFix.ok)return `<div class="fixbox ok">✅ ${esc(clubFix.note||"Ошибок нет. Отправляйте!")}</div>`;
  return `<div class="fixbox"><b>Лучше так:</b> ${esc(clubFix.fixed)}<br><small>${esc(clubFix.note||"")}</small><button class="btn sm" id="clubUse" style="margin-top:8px">Заменить мой текст</button></div>`;
}
function renderClubList(){const el=$("#clubList");if(!el)return;const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<60;el.innerHTML=clubListHTML();if(atBottom)el.scrollTop=el.scrollHeight}
async function clubWrite(mut){
  const cur=myClub();const doc={name:S.profile.name,avatar:S.profile.avatar,lvl:lvlOf(totalXp()),msgs:(cur.msgs||[]).slice(),likes:(cur.likes||[]).slice()};
  mut(doc);doc.msgs=doc.msgs.slice(-30);doc.likes=doc.likes.slice(-300);
  await DB.doc("chat/"+myId).set(doc);
}
async function clubSend(){
  const inp=$("#clubIn");const t=inp.value.trim().replace(/\s+/g," ");
  if(t.length<2)return;
  if(BAD_RE.test(t)){toast("🚫","Без ссылок и телефонов","Так мы защищаем учеников от спама");return}
  if(Date.now()-clubLast<15000){toast("⏳","Чуть помедленнее","Можно отправлять раз в 15 секунд");return}
  clubLast=Date.now();
  try{await clubWrite(d=>d.msgs.push({id:Date.now().toString(36),t,at:Date.now()}));clubDraft="";inp.value="";clubFix=null;$("#clubFix").innerHTML="";addXp(2);persist();renderTop();setTimeout(()=>{const el=$("#clubList");if(el)el.scrollTop=el.scrollHeight},200)}
  catch(e){toast("⚠️","Не отправилось","Нужен доступ к приложению на уровне «Участник»")}
}
async function clubCheck(){
  const t=$("#clubIn").value.trim();if(!t||!sampleApi||clubBusy)return;
  clubBusy=true;clubFix={loading:true};$("#clubFix").innerHTML=clubFixHTML();
  try{const r=await sampleApi.json(`Ты учитель турецкого для русскоязычных. Ученик хочет ответить на тему «${clubTopic()[1]}». Его текст: «${t}». Проверь грамматику, суффиксы и слова. Ответь только JSON: {"ok":true|false,"fixed":"исправленный текст на турецком","note":"одно короткое объяснение по-русски, до 25 слов"}. Если ошибок нет — ok:true и fixed равен исходному.`,{modelTier:"quick"});
    clubFix={ok:!!r.ok,fixed:String(r.fixed||t).slice(0,300),note:String(r.note||"").slice(0,200)};S.stats.tutor++;}
  catch(e){clubFix=null;toast("⚠️","Репетитор недоступен","Попробуйте позже")}
  clubBusy=false;const f=$("#clubFix");if(f)f.innerHTML=clubFixHTML();const u=$("#clubUse");if(u)u.onclick=()=>{$("#clubIn").value=clubFix.fixed;clubDraft=clubFix.fixed;clubFix=null;$("#clubFix").innerHTML=""};
}
function wireClub(v){
  const inp=$("#clubIn");if(!inp)return;
  inp.oninput=()=>{clubDraft=inp.value};
  v.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>{const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+b.dataset.ck+inp.value.slice(inp.selectionEnd??p);clubDraft=inp.value;inp.focus();inp.setSelectionRange(p+1,p+1)});
  $("#clubSend").onclick=clubSend;const ck=$("#clubCheck");if(ck)ck.onclick=clubCheck;
  const list=$("#clubList");list.scrollTop=list.scrollHeight;
  list.onclick=async e=>{
    const lk=e.target.closest("[data-clike]"),dl=e.target.closest("[data-cdel]"),rp=e.target.closest("[data-crep]");
    if(lk){const k=lk.dataset.clike;try{await clubWrite(d=>{const i=d.likes.indexOf(k);if(i>=0)d.likes.splice(i,1);else d.likes.push(k)})}catch(_){}}
    else if(dl){const [uid,mid]=dl.dataset.cdel.split(":");
      if(uid===myId){try{await clubWrite(d=>{d.msgs=d.msgs.filter(m=>m.id!==mid)})}catch(_){}}
      else if(isOwner){const r=(clubRows||[]).find(x=>x.id===uid);if(r){try{const {id,...rest}=r;await DB.doc("chat/"+uid).set({...rest,msgs:(r.msgs||[]).filter(m=>m.id!==mid)})}catch(_){toast("⚠️","Не удалось удалить","")}}}}
    else if(rp){const [uid,mid]=rp.dataset.crep.split(":");const r=(clubRows||[]).find(x=>x.id===uid);const m=r&&(r.msgs||[]).find(x=>x.id===mid);if(m)openReport({where:"клуб",type:"chat",tr:m.t,ru:"автор: "+(r.name||""),uid})}
  };
}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;if(view==="courses")sub=null;if(view==="cards")Cdeck=null;if(view==="train"&&T.type==="tutor"&&!chatTurns.length)T.type="choice_tr";render();window.scrollTo({top:0})});
const hv=(location.hash||"").slice(1);
if(["courses","cards","train","dict","rating","profile"].includes(hv))view=hv;
render();
initSync();
setTimeout(()=>{if(!S.profile&&!L&&!C&&!window.claude)showOnboarding()},600);
setTimeout(()=>{if(!S.profile&&!L&&!C&&syncMode!=="account")showOnboarding()},11000);

</script>
