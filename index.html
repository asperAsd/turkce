<style>
/* Layout: phone-first learning app. Top stat bar, content column, fixed bottom tab bar; lessons open full-screen with a check panel pinned to the bottom. İznik cobalt + turquoise, chunky pressable buttons. */
:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --ink:#16233A; --muted:#5E6C80; --line:#DCE3EB; --line-strong:#C3CEDA;
  --cobalt:#2255C4; --cobalt-dk:#173F99; --cobalt-soft:#E4ECFB;
  --turq:#12908A; --turq-dk:#0B6B66; --turq-soft:#DDF3F1;
  --ok:#2E9E55; --ok-dk:#1F7A3F; --ok-soft:#DDF4E4;
  --bad:#D9483B; --bad-dk:#A9342A; --bad-soft:#FBE3E0;
  --flame:#F07A12; --gold:#E7A900; --gold-dk:#B98700; --gold-soft:#FFF3CC; --locked:#E3E8EE; --locked-dk:#C5CED8;
  --violet:#7C4CC2;
  --font:"Nunito","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1621; --surface:#18222F; --ink:#E8EEF5; --muted:#9DABBB; --line:#283546; --line-strong:#364658;
  --cobalt:#6F97F2; --cobalt-dk:#3F66C4; --cobalt-soft:#1C2A44;
  --turq:#3FC0B7; --turq-dk:#218C85; --turq-soft:#14302F;
  --ok:#55C77C; --ok-dk:#2F9153; --ok-soft:#163323;
  --bad:#F07B6E; --bad-dk:#B94B40; --bad-soft:#3A1F1C;
  --flame:#FF9A3D; --gold:#F5C542; --gold-dk:#B98A10; --gold-soft:#3A3217; --locked:#26313F; --locked-dk:#1B2430;
  --violet:#A987E6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1621; --surface:#18222F; --ink:#E8EEF5; --muted:#9DABBB; --line:#283546; --line-strong:#364658;
  --cobalt:#6F97F2; --cobalt-dk:#3F66C4; --cobalt-soft:#1C2A44;
  --turq:#3FC0B7; --turq-dk:#218C85; --turq-soft:#14302F;
  --ok:#55C77C; --ok-dk:#2F9153; --ok-soft:#163323;
  --bad:#F07B6E; --bad-dk:#B94B40; --bad-soft:#3A1F1C;
  --flame:#FF9A3D; --gold:#F5C542; --gold-dk:#B98A10; --gold-soft:#3A3217; --locked:#26313F; --locked-dk:#1B2430;
  --violet:#A987E6; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
.app{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:0 110px;min-height:100%}
svg{display:block}
h1,h2,h3{text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;border-bottom:2px solid var(--line)}
.flag{font-weight:900;font-size:14px;letter-spacing:.06em;background:var(--bad);color:#fff;border-radius:8px;padding:4px 8px}
.stats{display:flex;gap:16px;align-items:center}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.stat i{width:22px;height:22px;display:inline-block}
.stat.fire{color:var(--flame)} .stat.fire.off{color:var(--muted)}
.stat.xp{color:var(--gold)}
.lvl-chip{font-size:14px;font-weight:900;color:var(--cobalt);background:var(--cobalt-soft);border-radius:8px;padding:3px 8px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{min-width:0;background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer}
.nav .ic{padding:2px 8px;border-radius:12px}
.nav .ic svg{width:26px;height:26px}
.nav button[aria-selected="true"]{color:var(--cobalt)}
.nav button[aria-selected="true"] .ic{background:var(--cobalt-soft)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:17px;letter-spacing:.03em;text-transform:uppercase;border:2px solid var(--line-strong);border-bottom-width:5px;border-radius:16px;background:var(--surface);color:var(--ink);padding:12px 18px;min-height:54px;cursor:pointer;width:100%}
.btn.sm{font-size:15px;padding:10px 8px;min-height:48px;letter-spacing:0}
.btn:active{transform:translateY(2px);border-bottom-width:3px}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt-dk);color:#fff}
.btn.good{background:var(--ok);border-color:var(--ok-dk);color:#fff}
.btn.badb{background:var(--bad);border-color:var(--bad-dk);color:#fff}
.btn:disabled{background:var(--locked);border-color:var(--locked-dk);color:var(--muted);cursor:default;transform:none}
.link{color:var(--cobalt);font-weight:800}
.back{background:none;border:0;color:var(--cobalt);font-weight:900;font-size:16px;padding:14px 0 0;cursor:pointer;display:flex;align-items:center;gap:4px}
.back svg{width:20px;height:20px}

.sec-title{font-size:26px;font-weight:900;margin:20px 0 4px;line-height:1.2}
.sec-lead{color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.card h3{margin:0 0 4px;font-size:19px;font-weight:900}
.stack{display:flex;flex-direction:column;gap:14px}
.help{font-size:15px;color:var(--muted)}

.goal{margin-top:16px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.goal h3{margin:0;font-size:17px;font-weight:900}
.goal p{margin:0;color:var(--muted);font-size:15px}
.pbar{height:14px;background:var(--locked);border-radius:99px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.pbar.blue i{background:var(--cobalt)}

/* course cards */
.courses{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.course{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;width:100%;cursor:pointer;border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;background:var(--surface);padding:16px}
.course .badge{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff}
.course h3{margin:0;font-size:20px;font-weight:900}
.course .lv{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.course p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.course .meta{display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.course.locked{cursor:default;background:var(--bg)}
.course.locked .badge{background:var(--locked)!important;color:var(--muted)}
.course.locked .badge svg{width:28px;height:28px}
.course.cur{border-color:var(--cobalt)}
.b0{background:#2255C4} .b1{background:#0E7F79} .b2{background:#7C4CC2} .b3{background:#C2582B} .b4{background:#B0306A}
.state-tag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.state-tag.done{background:var(--ok-soft);color:var(--ok-dk)}
.state-tag.now{background:var(--cobalt-soft);color:var(--cobalt)}

/* path */
.unit{margin-top:14px;border-radius:18px;padding:14px 16px;color:#fff;border-bottom:5px solid rgba(0,0,0,.18)}
.unit small{display:block;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85;font-size:13px}
.unit b{font-size:20px;font-weight:900}
.path{display:flex;flex-direction:column;align-items:center;gap:34px;padding-block:26px 6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{position:relative;width:76px;height:70px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:var(--locked);box-shadow:0 7px 0 var(--locked-dk);color:var(--muted)}
.node svg{width:34px;height:34px}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-dk);color:#fff}
.node.cur{background:var(--cobalt);box-shadow:0 7px 0 var(--cobalt-dk);color:#fff}
.node.cur::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--cobalt-soft);pointer-events:none}
.node.exam{width:88px;height:80px}
.node-lbl{margin-top:12px;font-size:14px;font-weight:800;color:var(--muted);text-align:center;max-width:150px;line-height:1.2}
.start-tip{position:absolute;top:-44px;background:var(--surface);color:var(--cobalt);border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-weight:900;font-size:14px;letter-spacing:.05em;white-space:nowrap}
.start-tip::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,18,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
.sheet h2{margin:0;font-size:24px;font-weight:900;line-height:1.2}
.kicker{font-size:13px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.info{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:16px}
.info b.h{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.info.tip{background:var(--turq-soft)}
.words-mini{display:flex;flex-direction:column}

/* word rows */
.wrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow b{font-weight:800;display:block;overflow-wrap:anywhere}
.wrow span{color:var(--muted);font-size:15px;display:block}
.wrow .lv{display:inline-block;font-size:11px;font-weight:900;color:var(--cobalt);background:var(--cobalt-soft);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:middle}

/* lesson */
.lesson{position:fixed;inset:0;z-index:50;background:var(--surface);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top{max-width:680px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding:14px 16px}
.x{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px}
.x svg{width:28px;height:28px}
.l-bar{flex:1;height:18px;background:var(--locked);border-radius:99px;overflow:hidden}
.l-bar i{display:block;height:100%;background:var(--ok);border-radius:99px;position:relative}
.l-bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.combo{font-weight:900;color:var(--flame);font-size:15px;min-width:52px;text-align:right}
.l-body{flex:1;overflow:auto;max-width:680px;width:100%;margin:0 auto;padding:6px 16px 20px;display:flex;flex-direction:column;gap:18px}
.l-title{font-size:24px;font-weight:900;margin:0;line-height:1.25}
.tag{display:inline-block;color:var(--violet);font-weight:900;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
.prompt-row{display:flex;align-items:center;gap:14px}
.say{flex:0 0 auto;width:58px;height:54px;border-radius:14px;border:0;border-bottom:5px solid var(--cobalt-dk);background:var(--cobalt);color:#fff;display:grid;place-items:center;cursor:pointer}
.say.sm{width:46px;height:42px;border-bottom-width:4px}
.say.slow{background:var(--turq);border-bottom-color:var(--turq-dk)}
.say svg{width:28px;height:28px}
.say.sm svg{width:24px;height:24px}
.bubble{border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:22px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.big-listen{display:flex;gap:14px;justify-content:center;padding-block:10px}
.big-listen .say{width:110px;height:96px;border-radius:22px}
.big-listen .say svg{width:48px;height:48px}
.big-listen .say.slow{width:80px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface);padding:14px 16px;font-size:19px;font-weight:700;text-align:left;cursor:pointer;min-height:58px;display:flex;align-items:center;gap:12px}
.opt .k{flex:0 0 auto;width:30px;height:30px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:14px;color:var(--muted);font-weight:800}
.opt.sel{border-color:var(--cobalt);background:var(--cobalt-soft);color:var(--cobalt)}
.opt.sel .k{border-color:var(--cobalt);color:var(--cobalt)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-dk)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-dk)}
.opt:disabled{cursor:default}
.opt.gone{opacity:.35;border-bottom-width:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .opt{justify-content:center;text-align:center;font-size:17px;padding:12px 8px}
.letters .opt{justify-content:center;font-size:22px}
.answer-line{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:8px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--surface);padding:8px 14px;font-size:19px;font-weight:700;cursor:pointer}
.tile.ghost{background:var(--locked);border-color:var(--locked);color:transparent;cursor:default}
.type-in{width:100%;font:700 20px var(--font);padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);min-height:100px;resize:none}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys button{min-width:46px;height:44px;border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;background:var(--surface);font-size:20px;font-weight:800;cursor:pointer}
.big-word{font-size:clamp(30px,9vw,46px);font-weight:900;text-align:center;overflow-wrap:anywhere}
.big-word u{text-decoration:none;color:var(--turq);border-bottom:4px solid var(--turq)}
.rule{font-size:15px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px;margin:0}
.rule b{color:var(--ink)}
.check{border-top:2px solid var(--line);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.check.ok{background:var(--ok-soft);border-color:var(--ok-soft)}
.check.bad{background:var(--bad-soft);border-color:var(--bad-soft)}
.check-in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.verdict{display:flex;gap:12px;align-items:flex-start}
.verdict .badge{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.verdict .badge svg{width:26px;height:26px}
.verdict h4{margin:0;font-size:21px;font-weight:900}
.verdict p{margin:2px 0 0;font-size:17px;font-weight:700}
.check.ok .verdict{color:var(--ok-dk)} .check.bad .verdict{color:var(--bad-dk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .check.ok .verdict{color:var(--ok)} :root:not([data-theme="light"]) .check.bad .verdict{color:var(--bad)}}
:root[data-theme="dark"] .check.ok .verdict{color:var(--ok)} :root[data-theme="dark"] .check.bad .verdict{color:var(--bad)}

.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px;text-align:center;max-width:600px;margin:0 auto;width:100%}
.result h2{font-size:30px;font-weight:900;margin:0}
.result-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.rc{border:2px solid var(--gold);border-radius:16px;overflow:hidden}
.rc small{display:block;background:var(--gold);color:#fff;font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px}
.rc b{display:block;padding:12px 4px;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.rc.t{border-color:var(--turq)} .rc.t small{background:var(--turq)}
.rc.c{border-color:var(--cobalt)} .rc.c small{background:var(--cobalt)}
.big-icon{width:110px;height:110px;display:grid;place-items:center}

/* training */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-card{border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;background:var(--surface);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:120px}
.type-card .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.type-card .ico svg{width:26px;height:26px}
.type-card b{font-size:17px;font-weight:900}
.type-card span{font-size:14px;color:var(--muted);line-height:1.3}
.type-card[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,.search{font:700 17px var(--font);padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:100%}
.range{width:100%;accent-color:var(--cobalt)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-width:0;overflow-wrap:normal;hyphens:auto;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:10px 4px;font-weight:800;font-size:15px;cursor:pointer;line-height:1.2}
.seg button small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft);color:var(--cobalt)}

/* dictionary */
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--surface);padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.topic b{font-size:16px;font-weight:900;line-height:1.2}
.topic span{font-size:13px;color:var(--muted);font-weight:700}

/* rating */
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs2 button{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:10px;font-weight:900;cursor:pointer}
.tabs2 button[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft);color:var(--cobalt)}
.lb{display:flex;flex-direction:column}
.lb-row{display:grid;grid-template-columns:36px 44px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.lb-row:first-child{border-top:0}
.lb-row.me{background:var(--cobalt-soft);border-radius:12px;border-top-color:transparent}
.lb-rank{font-weight:900;font-size:18px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.lb-rank.r1{color:var(--gold)} .lb-rank.r2{color:#8C9AAC} .lb-rank.r3{color:#C47A3A}
.lb-row .avatar{width:44px;height:44px;font-size:24px}
.lb-name{min-width:0}
.lb-name b{display:block;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name span{font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:4px}
.lb-name span i{width:14px;height:14px;display:inline-block;color:var(--flame)}
.lb-xp{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}

/* progress */
.streak-card{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--gold-soft);border-color:transparent}
.streak-card .num{font-size:44px;font-weight:900;color:var(--flame);line-height:1;font-variant-numeric:tabular-nums}
.streak-card p{margin:4px 0 0;color:var(--muted);font-weight:700;font-size:15px}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;grid-column:1/-1}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--muted)}
.wd .dot{width:34px;height:34px;border-radius:50%;background:var(--locked);display:grid;place-items:center}
.wd .dot svg{width:20px;height:20px}
.wd.on .dot{background:var(--flame);color:#fff}
.wd.today{color:var(--ink)}
.wd.today .dot{box-shadow:0 0 0 3px var(--gold-soft),0 0 0 5px var(--flame)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.kpi svg{width:30px;height:30px;flex:0 0 auto}
.kpi b{display:block;font-size:22px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi span{font-size:14px;color:var(--muted);font-weight:700}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{width:100%;height:auto;min-width:300px}
.chart-wrap text{font-family:var(--font);fill:var(--muted);font-size:10px;font-weight:700}
.bar-r{fill:var(--cobalt)} .bar-r.today{fill:var(--turq)}
.goal-line{stroke:var(--gold);stroke-width:2;stroke-dasharray:5 4}
.grid-line{stroke:var(--line);stroke-width:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:12px;font-weight:800;color:var(--muted)}
.cal .c{aspect-ratio:1;max-width:100%;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:800;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.cal .c.l1{background:var(--cobalt-soft);color:var(--cobalt)}
.cal .c.l2{background:var(--cobalt);color:#fff}
.cal .c.l3{background:var(--cobalt-dk);color:#fff}
.cal .c.now{outline:3px solid var(--flame);outline-offset:-3px}
.legend{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-weight:700;justify-content:flex-end;margin-top:8px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.crow{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900}
.crow b{font-weight:900}
.crow small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.crow .pc{font-weight:900;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800}
.toggle input{width:26px;height:26px;accent-color:var(--cobalt)}
.danger{color:var(--bad);font-weight:800;background:none;border:0;cursor:pointer;padding:6px 0;font-size:16px;text-align:left}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;padding:6px 10px;border-radius:10px;background:var(--bg)}

/* tap-to-translate */
.tw{cursor:pointer;border-bottom:2px dotted var(--line-strong);border-radius:2px}
.tw:hover,.tw.on{background:var(--cobalt-soft);border-bottom-color:var(--cobalt)}
.pop{position:fixed;z-index:80;max-width:min(300px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;font-size:16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}
.pop b{display:block;font-size:17px;font-weight:900}
.pop span{display:block;font-weight:600;opacity:.9}
.pop .say{background:var(--cobalt);border-bottom-color:var(--cobalt-dk)}
/* toasts */
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{pointer-events:auto;max-width:520px;width:100%;background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);font-weight:800}
.toast .ti{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);font-size:22px}
.toast small{display:block;color:var(--muted);font-weight:700;font-size:13px}
/* notes */
.note-card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.note-card .sum{font-weight:800;font-size:18px;margin:0}
.note-card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.note-card .exs{background:var(--bg);border-radius:12px;padding:4px 12px}
.note-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.note-head h3{margin:0;font-size:18px;font-weight:900}
.note-head span{font-size:13px;color:var(--muted);font-weight:800;white-space:nowrap}
details.note-card summary{cursor:pointer;list-style:none}
details.note-card summary::-webkit-details-marker{display:none}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:600;border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.consent input{width:24px;height:24px;flex:0 0 auto;accent-color:var(--cobalt);margin:2px 0 0}
/* avatars & profile */
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--cobalt-soft);flex:0 0 auto}
.avatar.sm{width:44px;height:44px;font-size:24px}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.av-grid button{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:24px;cursor:pointer;max-width:100%}
.av-grid button[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft)}
.inp{font:700 18px var(--font);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:100%}
.inp.code{text-transform:uppercase;letter-spacing:.12em}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.prof-head{display:flex;gap:14px;align-items:center}
.prof-head h2{margin:0;font-size:22px;font-weight:900;overflow-wrap:anywhere}
.save-ok{display:flex;gap:8px;align-items:center;font-weight:800;font-size:15px;padding:10px 12px;border-radius:12px}
.save-ok.good{background:var(--ok-soft);color:var(--ok-dk)}
.save-ok.warn{background:var(--gold-soft);color:var(--ink)}
.save-ok svg{width:20px;height:20px;flex:0 0 auto}
.codebox{font-size:28px;font-weight:900;letter-spacing:.16em;text-align:center;background:var(--bg);border:2px dashed var(--line-strong);border-radius:14px;padding:10px;font-variant-numeric:tabular-nums}
.resume{display:flex;gap:12px;align-items:center;margin-top:14px;background:var(--cobalt-soft);border:2px solid var(--cobalt);border-radius:18px;padding:12px 14px}
.resume b{display:block;font-weight:900}
.resume span{font-size:14px;color:var(--muted);font-weight:700}
.resume .btn{width:auto;flex:0 0 auto;min-height:44px;padding:8px 14px;font-size:14px}
/* achievements */
.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 6px;border-radius:16px;background:var(--bg)}
.ach .medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--gold-soft);border:3px solid var(--gold)}
.ach b{font-size:13px;font-weight:900;line-height:1.2}
.ach small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.2}
.ach.locked .medal{background:var(--locked);border-color:var(--locked-dk);filter:grayscale(1);opacity:.55}
.ach.locked b{color:var(--muted)}
/* cards */
.deck{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;background:var(--surface);padding:12px 14px}
.deck .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff}
.deck .ico svg{width:26px;height:26px}
.deck b{display:block;font-weight:900}
.deck small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.ring{width:52px;height:52px}
.ring text{font-family:var(--font);font-weight:900;font-size:13px;fill:var(--ink)}
.ring .bg{stroke:var(--locked)} .ring .fg{stroke:var(--ok)}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.cnt{font-size:12px;font-weight:900;border-radius:6px;padding:1px 7px}
.cnt.new{background:var(--cobalt-soft);color:var(--cobalt)} .cnt.due{background:var(--ok-soft);color:var(--ok-dk)} .cnt.lrn{background:var(--bad-soft);color:var(--bad-dk)}
.flash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:24px 16px;min-height:260px;background:var(--surface)}
.flash .front{font-size:clamp(26px,7vw,38px);font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.flash .back{font-size:22px;font-weight:800;color:var(--turq);overflow-wrap:anywhere}
.flash hr{width:60%;border:0;border-top:2px dashed var(--line)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:8px 4px;font-weight:900;font-size:15px;cursor:pointer;min-width:0}
.grades button small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.grades .g1{border-color:var(--bad);color:var(--bad-dk)} .grades .g2{border-color:var(--gold-dk)} .grades .g3{border-color:var(--ok);color:var(--ok-dk)} .grades .g4{border-color:var(--cobalt);color:var(--cobalt)}
.card-list .wrow{grid-template-columns:auto 1fr auto}
.mini{font-size:12px;font-weight:900;color:var(--muted);white-space:nowrap}
.icon-btn{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px}
.icon-btn svg{width:20px;height:20px}
/* games */
.hang-word{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:30px;font-weight:900}
.hang-word span{min-width:30px;border-bottom:4px solid var(--line-strong);text-align:center;padding:0 2px}
.hang-word span.sp{border:0;min-width:14px}
.lives{display:flex;gap:6px;justify-content:center}
.lives i{width:22px;height:22px;color:var(--bad)} .lives i.off{color:var(--locked)}
.kb{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.kb button{border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;background:var(--surface);font-weight:900;font-size:18px;padding:8px 0;cursor:pointer;min-width:0}
.kb button.hit{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-dk)}
.kb button.miss{background:var(--locked);color:var(--muted)}
.timer{font-size:22px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;color:var(--cobalt)}
/* tutor */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--cobalt);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:2px solid var(--line);border-bottom-left-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-radius:99px;background:var(--surface);padding:6px 12px;font-weight:800;font-size:14px;cursor:pointer}
.chat-in{display:flex;gap:8px;align-items:flex-end}
.chat-in textarea{flex:1;min-width:0;font:600 17px var(--font);padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:none;min-height:52px}
.chat-in .btn{width:auto;flex:0 0 auto}

/* ===== motion ===== */
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.96,1.05) skewX(-2deg)}50%{transform:scale(1.03,.97) skewX(1.5deg)}75%{transform:scale(.98,1.04) skewX(-1deg)}}
@keyframes flickIn{0%,100%{transform:scale(1,1)}50%{transform:scale(.9,1.12)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px rgba(255,140,30,.35))}50%{filter:drop-shadow(0 0 8px rgba(255,140,30,.65))}}
.fl-anim svg{overflow:visible;animation:glow 2.4s ease-in-out infinite}
.fl-anim svg .fo{transform-origin:50% 95%;transform-box:fill-box;animation:flick 1.6s ease-in-out infinite}
.fl-anim svg .fi{transform-origin:50% 95%;transform-box:fill-box;animation:flickIn 1.1s ease-in-out infinite}
svg .fi{fill:#FFD34D}
@keyframes popIn{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes bounceY{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}60%{transform:translateY(-6px)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pulseRing{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spinIn{0%{transform:rotate(-200deg) scale(0)}100%{transform:rotate(0) scale(1)}}
@keyframes lidOpen{0%{transform:rotate(0)}100%{transform:rotate(-38deg) translateY(-6px)}}
@keyframes sparkle{0%{transform:scale(0);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-18px) scaleY(1.05)}50%{transform:translateY(0) scaleY(.94)}}
.anim-in{animation:fadeUp .35s ease-out both}
.check.ok,.check.bad{animation:slideUp .22s ease-out}
.check.bad .verdict{animation:shake .4s ease}
.opt.right{animation:popIn .3s ease-out}
.opt.wrong{animation:shake .35s ease}
.combo{display:inline-flex;align-items:center;gap:3px}
.combo.pop{animation:popIn .35s ease-out}
.combo i{width:18px;height:18px;display:inline-block}
.l-bar i::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);width:40%;animation:shine 2.2s ease-in-out infinite}
.l-bar i{transition:width .45s cubic-bezier(.3,1.4,.6,1)}
.start-tip{animation:bob 1.4s ease-in-out infinite}
.node.cur::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:4px solid var(--cobalt);opacity:.6;animation:pulseRing 1.8s ease-out infinite;pointer-events:none}
.btn,.opt,.tile,.type-card,.deck,.course,.topic{transition:transform .08s ease}
.btn:active,.opt:active,.tile:active,.type-card:active,.deck:active,.topic:active{transform:translateY(2px) scale(.99)}
.big-icon{animation:popIn .55s cubic-bezier(.3,1.6,.5,1) both}
.rc{animation:fadeUp .4s ease-out both}.rc:nth-child(2){animation-delay:.12s}.rc:nth-child(3){animation-delay:.24s}
.toast{animation:fadeUp .3s ease-out}
.toast .ti{animation:spinIn .6s cubic-bezier(.3,1.5,.5,1)}
.ach:not(.locked) .medal{position:relative;overflow:hidden}
.ach:not(.locked) .medal::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.7) 50%,transparent 60%);animation:shine 3.5s ease-in-out infinite}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}
/* mascot */
.cat{display:block}
.cat .eye{transform-origin:center;transform-box:fill-box;animation:blink 4.2s infinite}
.cat .tail{transform-origin:10% 90%;transform-box:fill-box;animation:tail 1.8s ease-in-out infinite}
.cat.happy{animation:jump 1s ease-in-out 2}
.cat-wrap{display:flex;justify-content:center}
.speech{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800;max-width:300px}
.speech::after{content:"";position:absolute;left:24px;bottom:-9px;width:14px;height:14px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.mascot-row{display:flex;gap:10px;align-items:flex-end}
/* streak celebration */
.streak-big{position:relative;width:150px;height:150px;color:var(--flame)}
.streak-big svg{width:150px;height:150px}
.streak-num{font-size:64px;font-weight:900;color:var(--flame);line-height:1;font-variant-numeric:tabular-nums;animation:popIn .5s .3s cubic-bezier(.3,1.6,.5,1) both}
.wk{display:flex;gap:8px;justify-content:center}
.wk span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.wk b{width:30px;height:30px;border-radius:50%;background:var(--locked);display:grid;place-items:center}
.wk b svg{width:18px;height:18px}
.wk span.on b{background:var(--flame);color:#fff;animation:popIn .35s ease-out both}
/* daily quests */
.quests{margin-top:14px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.quests h3{margin:0;font-size:17px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.quests h3 small{font-size:13px;color:var(--muted);font-weight:800}
.quest{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.quest .qi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--gold-soft);font-size:18px}
.quest b{font-size:15px;font-weight:800}
.quest .pbar{height:10px;margin-top:4px}
.quest.done .pbar i{background:var(--ok)}
.chest{display:flex;align-items:center;gap:12px;border:2px dashed var(--gold);border-radius:14px;padding:10px 12px;background:var(--gold-soft);cursor:pointer;width:100%;text-align:left;font-weight:800}
.chest:disabled{cursor:default;opacity:.65}
.chest svg{width:44px;height:44px;flex:0 0 auto}
.chest .lid{transform-origin:15% 100%;transform-box:fill-box}
.chest.open .lid{animation:lidOpen .5s ease-out forwards}
.chest.ready svg{animation:bounceY 1.2s ease-in-out infinite}
/* stories */
.story-line{display:flex;gap:10px;align-items:flex-start;animation:fadeUp .35s ease-out both}
.story-line .who{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:0 0 auto;background:var(--cobalt-soft)}
.story-line.r{flex-direction:row-reverse}
.story-line.r .who{background:var(--turq-soft)}
.story-line .bub{border:2px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0;max-width:80%}
.story-line .bub b{display:block;font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.story-line .bub .t{font-size:19px;font-weight:800;overflow-wrap:anywhere}
.story-line .bub .ru{font-size:15px;color:var(--muted);margin-top:4px}
.story-line .say.sm{width:38px;height:36px}
.story-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;background:var(--surface);padding:12px 14px}
.story-card .ico{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--gold-soft)}
.story-card b{display:block;font-weight:900}
.story-card small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.story-card.locked{opacity:.55;cursor:default}
/* voices */
.voices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.voice{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--surface);padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;min-width:0}
.voice[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft)}
.voice .vi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--bg);flex:0 0 auto}
.voice b{display:block;font-weight:900}
.voice small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.report-link{background:none;border:0;color:inherit;opacity:.75;font-weight:800;font-size:13px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* levels, stars */
.lvl-card{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:12px;background:var(--surface)}
.lvl-badge{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#A560E8,#6C3FD1);color:#fff;display:grid;place-items:center;align-content:center;flex:0 0 auto;box-shadow:0 3px 0 #4E2BA0;position:relative;overflow:hidden}
.lvl-badge::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:shine 3.5s ease-in-out infinite}
.lvl-badge small{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;opacity:.85;line-height:1}
.lvl-badge b{font-size:24px;font-weight:900;line-height:1}
.lvl-t{display:block;font-weight:900;margin-bottom:4px}
.lvl-card .pbar i,.lvl-mini .pbar i{transition:width .8s cubic-bezier(.3,1.2,.6,1)}
.lvl-mini{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-weight:900;font-size:13px;color:var(--violet);width:100%}
.stars{display:block;text-align:center;color:var(--gold);font-size:14px;letter-spacing:1px;line-height:1;margin-top:4px}
.stars i{font-style:normal;color:var(--locked)}
/* club */
.club{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;border:2px solid var(--line);border-radius:18px;padding:12px;background:var(--surface);overscroll-behavior:contain}
.cmsg{display:flex;gap:8px;align-items:flex-start;animation:fadeUp .3s ease-out both}
.cmsg.me{flex-direction:row-reverse}
.cmsg .cb{background:var(--bg);border-radius:14px;padding:8px 10px;max-width:82%;min-width:0}
.cmsg.me .cb{background:var(--cobalt-soft)}
.cmsg .cb>b{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:13px;font-weight:900}
.cmsg .cb>b small{font-weight:700;color:var(--muted);font-size:11px}
.cmsg .t{font-size:17px;font-weight:700;overflow-wrap:anywhere;margin-top:2px}
.lvl-chip{font-size:10px;font-weight:900;color:#fff;background:var(--violet);border-radius:8px;padding:1px 6px}
.cact{display:flex;gap:10px;margin-top:4px}
.cact button{background:none;border:0;padding:2px 0;font:inherit;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}
.cact .clike.on{color:var(--flame)}
.cact .clike:disabled{cursor:default}
.club-topic .t{font-size:20px;font-weight:900}
.kb-mini{display:flex;gap:6px;flex-wrap:wrap}
.kb-mini button{min-width:38px;height:36px;border:2px solid var(--line);border-bottom-width:3px;border-radius:10px;background:var(--surface);font:inherit;font-weight:900;font-size:16px;cursor:pointer}
.fixbox{border:2px solid var(--gold);background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-weight:700}
.fixbox.ok{border-color:var(--ok);background:var(--ok-soft)}
/* wordle */
.wd{display:grid;gap:6px;justify-content:center;margin:4px auto}
.wd-row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,52px));gap:6px}
.wd-row.shake{animation:shake .4s ease}
.wd-row span{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:26px;font-weight:900;background:var(--surface);text-transform:uppercase}
.wd-row span.filled{border-color:var(--line-strong);animation:popIn .15s ease-out}
.wd-row span.c-g{background:#3FA34D;border-color:#2F8A3C;color:#fff}
.wd-row span.c-y{background:#E8B416;border-color:#C99A0C;color:#fff}
.wd-row span.c-x{background:#E05252;border-color:#C23C3C;color:#fff}
.wd-row span.flip{animation:wflip .5s ease both}
@keyframes wflip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.wkb .wide{grid-column:span 2}
.kb button.k-g{background:#3FA34D;border-color:#2F8A3C;color:#fff}
.kb button.k-y{background:#E8B416;border-color:#C99A0C;color:#fff}
.kb button.k-x{background:#E05252;border-color:#C23C3C;color:#fff;opacity:.75}
@media (max-width:380px){.types,.topics{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

"A0-9":{s:"Как рассказать о себе: имя, страна, занятие.",
 p:["Benim adım … — меня зовут … (досл. моё имя …).","Ben Rusum — я русская. Emekliyim — я на пенсии.","Memnun oldum — приятно познакомиться.","-'dan geliyorum — я из …: Rusya'dan geliyorum."],
 e:[["Benim adım Anna.","Меня зовут Анна."],["Ben Rusum.","Я русская."],["Rusya'dan geliyorum.","Я из России."],["Memnun oldum.","Приятно познакомиться."]]},
"A0-10":{s:"Вопросительные слова: что, кто, где, как, когда, сколько, почему.",
 p:["Вопросительное слово обычно стоит перед глаголом или в конце: Adınız ne?","nerede — где, nereye — куда, nereden — откуда.","kaç — сколько (штук), ne kadar — сколько (стоит)."],
 e:[["Adınız ne?","Как вас зовут?"],["Nerede oturuyorsunuz?","Где вы живёте?"],["ne zaman","когда"]]},
"A0-11":{s:"Вопрос «да/нет» и отрицание с существительными.",
 p:["Вопрос задаёт частица mı/mi/mu/mü — пишется отдельно, гласная по гармонии.","Окончание лица присоединяется к частице: Doktor musun? Öğretmen misiniz?","Отрицание для существительных и прилагательных: değil + лицо: doktor değilim."],
 e:[["Doktor musun?","Ты врач?"],["Hayır, doktor değilim.","Нет, я не врач."],["Bu çay mı?","Это чай?"]]},
"A0-12":{s:"Прилагательные стоят перед существительным и не меняются.",
 p:["büyük ev — большой дом, büyük evler — большие дома.","Вопрос: Ev büyük mü? Ответ: Evet, büyük. / Hayır, büyük değil.","çok — «очень» перед прилагательным: çok güzel."],
 e:[["Ev büyük mü?","Дом большой?"],["Hayır, büyük değil.","Нет, не большой."],["güzel","красивый"]]},
"A0-13":{s:"Цены и деньги. Валюта Турции — лира.",
 p:["Ne kadar? — Сколько стоит? Kaç lira? — Сколько лир?","Числа читаем целиком: 250 = iki yüz elli.","pahalı — дорогой, ucuz — дешёвый. На рынке можно торговаться."],
 e:[["Ne kadar?","Сколько стоит?"],["On beş lira.","Пятнадцать лир."],["Çok pahalı!","Очень дорого!"]]},
"A0-14":{s:"Повторение второй недели: рассказ о себе, вопросы, прилагательные, цены.",
 p:["Расскажите о себе 5 предложениями: имя, страна, занятие.","Задайте 3 вопроса с ne, nerede, nasıl.","Скажите, что дорого, а что дёшево."],
 e:[["Benim adım Anna.","Меня зовут Анна."],["Doktor musun?","Ты врач?"],["Ne kadar?","Сколько стоит?"]]},
"A0-15":{s:"Семья и принадлежность: моя мама, наш дом.",
 p:["«Мой» — окончание -(ı)m: anne → annem, kız → kızım, oğul → oğlum.","«Наш» — -(ı)mız: ev → evimiz. Часто вместе с bizim: bizim evimiz.","kardeş — и брат, и сестра. Старшие: abla (сестра), ağabey (брат)."],
 e:[["annem","моя мама"],["kızım","моя дочь"],["torunum","мой внук / моя внучка"],["bizim evimiz","наш дом"]]},
"A0-16":{s:"var — есть, yok — нет. Так говорят «у меня есть».",
 p:["«У меня есть кошка» = Kedim var (досл. моя кошка есть).","«У меня нет машины» = Arabam yok.","Вопрос: Su var mı? — Вода есть?"],
 e:[["İki çocuğum var.","У меня двое детей."],["Arabam yok.","У меня нет машины."],["Su var mı?","Вода есть?"]]},
"A0-17":{s:"Где? Местный падеж: -da / -de / -ta / -te.",
 p:["Гласная по гармонии: a, ı, o, u → -da; e, i, ö, ü → -de.","После глухих f, s, t, k, ç, ş, h, p буква d превращается в t: park → parkta.","У названий городов и стран окончание через апостроф: Türkiye'de."],
 e:[["Evdeyim.","Я дома."],["Kızım işte.","Дочь на работе."],["Türkiye'de","в Турции"],["okulda","в школе"]]},
"A0-18":{s:"В кафе: как заказать и попросить счёт.",
 p:["Заказ: название + lütfen. Bir çay, iki kahve, lütfen.","Menü, lütfen — меню. Hesap, lütfen — счёт.","Çok lezzetli! — очень вкусно. Чай в Турции подают в стаканчиках-тюльпанах."],
 e:[["Menü, lütfen.","Меню, пожалуйста."],["Hesap, lütfen.","Счёт, пожалуйста."],["Çok lezzetli!","Очень вкусно!"]]},
"A0-19":{s:"Дни недели и слова «сегодня, завтра, вчера».",
 p:["Неделя начинается с Pazartesi (понедельник).","Cuma — пятница, Pazar — воскресенье (и «рынок» с маленькой буквы).","bugün — сегодня, yarın — завтра, dün — вчера."],
 e:[["Pazartesi","понедельник"],["Cuma","пятница"],["bugün","сегодня"],["Saat kaç?","Который час?"]]},
"A0-20":{s:"Куда и откуда: дательный -a/-e и исходный -dan/-den.",
 p:["Куда? — -a/-e: ev → eve, market → markete.","Откуда? — -dan/-den: Rusya'dan, evden.","Nereye? — Куда? Nereden? — Откуда?"],
 e:[["Eve gidiyorum.","Я иду домой."],["Markete gidiyorum.","Я иду в магазин."],["Rusya'dan","из России"]]},
"A0-21":{s:"Повторение третьей недели: семья, var/yok, где-куда-откуда, кафе, дни.",
 p:["Расскажите о семье с var и yok.","Скажите, где сейчас каждый член семьи.","Разыграйте заказ в кафе."],
 e:[["Kedim var.","У меня есть кошка."],["Parktayız.","Мы в парке."],["Hesap, lütfen.","Счёт, пожалуйста."]]},
"A0-22":{s:"Глаголы: словарная форма на -mak / -mek.",
 p:["Инфинитив = основа + -mak/-mek: gel-mek, oku-mak.","Чтобы спрягать, отбрасываем -mak/-mek и добавляем окончания.","yemek — и «есть», и «еда»."],
 e:[["gelmek","приходить"],["gitmek","идти, ехать"],["okumak","читать"],["istemek","хотеть"]]},
"A0-23":{s:"Настоящее время -iyor: что происходит сейчас.",
 p:["Основа + -ıyor/-iyor/-uyor/-üyor + лицо: geliyorum, okuyorsun.","Если основа на гласную, -yor присоединяется сразу: oku → okuyor.","Особые: gitmek → gidiyorum (t → d), yemek → yiyorum."],
 e:[["geliyorum","я иду (сюда)"],["Kitap okuyorum.","Я читаю книгу."],["Çay içiyorum.","Я пью чай."]]},
"A0-24":{s:"Отрицание и вопрос в настоящем времени.",
 p:["Отрицание: -m- перед -iyor: gelmiyorum, anlamıyorum.","Вопрос: частица mu + лицо отдельно: Geliyor musun?","Bilmiyorum — я не знаю. Anlamıyorum — я не понимаю."],
 e:[["Anlamıyorum.","Я не понимаю."],["Bilmiyorum.","Я не знаю."],["Geliyor musun?","Ты идёшь?"]]},
"A0-25":{s:"Мой распорядок дня в настоящем времени.",
 p:["sabah — утром, akşam — вечером (без предлога).","kahvaltı yapmak — завтракать, yemek yapmak — готовить.","Порядок слов: время — место — предмет — глагол в конце."],
 e:[["Sabah kalkıyorum.","Утром я встаю."],["Kahvaltı yapıyorum.","Я завтракаю."],["Akşam televizyon izliyorum.","Вечером я смотрю телевизор."]]},
"A0-26":{s:"Фразы-спасатели, когда не понимаешь собеседника.",
 p:["Tekrar eder misiniz? — повторите, пожалуйста.","Yavaş konuşur musunuz? — говорите медленнее.","Biraz Türkçe biliyorum — я немного знаю турецкий."],
 e:[["Tekrar eder misiniz?","Повторите, пожалуйста?"],["Yavaş konuşur musunuz?","Говорите помедленнее?"],["Biraz Türkçe biliyorum.","Я немного знаю турецкий."]]},
"A0-27":{s:"В поездке: дорога, такси, аптека, туалет.",
 p:["… nerede? — Где …?","sağa — направо, sola — налево, düz — прямо.","Аптека — eczane, обычно с вывеской «E» на красном фоне."],
 e:[["Eczane nerede?","Где аптека?"],["Tuvalet nerede?","Где туалет?"],["Taksi, lütfen.","Такси, пожалуйста."]]},
"A0-28":{s:"Повторение четвёртой недели: глаголы и настоящее время.",
 p:["Проспрягайте gelmek и okumak во всех лицах.","Составьте 3 отрицания и 3 вопроса.","Опишите свой день в 5 предложениях."],
 e:[["geliyorum","я иду (сюда)"],["Gitmiyorum.","Я не иду."],["Uyuyorum.","Я сплю."]]},
"A0-29":{s:"Большое повторение всего курса «Старт».",
 p:["Пройдите урок без спешки: слушайте каждое слово.","Ошибки попадут в «Мои ошибки» — повторите их в Тренировке."],
 e:[["Merhaba","Здравствуйте"],["Teşekkür ederim","Спасибо"]]},
"A0-30":{s:"Экзамен курса «Старт». Нужно 80% правильных ответов с первой попытки.",
 p:["Вопросы по всем урокам курса: слова, фразы, окончания.","После сдачи откроется курс A1.","Не получилось — повторите ошибки и попробуйте снова, попыток сколько угодно."],
 e:[["Bol şans!","Удачи!"]]},

"A1-1":{s:"Цвета и любимый цвет.",
 p:["Прилагательное цвета стоит перед словом: kırmızı araba.","kahverengi — досл. «цвета кофе».","En sevdiğim renk … — мой любимый цвет …"],
 e:[["Araba kırmızı.","Машина красная."],["En sevdiğim renk mavi.","Мой любимый цвет — синий."]]},
"A1-2":{s:"Части тела и как сказать, что болит.",
 p:["«Болит» = ağrıyor, к части тела добавляем «мой»: başım ağrıyor.","el — кисть руки, kol — вся рука; ayak — ступня, bacak — нога.","Hastayım — я болею."],
 e:[["Başım ağrıyor.","У меня болит голова."],["Hastayım.","Я болею."]]},
"A1-3":{s:"Одежда и примерка в магазине.",
 p:["Bunu deneyebilir miyim? — можно это примерить?","giymek — надевать, носить. denemek — примерять.","Размер — beden: Hangi beden? — Какой размер?"],
 e:[["Bu elbise çok güzel.","Это платье очень красивое."],["Bunu deneyebilir miyim?","Можно это примерить?"]]},
"A1-4":{s:"Погода и времена года.",
 p:["Hava nasıl? — Какая погода?","Прилагательные на -lı/-li: güneşli (солнечный), yağmurlu (дождливый).","Сезоны: ilkbahar, yaz, sonbahar, kış."],
 e:[["Hava nasıl?","Какая погода?"],["Bugün hava sıcak.","Сегодня жарко."]]},
"A1-5":{s:"Месяцы и даты.",
 p:["Названия месяцев пишутся с большой буквы, когда это дата.","«В мае» = mayısta (местный падеж).","Дата: 5 Mayıs — пятое мая, читается beş mayıs."],
 e:[["Doğum günüm mayısta.","Мой день рождения в мае."],["Ocak","январь"],["Eylül","сентябрь"]]},
"A1-6":{s:"Время на часах.",
 p:["Saat üç — три часа. Saat üç buçuk — 3:30.","«Четверть шестого»: Saat beşi çeyrek geçiyor. «Без десяти пять»: Saat beşe on var.","«Во сколько?» — Saat kaçta? «В семь» — Saat yedide."],
 e:[["Saat üç buçuk.","Половина четвёртого."],["Saat beşe on var.","Без десяти пять."],["Saat yedide.","В семь часов."]]},
"A1-7":{s:"Дом и комнаты.",
 p:["Квартиры считают по комнатам: üç odalı ev — трёхкомнатная.","yatak odası — спальня (досл. комната кровати).","kat — этаж: İkinci katta oturuyorum — я живу на втором этаже."],
 e:[["Üç odalı bir evim var.","У меня трёхкомнатная квартира."],["Mutfak nerede?","Где кухня?"]]},
"A1-8":{s:"Город: важные места.",
 p:["cadde — большая улица, проспект; sokak — улица поменьше.","karşıda — напротив, yanında — рядом.","cami — мечеть, в мечеть заходят без обуви."],
 e:[["Banka nerede?","Где банк?"],["Postane karşıda.","Почта напротив."]]},
"A1-9":{s:"Транспорт и билеты.",
 p:["vapur — городской паром, самый популярный транспорт в Стамбуле.","durak — остановка, istasyon — станция, вокзал.","kalkmak — отправляться, varmak — прибывать."],
 e:[["Bir bilet, lütfen.","Один билет, пожалуйста."],["Otobüs ne zaman kalkıyor?","Когда отправляется автобус?"]]},
"A1-10":{s:"Покупки на рынке и в магазине.",
 p:["tane — штука: iki tane ekmek.","kilo, yarım kilo — килограмм, полкило.","Kartla ödeyebilir miyim? — можно картой?"],
 e:[["Bir kilo domates, lütfen.","Килограмм помидоров, пожалуйста."],["Başka bir şey?","Что-нибудь ещё?"],["Hepsi bu kadar.","Это всё."]]},
"A1-11":{s:"Фрукты и овощи.",
 p:["Турецкие рынки (pazar) работают в определённые дни недели.","salatalık — огурец (досл. «салатный»).","biber — перец; acı biber — острый перец."],
 e:[["elma","яблоко"],["domates","помидор"],["karpuz","арбуз"]]},
"A1-12":{s:"Винительный падеж -ı: конкретный предмет действия.",
 p:["Если предмет определённый — добавляем -ı/-i/-u/-ü: kitabı okuyorum (эту книгу).","После гласной — -yı/-yi: kapı → kapıyı, su → suyu.","Конечные p, ç, t, k часто смягчаются: kitap → kitabı, ekmek → ekmeği.","Неопределённый предмет — без окончания: kitap okuyorum (читаю книги вообще)."],
 e:[["Kitabı okuyorum.","Я читаю эту книгу."],["Kapıyı açıyorum.","Я открываю дверь."],["Seni seviyorum.","Я тебя люблю."]]},
"A1-13":{s:"Дательный падеж -a: куда и кому.",
 p:["-a/-e по гармонии; после гласной -ya/-ye: bahçeye.","Местоимения: bana (мне), sana (тебе), ona (ему).","Смягчение: sokak → sokağa, kitap → kitaba."],
 e:[["Okula gidiyorum.","Я иду в школу."],["Kızıma telefon ediyorum.","Я звоню дочери."],["Bana su verir misiniz?","Дайте мне воды, пожалуйста."]]},
"A1-14":{s:"Исходный падеж -dan: откуда и от чего.",
 p:["-dan/-den, после глухих -tan/-ten: işten.","С … до …: -dan … -a kadar: dokuzdan beşe kadar.","Также «в магазине купить» по-турецки — «из магазина»: marketten almak."],
 e:[["Evden çıkıyorum.","Я выхожу из дома."],["İşten geliyorum.","Я иду с работы."],["Saat dokuzdan beşe kadar çalışıyorum.","Я работаю с девяти до пяти."]]},
"A1-15":{s:"Прошедшее время -dı: что уже случилось.",
 p:["Основа + -dı/-di/-du/-dü + лицо: geldim, geldin, geldi, geldik, geldiniz, geldiler.","После глухих f, s, t, k, ç, ş, h, p — -tı: gittim, içtim.","Отрицание: -ma- : gelmedim, anlamadım."],
 e:[["Dün sinemaya gittim.","Вчера я ходила в кино."],["Ne yaptın?","Что ты сделал(а)?"],["Bir şey anlamadım.","Я ничего не поняла."]]},
"A1-16":{s:"Рассказ о выходных в прошедшем времени.",
 p:["hafta sonu — выходные.","ziyaret etmek — навещать: torunumu ziyaret ettim.","Çok güzeldi! — было очень хорошо (güzel + di)."],
 e:[["Hafta sonu ne yaptın?","Что ты делала на выходных?"],["Parkta yürüdüm.","Я гуляла в парке."],["Çok güzeldi!","Было очень хорошо!"]]},
"A1-17":{s:"Хобби: «я люблю делать что-то».",
 p:["Глагол + -mayı/-meyi seviyorum: okumayı seviyorum.","Многие хобби — с yapmak и etmek: resim yapmak, dans etmek.","Ne yapmayı seviyorsun? — что ты любишь делать?"],
 e:[["Kitap okumayı seviyorum.","Я люблю читать книги."],["Müzik dinlemeyi seviyorum.","Я люблю слушать музыку."]]},
"A1-18":{s:"Чувства и состояния.",
 p:["Состояния часто выражаются прошедшим временем: Acıktım — я проголодалась (уже).","Yoruldum — я устала, Susadım — хочу пить.","Прилагательные: mutlu, üzgün, yorgun + -um: mutluyum."],
 e:[["Acıktım.","Я проголодалась."],["Yoruldum.","Я устала."],["Çok mutluyum.","Я очень счастлива."]]},
"A1-19":{s:"У врача: симптомы и лекарства.",
 p:["Ateşim var — у меня температура (досл. мой жар есть).","… ağrıyor — болит …: boğazım ağrıyor.","Geçmiş olsun! — пожелание выздоровления, говорят всегда больному."],
 e:[["Ateşim var.","У меня температура."],["Boğazım ağrıyor.","У меня болит горло."],["Geçmiş olsun!","Выздоравливайте!"]]},
"A1-20":{s:"Приглашение и договорённость о встрече.",
 p:["-elim mi? — давай(те) …?: gidelim mi?","Ответ: Tabii, olur! — конечно, давай.","Отказ вежливо: Maalesef müsait değilim."],
 e:[["Kahve içmeye gidelim mi?","Пойдём выпьем кофе?"],["Saat kaçta buluşalım?","Во сколько встретимся?"],["Görüşmek üzere!","До встречи!"]]},
"A1-21":{s:"Экзамен A1. Нужно 80% правильных ответов с первой попытки.",
 p:["Вопросы по всем 20 урокам курса.","После сдачи откроется курс A2."],
 e:[["Bol şans!","Удачи!"]]},

"A2-1":{s:"Будущее время -acak / -ecek.",
 p:["Основа + -acak/-ecek + лицо: geleceğim, gideceksin, yapacak.","Перед гласной окончания k → ğ: gideceğim, но gidecek.","Отрицание: -mayacak/-meyecek: gelmeyeceğim."],
 e:[["Yarın ne yapacaksın?","Что ты будешь делать завтра?"],["Akşam seni arayacağım.","Вечером я тебе позвоню."],["Gelmeyeceğim.","Я не приду."]]},
"A2-2":{s:"«Могу» и «не могу»: -abil / -ama.",
 p:["Могу: -abil/-ebil: konuşabilirim, yüzebilirim.","Не могу: -ama/-eme: gelemem, yapamam.","Вежливая просьба: -abilir misiniz? — не могли бы вы?"],
 e:[["Türkçe konuşabiliyorum.","Я могу говорить по-турецки."],["Gelemem.","Я не могу прийти."],["Pencereyi açabilir miyim?","Можно открыть окно?"]]},
"A2-3":{s:"Необходимость: lazım, gerek, -malı.",
 p:["-mam lazım / gerek — мне нужно: gitmem lazım.","-malı/-meli — надо, следует: gitmelisin.","Запрет: -ma + -yın: Acele etmeyin — не торопитесь."],
 e:[["Gitmem lazım.","Мне надо идти."],["Doktora gitmelisin.","Тебе надо к врачу."],["Endişelenme.","Не волнуйся."]]},
"A2-4":{s:"Сравнение: daha и en.",
 p:["daha — более: daha büyük (больше).","«Чем» — исходный падеж: Ankara'dan daha büyük.","en — самый: en güzel (самый красивый)."],
 e:[["İstanbul Ankara'dan daha büyük.","Стамбул больше Анкары."],["Çay kahveden daha ucuz.","Чай дешевле кофе."],["Sence hangisi daha iyi?","Как ты думаешь, что лучше?"]]},
"A2-5":{s:"Широкое время: привычки и предложения.",
 p:["Основа + -ar/-er/-ır/-ir: içerim, giderim, yaparım.","Отрицание особое: içmem, gitmem, yapmam.","Вопрос-предложение: Kahve içer misiniz? — Будете кофе?"],
 e:[["Her sabah çay içerim.","Каждое утро я пью чай."],["Sigara içmem.","Я не курю."],["Kahve içer misiniz?","Будете кофе?"]]},
"A2-6":{s:"Как часто: наречия частотности.",
 p:["her zaman — всегда, genellikle — обычно, bazen — иногда.","hiç — никогда, только с отрицанием: Hiç balık yemem.","haftada iki kez — два раза в неделю."],
 e:[["Hiç balık yemem.","Я никогда не ем рыбу."],["Haftada iki kez yüzerim.","Я плаваю два раза в неделю."]]},
"A2-7":{s:"Описание внешности и характера.",
 p:["Рост: uzun boylu, kısa boylu.","-lı/-li — «с чем-то»: gözlüklü (в очках).","Çok cana yakın biri — очень приятный человек."],
 e:[["Kızım uzun boylu ve sarışın.","Моя дочь высокая и светловолосая."],["Çok cana yakın biri.","Очень приятный человек."]]},
"A2-8":{s:"Профессии и рассказ о работе.",
 p:["Профессии часто на -cı/-ci: muhasebeci, satıcı.","… olarak çalıştım — работала в качестве …","Emekli oldum — вышла на пенсию."],
 e:[["İşiniz ne?","Кем вы работаете?"],["Kırk yıl öğretmen olarak çalıştım.","Сорок лет я работала учителем."]]},
"A2-9":{s:"Ресторан: заказ, вопросы, благодарность.",
 p:["Ne tavsiye edersiniz? — что посоветуете?","Afiyet olsun — приятного аппетита.","Ellerinize sağlık — благодарность тому, кто готовил (досл. здоровья вашим рукам)."],
 e:[["İki kişilik bir masa, lütfen.","Столик на двоих, пожалуйста."],["Ne tavsiye edersiniz?","Что вы посоветуете?"],["Afiyet olsun!","Приятного аппетита!"]]},
"A2-10":{s:"В отеле: заселение и проблемы.",
 p:["Boş odanız var mı? — есть свободные номера?","tek kişilik / iki kişilik oda — одноместный / двухместный.","Не работает — çalışmıyor: Klima çalışmıyor."],
 e:[["Boş odanız var mı?","У вас есть свободные номера?"],["Kahvaltı dahil mi?","Завтрак включён?"],["Anahtarımı kaybettim.","Я потеряла ключ."]]},
"A2-11":{s:"Как пройти: направления.",
 p:["… sokaktan sağa dönün — поверните направо на … улице.","Yürüyerek — пешком; arabayla — на машине.","Kaybolduk — мы заблудились."],
 e:[["Buradan uzak mı?","Это далеко отсюда?"],["İkinci sokaktan sağa dönün.","Поверните направо на второй улице."],["Kaybolduk.","Мы заблудились."]]},
"A2-12":{s:"Разговор по телефону.",
 p:["Alo — алло.","Bey / Hanım после имени — господин / госпожа: Ahmet Bey, Ayşe Hanım.","Sesiniz gelmiyor — вас не слышно."],
 e:[["Ahmet Bey ile görüşebilir miyim?","Можно поговорить с господином Ахметом?"],["Daha sonra ararım.","Я позвоню позже."]]},
"A2-13":{s:"Праздники и поздравления.",
 p:["… kutlu olsun! — с …! (пусть будет счастливым).","İyi ki doğdun! — самое тёплое поздравление с днём рождения.","Başın sağ olsun — соболезнование."],
 e:[["Doğum günün kutlu olsun!","С днём рождения!"],["İyi ki doğdun!","Как хорошо, что ты родилась!"],["Tebrikler!","Поздравляю!"]]},
"A2-14":{s:"Вопросы о жизни в прошедшем времени.",
 p:["Nerede doğdunuz? — где вы родились?","hiç в вопросе — «когда-нибудь»: Hiç gittiniz mi?","Çocukken — в детстве."],
 e:[["Nerede doğdunuz?","Где вы родились?"],["Türkiye'ye hiç gittiniz mi?","Вы когда-нибудь были в Турции?"],["Çocukken köyde yaşadım.","В детстве я жила в деревне."]]},
"A2-15":{s:"Прошедшее на -mış: «говорят», «оказывается».",
 p:["-mış/-miş/-muş/-müş — о том, чего вы не видели сами.","Также для неожиданного открытия: Geç kalmışım — оказывается, я опоздала.","С существительными: güzelmiş — говорят, красивый."],
 e:[["Ahmet evlenmiş.","Ахмет, оказывается, женился."],["Hava soğukmuş.","Говорят, холодно."]]},
"A2-16":{s:"Прошедшее длительное -iyordu.",
 p:["-iyordu = -iyor + -du: izliyordum — я смотрела (в тот момент).","Для фона событий: Sen aradığında uyuyordum.","Eskiden … -iyordum — раньше я (обычно) …"],
 e:[["Televizyon izliyordum.","Я смотрела телевизор."],["Eskiden sigara içiyordum.","Раньше я курила."]]},
"A2-17":{s:"Союзы: и, но, потому что, поэтому, или.",
 p:["ve — и, ama — но, çünkü — потому что.","bu yüzden — поэтому, ya da — или.","hem … hem de — и … и."],
 e:[["Yorgunum ama mutluyum.","Я устала, но я счастлива."],["Hem çay hem de kahve içerim.","Я пью и чай, и кофе."]]},
"A2-18":{s:"До, после, когда: -madan önce, -dıktan sonra, -ınca.",
 p:["Перед: существительное + -dan önce; глагол + -madan önce.","После: -dan sonra; глагол + -dıktan sonra.","Когда: -ınca/-ince: eve gelince."],
 e:[["Yemekten önce ellerini yıka.","Помой руки перед едой."],["Eve gelince seni ararım.","Когда приду домой, позвоню тебе."]]},
"A2-19":{s:"Условие -sa: «если» и «если бы».",
 p:["Реальное условие: широкое время + -sa: yağarsa, istersen.","С var/yok: varsa — если есть.","Нереальное: -sa + -dı в главной части: olsa alırdım.","keşke + -sa — как жаль, что не…"],
 e:[["Zamanın varsa gel.","Если есть время, приходи."],["İstersen yardım ederim.","Если хочешь, я помогу."],["Keşke Türkçeyi daha iyi bilsem.","Хотела бы я лучше знать турецкий."]]},
"A2-20":{s:"Бытовые ситуации дома.",
 p:["bozulmak — сломаться: makine bozuldu.","çağırmak — вызвать (мастера, такси).","Просьба: -ar mısın? — Çöpü çıkarır mısın?"],
 e:[["Çamaşır makinesi bozuldu.","Стиральная машина сломалась."],["Çöpü çıkarır mısın?","Вынесешь мусор?"]]},
"A2-21":{s:"Экзамен A2. Нужно 80% правильных ответов с первой попытки.",
 p:["Вопросы по всем 20 урокам курса A2.","После сдачи откроется курс B1."],
 e:[["Bol şans!","Удачи!"]]},

"B1-1":{s:"Пассив: действие без деятеля.",
 p:["-ıl/-il/-ul/-ül: yapmak → yapılmak.","После гласной или l — -n: okumak → okunmak, bilmek → bilinmek.","Безличное: Burada Türkçe konuşulur — здесь говорят по-турецки."],
 e:[["Bu ev otuz yıl önce yapıldı.","Этот дом построили тридцать лет назад."],["Mektup gönderildi.","Письмо отправлено."]]},
"B1-2":{s:"Причастие -an: «который делает».",
 p:["Основа + -an/-en (после гласной -yan/-yen): gelen, bekleyen.","Работает, когда определяемое слово — сам деятель.","Можно использовать как существительное: Gelen kim?"],
 e:[["Orada oturan kadın annem.","Женщина, которая сидит там, — моя мама."],["Türkçe bilen biri var mı?","Есть кто-нибудь, кто знает турецкий?"]]},
"B1-3":{s:"Причастие -dığı: «который я делаю».",
 p:["Основа + -dık/-dik + принадлежность: okuduğum, okuduğun, okuduğu.","Используется, когда определяемое слово — не деятель.","Söylediklerin — то, что ты сказал(а)."],
 e:[["Okuduğum kitap çok ilginç.","Книга, которую я читаю, очень интересная."],["Yaşadığım şehir küçük.","Город, в котором я живу, маленький."]]},
"B1-4":{s:"Косвенная речь через -dığını / -acağını.",
 p:["«Что он делает» = yaptığını, «что он сделает» = yapacağını.","Söyledi — сказал, sordu — спросил, biliyorum — знаю.","Nerede oturduğunu bilmiyorum — не знаю, где он живёт."],
 e:[["Geleceğini söyledi.","Он сказал, что придёт."],["Hasta olduğunu biliyorum.","Я знаю, что ты болеешь."]]},
"B1-5":{s:"Как выразить мнение, согласие и несогласие.",
 p:["bence — по-моему, sence — по-твоему, bana göre — по моему мнению.","Katılıyorum / Katılmıyorum — согласна / не согласна.","Haklısın — ты прав."],
 e:[["Bana göre bu doğru değil.","По-моему, это неправильно."],["Katılıyorum.","Я согласна."],["Emin değilim.","Я не уверена."]]},
"B1-6":{s:"Здоровье: приём у врача, анализы, давление.",
 p:["Randevu almak — записаться на приём.","-tırmak — сделать через кого-то: tahlil yaptırmak.","Tansiyon — давление, alerji — аллергия."],
 e:[["Randevu almak istiyorum.","Я хочу записаться на приём."],["Tansiyonum yüksek.","У меня высокое давление."]]},
"B1-7":{s:"Путешествие: аэропорт, задержки, багаж.",
 p:["rötar yapmak — задерживаться (о рейсе).","bavul — чемодан, aktarma — пересадка.","gidiş-dönüş — туда и обратно."],
 e:[["Uçağımız rötar yaptı.","Наш рейс задержали."],["Bavulum kayboldu.","Мой чемодан потерялся."]]},
"B1-8":{s:"Вежливые просьбы и жалобы.",
 p:["Rica etsem … — можно попросить …","Kusura bakmayın — извините (не обессудьте).","Возврат и обмен: değiştirmek, geri almak."],
 e:[["Kusura bakmayın.","Извините, пожалуйста."],["Bunu değiştirmek istiyorum.","Я хочу это обменять."]]},
"B1-9":{s:"Понудительный залог -dır / -t: сделать чужими руками.",
 p:["-dır/-dir/-tır: kesmek → kestirmek (подстричься у мастера).","После гласной — -t: yıkamak → yıkatmak.","Также «заставить»: güldürmek — рассмешить."],
 e:[["Saçımı kestirdim.","Я подстриглась."],["Beni güldürdün.","Ты меня рассмешил."]]},
"B1-10":{s:"Взаимный (-ış) и возвратный (-ın) залоги.",
 p:["-ış: друг с другом — görüşmek, tanışmak, barışmak.","-ın: сам себя — giyinmek (одеться), yıkanmak (помыться).","kavga etmek — ссориться."],
 e:[["Tanıştık.","Мы познакомились."],["Giyindim.","Я оделась."]]},
"B1-11":{s:"Новости и СМИ.",
 p:["son dakika — экстренная новость.","hava durumu — прогноз погоды.","Haberleri izlemek — смотреть новости."],
 e:[["Haberleri izledin mi?","Ты смотрела новости?"],["hava durumu","прогноз погоды"]]},
"B1-12":{s:"Природа и экология.",
 p:["çevre — окружающая среда.","geri dönüşüm — переработка.","-malıyız — мы должны."],
 e:[["Çevreyi korumalıyız.","Мы должны беречь природу."],["iklim değişikliği","изменение климата"]]},
"B1-13":{s:"Деньги и банк.",
 p:["hesap açmak — открыть счёт.","para çekmek — снять деньги, havale — перевод.","bozuk para — мелочь."],
 e:[["Hesap açmak istiyorum.","Я хочу открыть счёт."],["döviz kuru","курс валют"]]},
"B1-14":{s:"Устойчивые выражения на каждый день.",
 p:["Kolay gelsin — говорят работающему человеку.","Hayırlı olsun — с покупкой или новым делом.","Hoşuma gidiyor — мне нравится."],
 e:[["Kolay gelsin!","Удачи в работе!"],["Hayırlı olsun!","Пусть будет к добру!"]]},
"B1-15":{s:"Составные глаголы с etmek, vermek.",
 p:["karar vermek — решать, söz vermek — обещать.","dikkat etmek — быть внимательным.","merak etmek — интересоваться и волноваться."],
 e:[["Söz veriyorum.","Обещаю."],["Merak etme.","Не волнуйся."]]},
"B1-16":{s:"Нереальное условие: «если бы».",
 p:["-saydı: bilseydim — если бы я знала.","Главная часть — -ardı/-erdi: söylerdim.","keşke + -saydı — жаль, что не…"],
 e:[["Bilseydim söylerdim.","Если бы я знала, я бы сказала."],["Keşke daha önce başlasaydım.","Жаль, что я не начала раньше."]]},
"B1-17":{s:"-ken (пока) и -arak (делая).",
 p:["-ken: yürürken — когда гуляю; çocukken — в детстве.","-arak/-erek: gülerek — смеясь, koşarak — бегом.","Деепричастие стоит перед главным глаголом."],
 e:[["Yürürken müzik dinlerim.","Когда гуляю, я слушаю музыку."],["Gülerek anlattı.","Она рассказала, смеясь."]]},
"B1-18":{s:"Рассказ о своей жизни.",
 p:["-dıktan sonra — после того как.","-maya başlamak — начать делать.","Hayalim … — моя мечта …"],
 e:[["Emekli olduktan sonra Türkçe öğrenmeye başladım.","Выйдя на пенсию, я начала учить турецкий."],["Hayalim İstanbul'da yaşamak.","Моя мечта — жить в Стамбуле."]]},
"B1-19":{s:"Экзамен B1. Нужно 80% правильных ответов с первой попытки.",
 p:["Вопросы по всем 18 урокам курса B1.","После сдачи откроется курс B2."],
 e:[["Bol şans!","Удачи!"]]},

"B2-1":{s:"Связки для связной речи и письма.",
 p:["öte yandan — с другой стороны, buna rağmen — несмотря на это.","sonuç olarak — в итоге, kısacası — короче говоря.","ayrıca — кроме того, aksine — напротив."],
 e:[["öte yandan","с другой стороны"],["sonuç olarak","в итоге"]]},
"B2-2":{s:"Причина и уступка: -dığı için, -masına rağmen.",
 p:["-dığı için — потому что: yağmur yağdığı için.","-masına rağmen — несмотря на то что.","Geç kaldığım için özür dilerim — извините, что опоздала."],
 e:[["Yağmur yağdığı için dışarı çıkmadık.","Мы не вышли, потому что шёл дождь."],["Pahalı olmasına rağmen aldım.","Хоть и дорого, я купила."]]},
"B2-3":{s:"«Чем больше, тем…» и «вот-вот».",
 p:["-dıkça/-dikçe — чем больше …, тем …","-mak üzere — вот-вот, собираться.","Ben geldiğimde o çıkmıştı — давнопрошедшее для более раннего события."],
 e:[["Türkçe konuştukça daha kolay oluyor.","Чем больше говорю по-турецки, тем легче."],["Tren kalkmak üzere.","Поезд вот-вот отправится."]]},
"B2-4":{s:"Давнопрошедшее -mıştı.",
 p:["-mış + -tı: görmüştüm — я (уже) видела.","Для событий раньше другого момента в прошлом.","Отрицание: görmemiştim."],
 e:[["Daha önce hiç görmemiştim.","Раньше я никогда этого не видела."],["Film başlamıştı.","Фильм уже начался."]]},
"B2-5":{s:"Предположения и вероятность.",
 p:["-malı — должно быть: yolda olmalı.","-abilir — может быть: evde olabilir.","-dır — наверное: yorgundur.","-mış olabilir — возможно, сделал."],
 e:[["Yolda olmalı.","Должно быть, он в пути."],["Unutmuş olabilir.","Возможно, он забыл."]]},
"B2-6":{s:"Работа и карьера.",
 p:["özgeçmiş — резюме, iş görüşmesi — собеседование.","terfi etmek — получить повышение.","ertelenmek — переноситься (о встрече)."],
 e:[["Toplantı ertelendi.","Встреча перенесена."],["iş görüşmesi","собеседование"]]},
"B2-7":{s:"Культура и искусство.",
 p:["sergi — выставка, yönetmen — режиссёр.","etkilemek — производить впечатление, трогать.","derinden — глубоко."],
 e:[["Bu roman beni derinden etkiledi.","Этот роман глубоко меня тронул."]]},
"B2-8":{s:"Общество и его проблемы.",
 p:["toplum — общество, nüfus — население.","göç — миграция, gelenek — традиция.","hoşgörü — терпимость."],
 e:[["kuşak farkı","разница поколений"],["hoşgörü","терпимость"]]},
"B2-9":{s:"Тонкие чувства.",
 p:["hayal kırıklığına uğramak — разочароваться.","gurur duymak — гордиться, pişman olmak — жалеть.","özlemek — скучать по кому-то."],
 e:[["Seni özledim.","Я по тебе соскучилась."],["Gurur duyuyorum.","Я горжусь."]]},
"B2-10":{s:"Турецкие пословицы.",
 p:["Пословицы часто звучат в разговоре — их стоит узнавать на слух.","Многие похожи на русские по смыслу."],
 e:[["Damlaya damlaya göl olur.","Капля за каплей — и озеро."],["Acele işe şeytan karışır.","Поспешишь — людей насмешишь."]]},
"B2-11":{s:"Официальный стиль: заявления и письма.",
 p:["Sayın — уважаемый (в обращении).","dilekçe — заявление, başvuru — заявка.","Saygılarımla — с уважением (подпись)."],
 e:[["Bilgilerinize sunarız.","Доводим до вашего сведения."],["saygılarımla","с уважением"]]},
"B2-12":{s:"Разговорный язык.",
 p:["Ne haber? — как дела? (между друзьями).","Aynen — точно, именно. Boş ver — не бери в голову.","Yok artık! — не может быть!"],
 e:[["Ne haber?","Как дела?"],["Boş ver.","Не бери в голову."]]},
"B2-13":{s:"Дискуссия: аргументы и итоги.",
 p:["Şunu belirtmek isterim ki … — хочу отметить, что …","Bir örnek vereyim — приведу пример.","Konuyu toparlarsak — если подвести итог."],
 e:[["Sizinle aynı fikirde değilim.","Я с вами не согласна."],["Bir örnek vereyim.","Приведу пример."]]},
"B2-14":{s:"Рассказ о Турции и её культуре.",
 p:["-dır в книжной речи — «является»: biridir.","misafirperverlik — гостеприимство.","kıta — континент."],
 e:[["Misafirperverlik Türk kültürünün önemli bir parçasıdır.","Гостеприимство — важная часть турецкой культуры."],["İstanbul iki kıtayı birbirine bağlar.","Стамбул соединяет два континента."]]},
"B2-15":{s:"Экзамен B2 — итоговый. Нужно 80% правильных ответов с первой попытки.",
 p:["Вопросы по всем 14 урокам курса B2.","После сдачи вы прошли все курсы приложения."],
 e:[["Bol şans!","Удачи!"]]}
