  {id:"debate",ic:"⚖️",t:"Спор о туризме",lvl:4,role:"житель Бодрума, недовольный массовым туризмом",goal:"Обсудите плюсы и минусы туризма и предложите решение",open:["Bence turistler bu kasabayı mahvediyor. Sen ne düşünüyorsun?","По-моему, туристы губят этот городок. А ты что думаешь?"]},
  {id:"free",ic:"💬",t:"Свободный разговор",lvl:0,role:"дружелюбная собеседница Айше из Измира",goal:"Поговорите о чём угодно: о себе, планах, погоде, еде",open:["Merhaba! Bugün nasılsın?","Привет! Как ты сегодня?"]}
];
const aiReady=()=>!!sampleApi;
// grammar topics the model may name for a mistake → the lesson that explains it (shown in the scene recap)
const FIX_RULES={pl:"A0-2",be:"A0-8",q:"A0-11",poss:"A0-15",loc:"A0-17",prs:"A0-23",acc:"A1-12",dat:"A1-13",abl:"A1-14",past:"A1-15",gen:"A1-gen",izafet:"A1-izafet",ile:"A1-ile",imp:"A1-emir",fut:"A2-1",abil:"A2-2",need:"A2-3",aor:"A2-5"};
let SC=null;
const CEFR=["A0 (самое начало: простые фразы из 2–5 слов, настоящее время)","A1 (простые предложения, настоящее и прошедшее время)","A2 (бытовые темы, будущее время, -ebil, сравнение)","B1 (связная речь, причастия, условные предложения)","B2 (свободная речь, сложные конструкции)"];
function sceneRules(sc){
  const ci=Math.min(currentCourse(),4);
  return `Ты играешь роль: ${sc.role}. Это учебная сценка для ученика, который учит турецкий; его родной язык — русский. Уровень ученика: ${CEFR[ci]}. Цель ученика в сценке: ${sc.goal}.
Правила:
1. Отвечай только в роли, по-турецки, 1–2 коротких естественных предложения, лексикой уровня ученика. Задавай вопросы, чтобы разговор шёл к цели ученика.
2. Если в последней реплике ученика есть ошибка (падеж, окончание, порядок слов, неверное слово) — заполни fix: you — фраза ученика, better — правильный естественный вариант, why — объяснение по-русски не длиннее 15 слов, rule — тема ошибки, одно из: pl (множественное число), be (аффиксы «быть»), q (вопрос mı), poss (притяжательные окончания), loc (-da), prs (-iyor), acc (-ı), dat (-a), abl (-dan), past (-dı), gen (-ın), izafet (составные слова), ile (-la), imp (повелительное), fut (-acak), abil (-ebil), need (надо, -malı), aor (широкое время), order (порядок слов), word (выбор слова). Отсутствие турецких букв (ç, ş, ğ, ı, ö, ü) и заглавных букв ошибкой не считай. Если ошибок нет — fix: null.
3. Если ученик написал по-русски или не знает, как сказать, ответь в роли очень просто, а в hint дай готовую турецкую фразу.
4. Когда цель ученика достигнута, вежливо заверши сцену в роли и поставь done: true.
5. Не выходи из роли и не пиши ничего, кроме одного JSON-объекта.
Формат ответа — строго JSON: {"reply":"реплика по-турецки","ru":"перевод реплики на русский","fix":null,"hint":"возможный следующий ответ ученика по-турецки","hint_ru":"перевод подсказки","done":false}`;
}
function scenesBlock(){
  if(!FEAT.scenes)return "";
  const a=aimOf(),rec=a?a.sc:[];const cc=currentCourse();
  const list=SCENES.slice().sort((x,y)=>(rec.includes(y.id)-rec.includes(x.id))||(Math.abs(x.lvl-cc)-Math.abs(y.lvl-cc)));
  const done=Object.keys(S.scenes||{}).length;
  const note=aiReady()?"":`<p class="help" style="margin:0">${SRV&&SRV.health?(SRV.me?"Сценки с ИИ скоро заработают на сайте.":"Сценки с ИИ доступны после входа в аккаунт."):WEB?"Сценки с ИИ появятся в полной версии сайта.":"Чтобы играть сценки, разрешите приложению обращаться к Claude."}</p>`;
  return `<h2 class="flabel" style="margin:6px 0 0">Сценки с ИИ${done?` · ${done} из ${SCENES.length}`:""}</h2><p class="help" style="margin:-4px 0 0">Живой диалог по-турецки: ИИ играет роль, вы отвечаете письменно или голосом и сразу видите исправления.</p>${note}
  <div class="scene-row">${list.map(s=>`<button class="scene-card ${aiReady()?"":"off"}" data-scene="${s.id}" ${aiReady()?"":"aria-disabled=\"true\""}><span class="si">${s.ic}</span><b>${esc(s.t)}</b><small>${cshort(Math.min(s.lvl,4))}+${S.scenes&&S.scenes[s.id]?" · ✓":""}</small></button>`).join("")}</div>`;
}
function openScene(id){
  if(!FEAT.scenes)return;
  const sc=SCENES.find(x=>x.id===id);if(!sc)return;
  if(!aiReady()){toast("💬","Сценки пока недоступны",SRV&&SRV.health&&!SRV.me?"Войдите в аккаунт":"Нужен доступ к ИИ");return}
  SC={sc,turns:[{who:"ai",tr:sc.open[0],ru:sc.open[1],hint:null}],raw:[{role:"user",content:sceneRules(sc)},{role:"assistant",content:JSON.stringify({reply:sc.open[0],ru:sc.open[1],fix:null,hint:"",hint_ru:"",done:false})}],busy:false,done:false,mine:0,fixes:0,showRu:false};
  $("#overlay").innerHTML=`<div class="lesson" role="dialog" aria-label="Сценка с ИИ"><div class="l-top"><button class="x" id="scx" aria-label="Закрыть">${I.cross}</button><div class="sc-title"><b>${sc.ic} ${esc(sc.t)}</b></div><button class="btn sm" id="scru" style="width:auto">RU</button></div>
    <div class="l-body" id="scbody"><div class="l-in stack"><div class="info"><b class="h">Ваша задача</b>${esc(sc.goal)}</div><div class="stack" id="scmsgs" style="gap:10px"></div><div id="scEnd"></div></div></div>
    <div class="check" id="sccheck"></div></div>`;
  document.body.style.overflow="hidden";
  $("#scx").onclick=closeScene;$("#scru").onclick=()=>{SC.showRu=!SC.showRu;$("#scru").setAttribute("aria-pressed",SC.showRu);renderScene()};
  renderScene();speak(sc.open[0]);
}
function closeScene(){if(SC&&SC.ctl)try{SC.ctl.abort()}catch(e){}SC=null;$("#overlay").innerHTML="";document.body.style.overflow="";render()}
function sceneMsgHTML(t,i){
  if(t.who==="me")return `<div class="sc-msg me"><div class="bub">${esc(t.text)}</div>${t.fix?`<div class="sc-fix"><span>✏️ Лучше: <b>${esc(t.fix.better)}</b></span>${t.fix.why?`<small>${esc(t.fix.why)}</small>`:""}<button class="link" data-fixcard="${i}">в карточки</button></div>`:t.ok?`<div class="sc-ok">✓ Без ошибок</div>`:""}</div>`;
  if(t.pending)return `<div class="sc-msg ai"><div class="bub typing"><i></i><i></i><i></i></div></div>`;
  return `<div class="sc-msg ai"><div class="bub" data-ru="${esc(t.ru||"")}"><div class="t">${trHTML(t.tr)}</div>${t.ru?`<div class="ru" ${SC.showRu?"":"hidden"}>${esc(t.ru)}</div>`:""}</div><button class="say sm" data-scsay="${i}" aria-label="Послушать">${I.speaker}</button></div>`;
}
function renderScene(){
  if(!SC)return;const box=$("#scmsgs");if(!box)return;
  box.innerHTML=SC.turns.map(sceneMsgHTML).join("");
  box.querySelectorAll("[data-scsay]").forEach(b=>b.onclick=()=>speak(SC.turns[+b.dataset.scsay].tr));
  box.querySelectorAll("[data-fixcard]").forEach(b=>b.onclick=()=>{const f=SC.turns[+b.dataset.fixcard].fix;if(!f)return;if(!S.custom.some(c=>c.tr===f.better&&!c.del)){S.custom.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),tr:f.better,ru:f.why||"исправление из сценки"});persist()}b.outerHTML=`<span class="help" style="margin:0">в карточках ✓</span>`});
  const c=$("#sccheck");const last=[...SC.turns].reverse().find(t=>t.who==="ai"&&!t.pending);
  if(SC.done){c.className="check";c.innerHTML=`<div class="check-in"><button class="btn primary" id="scfin">Завершить сценку</button></div>`;$("#scfin").onclick=finishScene}
  else{
    c.className="check";
    c.innerHTML=`<div class="check-in stack" style="gap:8px">${last&&last.hint?`<button class="sc-hint" id="schint">💡 Подсказка</button>`:""}
      <div class="sc-input"><textarea id="scin" rows="1" maxlength="300" placeholder="Ответьте по-турецки…" ${SC.busy?"disabled":""}></textarea>${ASR?`<button class="icon-btn" id="scmic" aria-label="Сказать голосом" ${SC.busy?"disabled":""}>🎙️</button>`:""}<button class="btn primary" id="scsend" style="width:auto" ${SC.busy?"disabled":""}>➤</button></div>
      ${SC.mine>=3?`<button class="btn sm" id="scstop">Закончить разговор</button>`:""}</div>`;
    const inp=$("#scin");
    $("#scsend").onclick=()=>sceneSend(inp.value);
    inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sceneSend(inp.value)}};
    const h=$("#schint");if(h)h.onclick=()=>{inp.value=last.hint;h.outerHTML=`<p class="help" style="margin:0">💡 ${esc(last.hint)}${last.hint_ru?" — "+esc(last.hint_ru):""}</p>`;inp.focus()};
    const mic=$("#scmic");if(mic)mic.onclick=()=>{try{const a=new ASR();a.lang="tr-TR";a.interimResults=false;mic.classList.add("on");a.onresult=ev=>{inp.value=ev.results[0][0].transcript};a.onend=()=>mic.classList.remove("on");a.onerror=()=>mic.classList.remove("on");a.start()}catch(e){}};
    const st=$("#scstop");if(st)st.onclick=finishScene;
    if(!SC.busy&&matchMedia("(pointer:fine)").matches)inp.focus();
  }
  const end=$("#scEnd");if(end)end.scrollIntoView({block:"end",behavior:reduceMotion()?"auto":"smooth"});
}
const parseJSON=t=>{if(t&&typeof t==="object")return t;const s=String(t||"");const i=s.indexOf("{"),j=s.lastIndexOf("}");if(i<0||j<i)throw new Error("bad json");return JSON.parse(s.slice(i,j+1))};
async function sceneSend(text){
  text=String(text||"").trim().slice(0,300);if(!text||!SC||SC.busy||SC.done)return;
  SC.busy=true;SC.mine++;const me={who:"me",text};SC.turns.push(me);SC.turns.push({who:"ai",pending:true});SC.raw.push({role:"user",content:text});renderScene();
  SC.ctl=new AbortController();let j=null;
  try{
    const out=sampleApi.json?await sampleApi.json(SC.raw,{cache:false,modelTier:"quick",signal:SC.ctl.signal}):(await sampleApi(SC.raw,{cache:false,modelTier:"quick",signal:SC.ctl.signal})).text;
    j=parseJSON(out);if(!j||typeof j.reply!=="string")throw new Error("bad");
  }catch(e){
    if(!SC)return;SC.turns.pop();SC.turns.pop();SC.raw.pop();SC.mine--;SC.busy=false;renderScene();
    const inp=$("#scin");if(inp)inp.value=text;
    toast("⚠️",e&&e.code==="rate_limited"?"Слишком много сообщений подряд":"ИИ не ответил",e&&e.code==="rate_limited"?"Подождите минуту":"Попробуйте отправить ещё раз");return;
  }
  if(!SC)return;
  SC.turns.pop();
  const fix=j.fix&&j.fix.better&&tnorm(j.fix.better)!==tnorm(text)?{better:String(j.fix.better).slice(0,300),why:String(j.fix.why||"").slice(0,200),rule:FIX_RULES[j.fix.rule]?j.fix.rule:null}:null;
  me.fix=fix;me.ok=!fix;if(fix)SC.fixes++;
  SC.turns.push({who:"ai",tr:String(j.reply).slice(0,500),ru:String(j.ru||"").slice(0,500),hint:j.hint?String(j.hint).slice(0,200):"",hint_ru:j.hint_ru?String(j.hint_ru).slice(0,200):""});
  SC.raw.push({role:"assistant",content:JSON.stringify(j)});
  S.stats.tutor++;
  if(j.done===true||SC.mine>=14)SC.done=true;
  SC.busy=false;renderScene();speak(j.reply);
}
function finishScene(){
  if(!SC)return;const sc=SC.sc,mine=SC.mine,fixes=SC.fixes,goal=SC.done;
  if(!mine){closeScene();return}
  const recs=[...new Set(SC.turns.filter(t=>t.who==="me"&&t.fix&&t.fix.rule).map(t=>FIX_RULES[t.fix.rule]))].map(findLesson).filter(Boolean).slice(0,3);
  const xp=Math.min(25,5+mine*2+(goal?5:0));addXp(xp);S.scenes=S.scenes||{};const prev=S.scenes[sc.id]||{};S.scenes[sc.id]={done:(prev.done||0)+1,at:today()};
  questBump("story",1);persist();track("scene_done",{id:sc.id,mine,fixes});
  $("#scbody").innerHTML=`<div class="l-in stack result"><div class="mascot-row" style="justify-content:center"><div class="big-icon">${catSVG("happy",104)}</div><div class="speech">${goal?"Задача выполнена! Harika!":"Хороший разговор!"}</div></div>
    <h2 style="color:var(--gold);text-align:center">Сценка «${esc(sc.t)}»</h2>
    <div class="result-cards">${FEAT.xp?`<div class="rc"><small>Опыт</small><b data-count="${xp}" data-prefix="+">+0</b></div>`:""}<div class="rc"><small>Ваших реплик</small><b>${mine}</b></div><div class="rc"><small>Исправлений</small><b>${fixes}</b></div></div>
    ${fixes?`<div class="info"><b class="h">Запомните</b>${SC.turns.filter(t=>t.who==="me"&&t.fix).map(t=>`<p style="margin:6px 0 0">${esc(t.text)} → <b>${esc(t.fix.better)}</b></p>`).join("")}</div>`:""}
    ${recs.length?`<div class="stack" style="gap:8px"><span class="flabel">Что повторить</span>${recs.map(l=>`<button class="deck" data-reclesson="${l.key}"><span class="ico" style="background:#2255C4">${I.book}</span><div><b>${esc(l.t)}</b><small>${esc(cname(l.ci))} · урок ${l.n}${lessonOpen(l)?"":" · пока закрыт"}</small></div><span style="width:24px;color:var(--muted)">${I.play}</span></button>`).join("")}</div>`:""}</div>`;
  const c=$("#sccheck");c.className="check";c.innerHTML=`<div class="check-in"><button class="btn primary" id="scdone">Готово</button></div>`;$("#scdone").onclick=closeScene;
  $("#scbody").querySelectorAll("[data-reclesson]").forEach(b=>b.onclick=()=>{const k=b.dataset.reclesson;const l=findLesson(k);closeScene();if(l&&lessonOpen(l))openLesson(k);else{view="courses";sub={ci:l?l.ci:0};render()}});
  chime(true);animateCounts($("#scbody"));if(goal)confetti();
}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;if(view==="courses")sub=null;if(view==="cards")Cdeck=null;if(view==="dict"){Dpb=null;Dconj=false}if(view==="train"&&T.type==="tutor"&&!chatTurns.length)T.type="choice_tr";render();window.scrollTo({top:0})});
const hv=(location.hash||"").slice(1);
if(["courses","cards","train","dict","profile","settings"].includes(hv)||(hv==="rating"&&CLUB_ON))view=hv;
if(hv==="conj"&&typeof CONJ!=="undefined"){view="dict";Dconj=true}
applyZoom();applyTheme();applyVolume();render();
if(loadIssue==="broken")setTimeout(()=>toast("⚠️","Сохранённый прогресс повреждён","Начинаем с чистого листа. Если есть файл с прогрессом — восстановите его: Настройки → Данные"),900);
if(!storageOK)showStoreWarn();
else{try{const k=LS+".probe";localStorage.setItem(k,"1");localStorage.removeItem(k)}catch(e){storageFailed(e)}}
initSync();
setTimeout(()=>{if(needsOnboarding()&&!L&&!C&&!window.claude)showOnboarding()},600);
setTimeout(()=>{if(needsOnboarding()&&!L&&!C&&syncMode!=="account")showOnboarding()},11000);

</script>
