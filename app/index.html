 {id:"s3",ci:0,t:"На рынке",d:"Айше покупает овощи",cast:{"Ayşe":"f","Satıcı":"m"},
  lines:[["Satıcı","Buyurun abla, ne istiyorsunuz?","Пожалуйста, что желаете?"],
   ["Ayşe","Domatesler taze mi?","Помидоры свежие?"],
   ["Satıcı","Çok taze! Bugün geldi.","Очень свежие! Сегодня привезли."],
   ["Ayşe","Bir kilo domates ve yarım kilo biber, lütfen.","Килограмм помидоров и полкило перца, пожалуйста."],
   ["Satıcı","Başka?","Что-нибудь ещё?"],
   ["Ayşe","Karpuz kaç lira?","Сколько стоит арбуз?"],
   ["Satıcı","Kilosu on beş lira.","Пятнадцать лир за килограмм."],
   ["Ayşe","Pahalı! Bugün karpuz istemiyorum.","Дорого! Сегодня арбуз не хочу."]],
  q:[["Что купила Айше?",["Помидоры и перец","Арбуз","Огурцы и лук"],0],["Почему Айше не купила арбуз?",["Дорого","Он несвежий","Арбузов нет"],0]]},
 {id:"s4",ci:1,t:"У врача",d:"Анна заболела",cast:{"Anna":"f","Doktor":"m"},
  lines:[["Doktor","Geçmiş olsun. Neyiniz var?","Выздоравливайте. Что с вами?"],
   ["Anna","Başım ağrıyor ve ateşim var.","У меня болит голова и температура."],
   ["Doktor","Ne zamandan beri?","С каких пор?"],
   ["Anna","Dünden beri. Boğazım da ağrıyor.","Со вчерашнего дня. Горло тоже болит."],
   ["Doktor","Grip olmuşsunuz. Bu ilacı günde üç kez için.","У вас грипп. Принимайте это лекарство три раза в день."],
   ["Anna","Teşekkür ederim, doktor bey.","Спасибо, доктор."],
   ["Doktor","Bol su için ve evde dinlenin.","Пейте много воды и отдыхайте дома."]],
  q:[["Что болит у Анны?",["Голова и горло","Живот","Зуб"],0],["Сколько раз в день принимать лекарство?",["Три","Один","Два"],0]]},
 {id:"s5",ci:1,t:"Выходные",d:"Зейнеп и Эмре рассказывают о выходных",cast:{"Zeynep":"f","Emre":"m"},
  lines:[["Emre","Hafta sonu ne yaptın?","Что ты делала на выходных?"],
   ["Zeynep","Cumartesi annemi ziyaret ettim. Pazar günü parkta yürüdüm.","В субботу навестила маму. В воскресенье гуляла в парке."],
   ["Emre","Hava nasıldı?","Какая была погода?"],
   ["Zeynep","Çok güzeldi, güneşliydi. Sen ne yaptın?","Очень хорошая, солнечная. А ты что делал?"],
   ["Emre","Ben evde kaldım. Bir film izledim ve kitap okudum.","Я остался дома. Посмотрел фильм и почитал книгу."],
   ["Zeynep","Hangi filmi izledin?","Какой фильм ты смотрел?"],
   ["Emre","Eski bir Türk filmi. Çok komikti!","Старый турецкий фильм. Было очень смешно!"]],
  q:[["Кого навестила Зейнеп?",["Маму","Подругу","Внука"],0],["Что делал Эмре?",["Сидел дома, смотрел фильм","Гулял в парке","Ездил на море"],0]]},
 {id:"s6",ci:2,t:"Планы на лето",d:"Элиф и Мехмет говорят об отпуске",cast:{"Elif":"f","Mehmet":"m"},
  lines:[["Elif","Yazın ne yapacaksın?","Что ты будешь делать летом?"],
   ["Mehmet","Ailemle Antalya'ya gideceğim. Denize gireceğiz.","Поеду с семьёй в Анталью. Будем купаться в море."],
   ["Elif","Ne güzel! Otel mi tuttunuz?","Как здорово! Вы сняли отель?"],
   ["Mehmet","Hayır, teyzemin evinde kalacağız. Sen?","Нет, будем жить у тёти. А ты?"],
   ["Elif","Ben Kapadokya'yı görmek istiyorum. Balona binmek hayalim.","Я хочу увидеть Каппадокию. Полетать на воздушном шаре — моя мечта."],
   ["Mehmet","Erken rezervasyon yapmalısın, çok kalabalık oluyor.","Бронируй заранее, там очень многолюдно."],
   ["Elif","Haklısın, bu akşam bakacağım.","Ты прав, сегодня вечером посмотрю."]],
  q:[["Куда поедет Мехмет?",["В Анталью","В Каппадокию","В Стамбул"],0],["О чём мечтает Элиф?",["Полетать на воздушном шаре","Искупаться в море","Купить дом у моря"],0]]},
 {id:"s7",ci:1,t:"В такси",d:"Анна едет в отель",cast:{"Taksici":"m","Anna":"f"},
  lines:[["Taksici","İyi akşamlar! Nereye gidiyoruz?","Добрый вечер! Куда едем?"],
   ["Anna","Sultanahmet'e, Deniz Oteli'ne, lütfen.","В Султанахмет, в отель «Дениз», пожалуйста."],
   ["Taksici","Tamam. İstanbul'da ilk defa mısınız?","Хорошо. Вы в Стамбуле впервые?"],
   ["Anna","Evet, ilk defa. Şehir çok büyük ve çok güzel!","Да, впервые. Город очень большой и очень красивый!"],
   ["Taksici","Çok teşekkürler. Biz de İstanbul'u çok seviyoruz.","Большое спасибо. Мы тоже очень любим Стамбул."],
   ["Anna","Otel uzak mı?","Отель далеко?"],
   ["Taksici","Uzak değil ama şimdi trafik var. Yirmi dakika sürer.","Не далеко, но сейчас пробки. Минут двадцать."],
   ["Anna","Kartla ödeyebilir miyim?","Можно оплатить картой?"],
   ["Taksici","Tabii, kart da olur. İşte, geldik!","Конечно, можно и картой. Ну вот, приехали!"],
   ["Anna","Teşekkür ederim. İyi akşamlar!","Спасибо. Хорошего вечера!"]],
  q:[["Куда едет Анна?",["В отель в Султанахмете","В аэропорт","На рынок"],0],["Сколько времени займёт дорога?",["Около 20 минут","Около часа","5 минут"],0],["Как Анна будет платить?",["Картой","Только наличными","Не будет платить"],0]]},
 {id:"s8",ci:2,t:"Жалоба в отеле",d:"У Элиф не работает кондиционер",cast:{"Elif":"f","Resepsiyon":"m"},
  lines:[["Elif","İyi günler. Üç yüz beş numaralı odada kalıyorum.","Добрый день. Я живу в номере 305."],
   ["Resepsiyon","Buyurun efendim, nasıl yardımcı olabilirim?","Слушаю вас, чем могу помочь?"],
   ["Elif","Klima çalışmıyor ve oda çok sıcak. Dün gece hiç uyuyamadım.","Кондиционер не работает, в номере очень жарко. Прошлой ночью я совсем не могла уснуть."],
   ["Resepsiyon","Çok özür dilerim. Hemen teknik servisi gönderiyorum.","Приношу извинения. Сейчас же пришлю мастера."],
   ["Elif","Ayrıca banyoda havlu yoktu.","Кроме того, в ванной не было полотенец."],
   ["Resepsiyon","Kusura bakmayın. On dakika içinde yeni havlu getiriyoruz.","Простите, пожалуйста. В течение десяти минут принесём новые полотенца."],
   ["Elif","Teşekkür ederim. Bir de kahvaltı saat kaçta başlıyor?","Спасибо. И ещё: во сколько начинается завтрак?"],
   ["Resepsiyon","Kahvaltı yedide başlıyor, onda bitiyor. Restoran ikinci katta.","Завтрак с семи до десяти. Ресторан на втором этаже."],
   ["Elif","Çok teşekkürler, iyi çalışmalar!","Большое спасибо, хорошей работы!"]],
  q:[["Что не работает в номере?",["Кондиционер","Душ","Телевизор"],0],["Чего не было в ванной?",["Полотенец","Мыла","Фена"],0],["Во сколько начинается завтрак?",["В 7","В 10","В 8"],0]]},
 {id:"s9",ci:2,t:"Звонок другу",d:"Эмре зовёт Зейнеп в кино",cast:{"Emre":"m","Zeynep":"f"},
  lines:[["Emre","Alo, Zeynep? Merhaba, ben Emre. Müsait misin?","Алло, Зейнеп? Привет, это Эмре. Удобно говорить?"],
   ["Zeynep","Merhaba Emre! Evet, müsaitim. Ne oldu?","Привет, Эмре! Да, удобно. Что случилось?"],
   ["Emre","Bu akşam sinemaya gidelim mi? Yeni bir Türk filmi çıktı.","Пойдём сегодня вечером в кино? Вышел новый турецкий фильм."],
   ["Zeynep","Bu akşam olmaz, annemlere yemeğe gidiyorum. Yarın akşam nasıl?","Сегодня не получится, я иду ужинать к родителям. Как насчёт завтрашнего вечера?"],
   ["Emre","Yarın da olur. Film saat sekizde başlıyor.","Завтра тоже можно. Фильм начинается в восемь."],
   ["Zeynep","Süper! Önce bir şeyler yiyelim mi?","Отлично! Может, сначала перекусим?"],
   ["Emre","İyi fikir. Yedide sinemanın önünde buluşalım.","Хорошая идея. Встретимся в семь у кинотеатра."],
   ["Zeynep","Tamam, anlaştık. Yarın görüşürüz!","Хорошо, договорились. До завтра!"]],
  q:[["Почему Зейнеп не может сегодня?",["Идёт ужинать к родителям","У неё много работы","Она заболела"],0],["Когда и где они встретятся?",["Завтра в 7 у кинотеатра","Сегодня в 8 у дома","Завтра в 8 в кафе"],0]]},
 {id:"s10",ci:3,t:"Ищем квартиру",d:"Анна снимает жильё в Стамбуле",cast:{"Emlakçı":"m","Anna":"f"},
  lines:[["Emlakçı","Hoş geldiniz! Nasıl bir daire arıyorsunuz?","Добро пожаловать! Какую квартиру вы ищете?"],
   ["Anna","Kiralık, iki artı bir bir daire arıyorum. Metroya yakın olursa çok iyi olur.","Ищу в аренду квартиру: две комнаты и гостиная. Если рядом с метро — будет отлично."],
   ["Emlakçı","Bütçeniz ne kadar?","Какой у вас бюджет?"],
   ["Anna","Aylık en fazla otuz bin lira ödeyebilirim.","Могу платить не больше тридцати тысяч лир в месяц."],
   ["Emlakçı","Kadıköy'de tam size göre bir daire var. Tadilatı yeni yapılmış, eşyalı ve balkonlu.","В Кадыкёе есть квартира как раз для вас. Недавно сделан ремонт, с мебелью и балконом."],
   ["Anna","Kulağa hoş geliyor. Depozito ve aidat ne kadar?","Звучит хорошо. А какой залог и плата за обслуживание дома?"],
   ["Emlakçı","İki kira depozito istiyorlar, aidat da bin beş yüz lira.","Залог — две месячные платы, а обслуживание — полторы тысячи лир."],
   ["Anna","Evcil hayvan kabul ediyorlar mı? Bir kedim var.","А с животными можно? У меня есть кошка."],
   ["Emlakçı","Ev sahibi evcil hayvanlara izin veriyor, merak etmeyin. İsterseniz yarın gidip görebiliriz.","Хозяин разрешает животных, не волнуйтесь. Если хотите, завтра можем съездить посмотреть."],
   ["Anna","Harika, yarın öğleden sonra uygunum.","Отлично, завтра после обеда мне удобно."]],
  q:[["Какой у Анны бюджет?",["До 30 000 лир в месяц","1 500 лир в месяц","300 000 лир в год"],0],["Что важно для Анны, кроме цены?",["Метро рядом и можно с кошкой","Вид на море","Гараж"],0],["Когда они поедут смотреть квартиру?",["Завтра после обеда","Сегодня вечером","На выходных"],0]]},
 {id:"s11",ci:3,t:"Собеседование",d:"Мехмет хочет новую работу",cast:{"Selin Hanım":"f","Mehmet":"m"},
  lines:[["Selin Hanım","Hoş geldiniz, Mehmet Bey. Biraz kendinizden bahseder misiniz?","Добро пожаловать, Мехмет-бей. Расскажете немного о себе?"],
   ["Mehmet","Tabii. Üniversitede bilgisayar mühendisliği okudum. Beş yıldır bir yazılım şirketinde çalışıyorum.","Конечно. В университете я учился на программиста. Пять лет работаю в компании, которая делает программы."],
   ["Selin Hanım","Neden işinizi değiştirmek istiyorsunuz?","Почему вы хотите сменить работу?"],
   ["Mehmet","Şu anki işimi seviyorum ama yeni şeyler öğrenebileceğim bir ortam arıyorum.","Мне нравится моя нынешняя работа, но я ищу место, где смогу учиться новому."],
   ["Selin Hanım","Ekip çalışması hakkında ne düşünüyorsunuz?","Что вы думаете о работе в команде?"],
   ["Mehmet","Bence ekip olarak çalışmak çok önemli. Önceki projemde altı kişilik bir ekibi yönettim.","По-моему, работать в команде очень важно. В прошлом проекте я руководил командой из шести человек."],
   ["Selin Hanım","Çok güzel. Peki, bize sormak istediğiniz bir şey var mı?","Прекрасно. А вы хотите нас о чём-нибудь спросить?"],
   ["Mehmet","Evet, uzaktan çalışma imkanı var mı?","Да: есть ли возможность работать удалённо?"],
   ["Selin Hanım","Haftada iki gün evden çalışabilirsiniz. Size bir hafta içinde dönüş yapacağız.","Два дня в неделю можно работать из дома. Мы ответим вам в течение недели."]],
  q:[["Сколько лет Мехмет работает в нынешней компании?",["5 лет","2 года","10 лет"],0],["Почему он хочет сменить работу?",["Хочет учиться новому","Мало платят","Далеко ездить"],0],["Сколько дней можно работать из дома?",["Два в неделю","Каждый день","Ни одного"],0]]},
 {id:"s12",ci:4,t:"Туризм: польза или вред?",d:"Элиф и Мехмет спорят о Бодруме",cast:{"Elif":"f","Mehmet":"m"},
  lines:[["Elif","Her yaz Bodrum'a gelen turist sayısı artıyor. Sence bu kasaba için iyi bir şey mi?","Каждое лето в Бодрум приезжает всё больше туристов. Как думаешь, это хорошо для городка?"],
   ["Mehmet","Ekonomi açısından kesinlikle iyi. Turizm sayesinde binlerce kişi iş buluyor.","С точки зрения экономики — безусловно. Благодаря туризму тысячи людей находят работу."],
   ["Elif","Haklısın ama kiralar o kadar yükseldi ki yerel halk artık burada yaşayamıyor.","Ты прав, но аренда так выросла, что местные жители больше не могут здесь жить."],
   ["Mehmet","Bu doğru. Üstelik yazın su ve elektrik kesintileri de yaşanıyor.","Это правда. К тому же летом бывают перебои с водой и электричеством."],
   ["Elif","Doğanın da zarar gördüğünü düşünüyorum. Koylar her yıl biraz daha kirleniyor.","Думаю, страдает и природа. Бухты с каждым годом всё грязнее."],
   ["Mehmet","Turizmi tamamen durdurmak yerine daha sürdürülebilir hale getirmeliyiz.","Вместо того чтобы полностью остановить туризм, нужно сделать его устойчивым."],
   ["Elif","Mesela?","Например?"],
   ["Mehmet","Belediye turist vergisi alabilir ve bu parayla altyapıyı güçlendirebilir.","Муниципалитет может ввести туристический налог и на эти деньги укрепить инфраструктуру."],
   ["Elif","Bence turistlerin sadece yazın değil, bütün yıl gelmesi daha iyi olur.","По-моему, лучше, чтобы туристы приезжали не только летом, а круглый год."],
   ["Mehmet","Kesinlikle katılıyorum. Kışın da gelirlerse yük daha eşit dağılır.","Полностью согласен. Если будут приезжать и зимой, нагрузка распределится равномернее."]],
  q:[["Какой плюс туризма называет Мехмет?",["Рабочие места","Чистые пляжи","Низкие цены"],0],["Почему местным жителям трудно?",["Выросла аренда","Нет работы","Мало туристов"],0],["Что предлагает Мехмет?",["Туристический налог на инфраструктуру","Запретить туризм","Построить больше отелей"],0]]},
 {id:"s13",ci:0,t:"В пекарне",d:"Айше покупает хлеб",cast:{"Fırıncı":"m","Ayşe":"f"},
  lines:[["Fırıncı","Günaydın! Buyurun.","Доброе утро! Слушаю вас."],
   ["Ayşe","Günaydın! İki ekmek, lütfen.","Доброе утро! Два хлеба, пожалуйста."],
   ["Fırıncı","Sıcak ekmek var, yeni çıktı.","Есть горячий хлеб, только что из печи."],
   ["Ayşe","Çok güzel! Poğaça da var mı?","Отлично! А погача тоже есть?"],
   ["Fırıncı","Var. Peynirli ve zeytinli var.","Есть. С сыром и с оливками."],
   ["Ayşe","Üç peynirli poğaça, lütfen.","Три погачи с сыром, пожалуйста."],
   ["Fırıncı","Başka bir şey?","Что-нибудь ещё?"],
   ["Ayşe","Hayır, teşekkürler. Ne kadar?","Нет, спасибо. Сколько с меня?"],
   ["Fırıncı","Toplam yüz lira.","Всего сто лир."],
   ["Ayşe","Buyurun. Kolay gelsin!","Вот, пожалуйста. Лёгкой работы!"]],
  q:[["Сколько хлеба купила Айше?",["Два","Один","Три"],0],["Какие погачи она взяла?",["С сыром","С оливками","С картошкой"],0],["Сколько она заплатила?",["100 лир","50 лир","200 лир"],0]]},
 {id:"s14",ci:0,t:"Где метро?",d:"Анна спрашивает дорогу",cast:{"Anna":"f","Polis":"m"},
  lines:[["Anna","Affedersiniz, metro nerede?","Простите, где метро?"],
   ["Polis","Çok yakın. Düz gidin, sonra sağa dönün.","Очень близко. Идите прямо, потом поверните направо."],
   ["Anna","Sağa mı, sola mı?","Направо или налево?"],
   ["Polis","Sağa. Metro bankanın yanında.","Направо. Метро рядом с банком."],
   ["Anna","Uzak mı?","Это далеко?"],
   ["Polis","Hayır, uzak değil. Beş dakika.","Нет, недалеко. Пять минут."],
   ["Anna","Çok teşekkür ederim!","Большое спасибо!"],
   ["Polis","Rica ederim. İyi günler!","Не за что. Хорошего дня!"]],
  q:[["Где находится метро?",["Рядом с банком","Рядом с отелем","Рядом с рынком"],0],["Куда нужно повернуть?",["Направо","Налево","Никуда, всё время прямо"],0],["Сколько идти?",["Пять минут","Полчаса","Час"],0]]},
 {id:"s15",ci:0,t:"Новая соседка",d:"Мехмет знакомится с соседкой",cast:{"Fatma Hanım":"f","Mehmet":"m"},
  lines:[["Fatma Hanım","Merhaba! Siz yeni komşu musunuz?","Здравствуйте! Вы новый сосед?"],
   ["Mehmet","Evet, merhaba! Ben Mehmet. Beş numarada oturuyorum.","Да, здравствуйте! Я Мехмет. Живу в пятой квартире."],
   ["Fatma Hanım","Hoş geldiniz! Ben Fatma. Ben de altı numaradayım.","Добро пожаловать! Я Фатма. А я в шестой."],
   ["Mehmet","Memnun oldum, Fatma Hanım.","Очень приятно, Фатма-ханым."],
   ["Fatma Hanım","Ben de memnun oldum. Yalnız mı yaşıyorsunuz?","Мне тоже. Вы живёте один?"],
   ["Mehmet","Hayır, eşim ve kızım da var.","Нет, со мной жена и дочь."],
   ["Fatma Hanım","Ne güzel! Akşam çaya gelin!","Как хорошо! Приходите вечером на чай!"],
   ["Mehmet","Çok teşekkürler, çok naziksiniz!","Большое спасибо, вы очень любезны!"]],
  q:[["В какой квартире живёт Мехмет?",["В пятой","В шестой","В первой"],0],["С кем он живёт?",["С женой и дочерью","Один","С мамой"],0],["Куда Фатма приглашает Мехмета?",["На чай вечером","В кино","На рынок"],0]]},
 {id:"s16",ci:1,t:"В аптеке",d:"Эмре простудился",cast:{"Eczacı":"f","Emre":"m"},
  lines:[["Eczacı","Merhaba, buyurun.","Здравствуйте, слушаю вас."],
   ["Emre","Merhaba. Soğuk algınlığım var. Burnum akıyor ve öksürüyorum.","Здравствуйте. Я простудился. У меня насморк и кашель."],
   ["Eczacı","Geçmiş olsun. Ateşiniz var mı?","Выздоравливайте. Температура есть?"],
   ["Emre","Biraz var, otuz yedi buçuk.","Небольшая, тридцать семь с половиной."],
   ["Eczacı","Bu şurup öksürük için. Günde üç kez, yemekten sonra için.","Этот сироп от кашля. Пейте три раза в день после еды."],
   ["Emre","Burun için de bir şey var mı?","А для носа что-нибудь есть?"],
   ["Eczacı","Bu sprey iyi. Ama beş günden fazla kullanmayın.","Вот хороший спрей. Но не пользуйтесь им дольше пяти дней."],
   ["Emre","Tamam. Reçete lazım mı?","Хорошо. Нужен рецепт?"],
   ["Eczacı","Hayır, reçetesiz alabilirsiniz. Bol çay için ve dinlenin.","Нет, можно без рецепта. Пейте побольше чаю и отдыхайте."]],
  q:[["Что беспокоит Эмре?",["Насморк и кашель","Болит живот","Болит зуб"],0],["Как принимать сироп?",["Три раза в день после еды","Один раз утром","Только перед сном"],0],["Нужен ли рецепт?",["Нет","Да","Только на спрей"],0]]},
 {id:"s17",ci:1,t:"Транспортная карта",d:"Анна покупает İstanbulkart",cast:{"Anna":"f","Görevli":"m"},
  lines:[["Anna","Merhaba, İstanbulkart nereden alabilirim?","Здравствуйте, где можно купить İstanbulkart?"],
   ["Görevli","Şu makineden alabilirsiniz.","Вон в том автомате."],
   ["Anna","Makinede Rusça var mı?","В автомате есть русский язык?"],
   ["Görevli","Evet, Rusça ve İngilizce var.","Да, есть русский и английский."],
   ["Anna","Harika. Karta nasıl para yüklüyorum?","Отлично. А как положить деньги на карту?"],
   ["Görevli","Kartı buraya koyun, sonra parayı makineye verin.","Приложите карту сюда, потом вставьте деньги в автомат."],
   ["Anna","Bir kartla iki kişi binebilir mi?","По одной карте могут проехать двое?"],
   ["Görevli","Evet, binebilirsiniz. Ama her kişi için ayrı ödüyorsunuz.","Да, можно. Но платите за каждого отдельно."],
   ["Anna","Çok teşekkürler, çok yardımcı oldunuz!","Большое спасибо, вы очень помогли!"]],
  q:[["Где купить карту?",["В автомате","У водителя","В аптеке"],0],["Можно ли проехать по одной карте вдвоём?",["Да, но платить за каждого","Нет","Только детям"],0]]},
 {id:"s18",ci:1,t:"У парикмахера",d:"Зейнеп хочет подстричься",cast:{"Kuaför":"m","Zeynep":"f"},
  lines:[["Kuaför","Hoş geldiniz! Bugün ne yapıyoruz?","Добро пожаловать! Что сегодня делаем?"],
   ["Zeynep","Saçlarım çok uzun. Biraz kısaltmak istiyorum.","У меня очень длинные волосы. Хочу немного укоротить."],
   ["Kuaför","Ne kadar keselim?","Сколько отрезаем?"],
   ["Zeynep","Beş santim, lütfen. Çok kısa olmasın.","Пять сантиметров, пожалуйста. Только не слишком коротко."],
   ["Kuaför","Tamam. Fön de yapalım mı?","Хорошо. Укладку феном тоже сделаем?"],
   ["Zeynep","Evet, lütfen. Ne kadar sürer?","Да, пожалуйста. Сколько времени займёт?"],
   ["Kuaför","Yarım saat. Çay ister misiniz?","Полчаса. Хотите чаю?"],
   ["Zeynep","Evet, teşekkürler!","Да, спасибо!"],
   ["Kuaför","Bitti! Nasıl, beğendiniz mi?","Готово! Ну как, нравится?"],
   ["Zeynep","Çok güzel olmuş, ellerinize sağlık!","Очень красиво получилось, золотые руки!"]],
  q:[["Сколько нужно отрезать?",["5 сантиметров","15 сантиметров","Всё коротко"],0],["Сколько займёт работа?",["Полчаса","Два часа","10 минут"],0],["Что значит «Ellerinize sağlık»?",["Благодарность за работу","Пожелание выздоровления","Просьба о скидке"],0]]},
 {id:"s19",ci:1,t:"Сим-карта",d:"Сергей покупает турецкий номер",cast:{"Satıcı":"f","Sergey":"m"},
  lines:[["Satıcı","Hoş geldiniz! Buyurun.","Добро пожаловать! Слушаю вас."],
   ["Sergey","Merhaba. Bir SIM kart istiyorum. Turistim.","Здравствуйте. Мне нужна сим-карта. Я турист."],
   ["Satıcı","Pasaportunuz yanınızda mı?","Паспорт у вас с собой?"],
   ["Sergey","Evet, buyurun. İnternet paketi ne kadar?","Да, вот он. Сколько стоит пакет интернета?"],
   ["Satıcı","Yirmi gigabayt bin lira. Konuşma da var.","Двадцать гигабайт — тысяча лир. Звонки тоже включены."],
   ["Sergey","Bir aylık mı?","Это на месяц?"],
   ["Satıcı","Evet, bir ay geçerli.","Да, действует месяц."],
   ["Sergey","Tamam, alıyorum. Telefonuma takabilir misiniz?","Хорошо, беру. Можете вставить её в мой телефон?"],
   ["Satıcı","Tabii. Bir dakika... Tamam, internet çalışıyor!","Конечно. Минутку... Готово, интернет работает!"]],
  q:[["Что нужно для покупки сим-карты?",["Паспорт","Банковская карта","Ничего"],0],["Сколько гигабайт в пакете?",["20","10","100"],0],["На какой срок пакет?",["Месяц","Неделя","Год"],0]]},
 {id:"s20",ci:1,t:"Подарок для мамы",d:"Элиф и Эмре выбирают подарок",cast:{"Elif":"f","Emre":"m"},
  lines:[["Elif","Emre, cumartesi annemizin doğum günü. Ne alıyoruz?","Эмре, в субботу у мамы день рождения. Что дарим?"],
   ["Emre","Bilmiyorum. Bir kitap mı?","Не знаю. Может, книгу?"],
   ["Elif","Annem çok kitap okumuyor. Çiçek ve pasta alalım.","Мама мало читает. Давай купим цветы и торт."],
   ["Emre","Çiçek güzel ama bir şal da alalım. Annem şal çok seviyor.","Цветы — хорошо, но давай ещё платок. Мама очень любит платки."],
   ["Elif","İyi fikir! Hangi renk?","Хорошая идея! Какого цвета?"],
   ["Emre","Mavi. Annemin gözleri mavi.","Голубой. У мамы голубые глаза."],
   ["Elif","Tamam. Pastayı ben alıyorum, şalı sen al.","Хорошо. Торт покупаю я, а ты купи платок."],
   ["Emre","Anlaştık! Çiçekleri de birlikte alalım.","Договорились! А цветы купим вместе."]],
  q:[["Когда у мамы день рождения?",["В субботу","В воскресенье","Сегодня"],0],["Какой подарок предложил Эмре?",["Голубой платок","Книгу","Духи"],0],["Кто купит торт?",["Элиф","Эмре","Мама"],0]]},
 {id:"s21",ci:2,t:"Потерялся багаж",d:"Чемодан Сергея не прилетел",cast:{"Sergey":"m","Görevli":"f"},
  lines:[["Sergey","Merhaba. Bavulum gelmedi. Moskova uçağıyla geldim.","Здравствуйте. Мой чемодан не прилетел. Я прилетел рейсом из Москвы."],
   ["Görevli","Geçmiş olsun. Bagaj etiketiniz var mı?","Сочувствую. У вас есть багажная бирка?"],
   ["Sergey","Evet, işte burada.","Да, вот она."],
   ["Görevli","Bavulunuz nasıl? Rengi ne?","Какой у вас чемодан? Какого цвета?"],
   ["Sergey","Büyük, siyah bir bavul. Üstünde kırmızı bir kurdele var.","Большой чёрный чемодан. На нём красная ленточка."],
   ["Görevli","Sisteme baktım. Bavulunuz İstanbul'da kalmış. Bu akşam gelecek.","Я посмотрела в системе. Ваш чемодан остался в Стамбуле. Он прилетит сегодня вечером."],
   ["Sergey","Otelime getirebilir misiniz?","Можете привезти его в мой отель?"],
   ["Görevli","Tabii. Otelin adını ve telefon numaranızı bu forma yazın.","Конечно. Напишите в этой форме название отеля и ваш номер телефона."],
   ["Sergey","Tamam. Çok teşekkür ederim.","Хорошо. Большое спасибо."]],
  q:[["Какой у Сергея чемодан?",["Большой чёрный с красной ленточкой","Маленький красный","Синий рюкзак"],0],["Где остался чемодан?",["В Стамбуле","В Москве","В самолёте"],0],["Что пообещали Сергею?",["Привезти чемодан в отель вечером","Вернуть деньги","Ничего"],0]]},
 {id:"s22",ci:2,t:"Отправить посылку",d:"Айше отправляет подарок подруге",cast:{"Ayşe":"f","Görevli":"m"},
  lines:[["Ayşe","İyi günler. Bu paketi Rusya'ya göndermek istiyorum.","Добрый день. Я хочу отправить эту посылку в Россию."],
   ["Görevli","Tabii. İçinde ne var?","Конечно. Что внутри?"],
   ["Ayşe","Bir kitap, lokum ve çay bardakları. Arkadaşıma hediye.","Книга, лукум и стаканчики для чая. Подарок подруге."],
   ["Görevli","Cam var mı? Kırılabilir.","Есть стекло? Оно может разбиться."],
   ["Ayşe","Evet, bardaklar cam. Dikkatli paketleyebilir misiniz?","Да, стаканы стеклянные. Можете аккуратно упаковать?"],
   ["Görevli","Tabii, iyi paketleriz. Paket iki kilo, ücret dokuz yüz lira.","Конечно, хорошо упакуем. Посылка весит два килограмма, стоимость — девятьсот лир."],
   ["Ayşe","Ne zaman varır?","Когда она дойдёт?"],
   ["Görevli","Yaklaşık iki hafta sürer. Bu numarayla takip edebilirsiniz.","Примерно за две недели. По этому номеру можно отслеживать."],
   ["Ayşe","Teşekkürler, kolay gelsin!","Спасибо, лёгкой работы!"]],
  q:[["Что в посылке?",["Книга, лукум и стаканы","Одежда","Документы"],0],["Сколько идёт посылка?",["Около двух недель","Два дня","Два месяца"],0]]},
 {id:"s23",ci:2,t:"У ветеринара",d:"Кошка Анны не ест",cast:{"Veteriner":"m","Anna":"f"},
  lines:[["Veteriner","Merhaba, buyurun. Kedimize ne oldu?","Здравствуйте, проходите. Что случилось с кошкой?"],
   ["Anna","Pamuk iki gündür hiçbir şey yemiyor. Çok yorgun görünüyor.","Памук уже два дня ничего не ест. Выглядит очень уставшей."],
   ["Veteriner","Su içiyor mu?","Воду пьёт?"],
   ["Anna","Biraz içiyor. Dün bir kere kustu.","Немного пьёт. Вчера её один раз вырвало."],
   ["Veteriner","Kaç yaşında? Aşıları tam mı?","Сколько ей лет? Все прививки сделаны?"],
   ["Anna","Üç yaşında. Aşılarını geçen ay yaptırdık.","Три года. Прививки сделали в прошлом месяце."],
   ["Veteriner","Karnı biraz şişmiş. Belki bir şey yuttu. Röntgen çekelim.","Живот немного вздут. Может, она что-то проглотила. Сделаем рентген."],
   ["Anna","Tehlikeli mi? Çok korkuyorum.","Это опасно? Мне очень страшно."],
   ["Veteriner","Merak etmeyin, erken geldiniz. Sonuçlara bakıp karar vereceğiz.","Не волнуйтесь, вы пришли вовремя. Посмотрим на результаты и решим."]],
  q:[["Сколько дней кошка не ест?",["Два дня","Неделю","Один день"],0],["Что предлагает врач?",["Сделать рентген","Сменить корм","Ничего не делать"],0]]},
 {id:"s24",ci:2,t:"Разбился экран",d:"Зейнеп чинит телефон",cast:{"Zeynep":"f","Usta":"m"},
  lines:[["Zeynep","Merhaba. Telefonum yere düştü ve ekranı kırıldı.","Здравствуйте. Телефон упал на пол, и экран разбился."],
   ["Usta","Bir bakayım... Evet, ekranı değiştirmek lazım. Dokunmatik çalışıyor mu?","Дайте посмотрю... Да, экран нужно менять. Сенсор работает?"],
   ["Zeynep","Bazen çalışıyor, bazen çalışmıyor.","Иногда работает, иногда нет."],
   ["Usta","Orijinal ekran üç bin lira, muadili bin beş yüz.","Оригинальный экран — три тысячи лир, аналог — полторы тысячи."],
   ["Zeynep","Orijinal olsun. Ne zaman hazır olur?","Давайте оригинальный. Когда будет готово?"],
   ["Usta","Yarın öğlene kadar hazır olur.","К завтрашнему обеду."],
   ["Zeynep","Fotoğraflarım silinir mi?","Мои фотографии не удалятся?"],
   ["Usta","Hayır, verilerinize dokunmuyoruz. Ama yedek almak her zaman iyi bir fikir.","Нет, ваши данные мы не трогаем. Но сделать резервную копию — всегда хорошая идея."],
   ["Zeynep","Haklısınız. Teşekkür ederim, yarın gelirim.","Вы правы. Спасибо, приду завтра."]],
  q:[["Что случилось с телефоном?",["Разбился экран","Не заряжается","Упал в воду"],0],["Какой экран выбрала Зейнеп?",["Оригинальный за 3 000 лир","Аналог за 1 500 лир","Никакой"],0],["Когда будет готово?",["Завтра к обеду","Через неделю","Через час"],0]]},
 {id:"s25",ci:2,t:"Бабушкин менемен",d:"Бабушка учит Эмре готовить",cast:{"Babaanne":"f","Emre":"m"},
  lines:[["Emre","Babaanne, bana menemen yapmayı öğretir misin?","Бабушка, научишь меня готовить менемен?"],
   ["Babaanne","Tabii, yavrum! Önce iki domates, bir biber ve üç yumurta al.","Конечно, родной! Сначала возьми два помидора, один перец и три яйца."],
   ["Emre","Soğan da koyuyor muyuz?","А лук тоже кладём?"],
   ["Babaanne","Bazıları koyuyor, bazıları koymuyor. Ben koymuyorum.","Кто-то кладёт, кто-то нет. Я не кладу."],
   ["Emre","Tamam. Sonra ne yapıyorum?","Хорошо. А потом что делать?"],
   ["Babaanne","Biberi küçük küçük doğra ve tereyağında kavur. Sonra domatesleri ekle.","Мелко нарежь перец и обжарь на сливочном масле. Потом добавь помидоры."],
   ["Emre","Yumurtaları ne zaman kırıyorum?","А когда разбивать яйца?"],
   ["Babaanne","Domatesler suyunu çekince. Tuz ve biraz pul biber de ekle.","Когда сок от помидоров выпарится. Добавь соль и немного острого перца."],
   ["Emre","Çok güzel kokuyor!","Как вкусно пахнет!"],
   ["Babaanne","Afiyet olsun! Yanında taze ekmek ve çay olsun.","Приятного аппетита! И к нему свежий хлеб и чай."]],
  q:[["Кладёт ли бабушка лук?",["Нет","Да","Только зелёный"],0],["Когда добавлять яйца?",["Когда сок от помидоров выпарится","В самом начале","Уже на тарелке"],0]]},
 {id:"s26",ci:2,t:"Паром на острова",d:"Элиф едет на Принцевы острова",cast:{"Elif":"f","Görevli":"m"},
  lines:[["Elif","Merhaba. Adalara vapur saat kaçta kalkıyor?","Здравствуйте. Во сколько отходит паром на острова?"],
   ["Görevli","Bir sonraki vapur on bir buçukta. Büyükada'ya mı gideceksiniz?","Следующий паром в половине двенадцатого. Вы на Бююкаду?"],
   ["Elif","Evet. Ne kadar sürüyor?","Да. Сколько плыть?"],
   ["Görevli","Yaklaşık bir buçuk saat. İstanbulkart'la binebilirsiniz.","Около полутора часов. Можно проехать по İstanbulkart."],
   ["Elif","Dönüş vapuru kaçta?","А во сколько обратный паром?"],
   ["Görevli","Son vapur akşam yedide. Kaçırmayın!","Последний паром в семь вечера. Не опоздайте!"],
   ["Elif","Adada bisiklet kiralayabilir miyim?","На острове можно взять велосипед напрокат?"],
   ["Görevli","Evet, iskelenin yanında bisikletçiler var.","Да, возле пристани есть прокаты велосипедов."],
   ["Elif","Süper, teşekkürler!","Супер, спасибо!"]],
  q:[["Во сколько следующий паром?",["В 11:30","В 7:00","В 10:00"],0],["Во сколько последний паром обратно?",["В 19:00","В 23:00","В 15:00"],0],["Что можно взять напрокат на острове?",["Велосипед","Машину","Лодку"],0]]},
 {id:"s27",ci:3,t:"Счёт в банке",d:"Сергей открывает счёт",cast:{"Banka görevlisi":"f","Sergey":"m"},
  lines:[["Banka görevlisi","Hoş geldiniz, nasıl yardımcı olabilirim?","Добро пожаловать, чем могу помочь?"],
   ["Sergey","Banka hesabı açmak istiyorum. Türkiye'de yaşıyorum ve maaşımı bu hesaba yatıracaklar.","Хочу открыть счёт. Я живу в Турции, и на этот счёт будут перечислять зарплату."],
   ["Banka görevlisi","İkamet izniniz ve vergi numaranız var mı?","У вас есть вид на жительство и налоговый номер?"],
   ["Sergey","İkamet iznim var. Vergi numarasını nereden alabilirim?","Вид на жительство есть. А где получить налоговый номер?"],
   ["Banka görevlisi","Vergi dairesinden ya da internetten alabilirsiniz. Pasaportla birkaç dakika sürer.","В налоговой или через интернет. С паспортом это занимает несколько минут."],
   ["Sergey","Anladım. Başka hangi belgeler gerekiyor?","Понятно. Какие ещё нужны документы?"],
   ["Banka görevlisi","Adresinizi gösteren bir belge, mesela kira sözleşmesi ya da fatura.","Документ, подтверждающий адрес, например договор аренды или квитанция."],
   ["Sergey","Hesap açılırsa kartı ne zaman alırım?","Если счёт откроют, когда я получу карту?"],
   ["Banka görevlisi","Kart bir hafta içinde adresinize gönderilir. Mobil uygulamayı ise hemen kullanabilirsiniz.","Карту пришлют на ваш адрес в течение недели. А мобильным приложением можно пользоваться сразу."]],
  q:[["Зачем Сергею счёт?",["Получать зарплату","Взять кредит","Купить квартиру"],0],["Чего у Сергея пока нет?",["Налогового номера","Вида на жительство","Паспорта"],0],["Что подойдёт как подтверждение адреса?",["Договор аренды или квитанция","Билет на самолёт","Фото дома"],0]]},
 {id:"s28",ci:3,t:"Шумный сосед",d:"Анна вежливо жалуется соседу",cast:{"Anna":"f","Komşu":"m"},
  lines:[["Anna","İyi akşamlar, rahatsız ediyorum ama sizinle bir konuda konuşmak istiyordum.","Добрый вечер, простите за беспокойство, но я хотела с вами кое о чём поговорить."],
   ["Komşu","Buyurun, ne oldu?","Слушаю, что случилось?"],
   ["Anna","Son günlerde gece geç saatlere kadar müzik sesi geliyor. Sabah erken kalkmam gerekiyor ve uyuyamıyorum.","Последние дни до поздней ночи слышна музыка. Мне рано вставать, а я не могу уснуть."],
   ["Komşu","Çok özür dilerim! Oğlum sınavlara hazırlanırken müzik dinliyor. Sesin bu kadar geldiğini bilmiyordum.","Простите, пожалуйста! Мой сын слушает музыку, пока готовится к экзаменам. Я не знал, что так слышно."],
   ["Anna","Anlıyorum, sınav dönemi zor. Sadece saat on birden sonra sesi biraz kısarsa çok sevinirim.","Понимаю, экзамены — тяжёлое время. Я буду очень рада, если после одиннадцати он сделает потише."],
   ["Komşu","Tabii, hemen söylerim. Kulaklık kullanmasını isteyeceğim.","Конечно, сейчас же скажу. Попрошу его надевать наушники."],
   ["Anna","Anlayışınız için çok teşekkür ederim.","Большое спасибо за понимание."],
   ["Komşu","Asıl ben teşekkür ederim, kibarca söylediğiniz için. Bir sorun olursa yine söyleyin.","Это вам спасибо, что сказали так вежливо. Если что — говорите."]],
  q:[["Почему Анна не может спать?",["По ночам слышна музыка","Лает собака","У соседей ремонт"],0],["Кто слушает музыку?",["Сын соседа","Сам сосед","Соседка"],0],["Что пообещал сосед?",["Сын будет слушать в наушниках","Переехать","Ничего"],0]]},
 {id:"s29",ci:3,t:"Запись к врачу",d:"Эмре звонит в клинику",cast:{"Sekreter":"f","Emre":"m"},
  lines:[["Sekreter","Özel Şifa Hastanesi, buyurun.","Частная больница «Шифа», слушаю вас."],
   ["Emre","Merhaba, dahiliye bölümünden randevu almak istiyorum.","Здравствуйте, я хочу записаться к терапевту."],
   ["Sekreter","Şikayetiniz nedir?","На что жалуетесь?"],
   ["Emre","Bir haftadır midem ağrıyor, özellikle yemekten sonra.","Уже неделю болит желудок, особенно после еды."],
   ["Sekreter","Anladım. Doktor Ahmet Bey'in perşembe sabah saat onda boş yeri var. Uygun mu?","Понятно. У доктора Ахмета есть окно в четверг в десять утра. Вам удобно?"],
   ["Emre","Perşembe çalışıyorum. Öğleden sonra olabilir mi?","В четверг я работаю. А после обеда можно?"],
   ["Sekreter","Cuma günü saat dört buçukta yer var.","В пятницу есть время в половине пятого."],
   ["Emre","Cuma uygun. Aç karnına mı gelmem gerekiyor?","Пятница подходит. Нужно приходить натощак?"],
   ["Sekreter","Kan tahlili yapılabilir, o yüzden dört saat önce bir şey yemeyin. Kimliğinizi de getirmeyi unutmayın.","Возможно, возьмут анализ крови, поэтому за четыре часа ничего не ешьте. И не забудьте удостоверение личности."]],
  q:[["На что жалуется Эмре?",["Болит желудок после еды","Болит спина","Кашель"],0],["На когда он записался?",["Пятница, 16:30","Четверг, 10:00","Понедельник утром"],0],["Что советуют перед приёмом?",["Не есть 4 часа","Не пить воду сутки","Ничего"],0]]},
 {id:"s30",ci:3,t:"Родительское собрание",d:"Папа говорит с учительницей",cast:{"Öğretmen":"f","Baba":"m"},
  lines:[["Öğretmen","Hoş geldiniz. Kerem'in babasısınız, değil mi?","Добро пожаловать. Вы папа Керема, верно?"],
   ["Baba","Evet, merhaba. Kerem'in dersleri nasıl gidiyor?","Да, здравствуйте. Как у Керема с учёбой?"],
   ["Öğretmen","Matematikte çok başarılı, sınıfın en iyilerinden biri.","По математике очень успешен, один из лучших в классе."],
   ["Baba","Buna çok sevindim! Peki, zorlandığı bir ders var mı?","Очень рад! А есть предмет, где ему трудно?"],
   ["Öğretmen","Türkçe okuması biraz yavaş. Evde her gün yirmi dakika kitap okursa çok faydalı olur.","Читает по-турецки медленновато. Если дома он будет читать по двадцать минут в день, это очень поможет."],
   ["Baba","Haklısınız, evde Rusça konuşuyoruz. Ona Türkçe kitaplar alacağım.","Вы правы, дома мы говорим по-русски. Куплю ему турецкие книги."],
   ["Öğretmen","İki dil bilmek büyük bir avantaj. Arkadaşlarıyla da çok iyi anlaşıyor.","Знать два языка — большое преимущество. С друзьями он тоже отлично ладит."],
   ["Baba","Bunu duymak güzel. Bir sorun olursa beni hemen arayabilirsiniz.","Приятно это слышать. Если будут проблемы, звоните мне сразу."]],
  q:[["По какому предмету Керем успешен?",["Математика","Турецкий","Физкультура"],0],["Что советует учительница?",["Читать по-турецки 20 минут в день","Больше решать задачи","Сменить школу"],0],["На каком языке говорят дома?",["По-русски","По-турецки","По-английски"],0]]},
 {id:"s31",ci:3,t:"Обсуждаем сериал",d:"Зейнеп и Эмре спорят о финале",cast:{"Zeynep":"f","Emre":"m"},
  lines:[["Zeynep","Dün akşam dizinin son bölümünü izledin mi?","Ты смотрел вчера последнюю серию?"],
   ["Emre","İzledim ama sonu hiç hoşuma gitmedi.","Смотрел, но конец мне совсем не понравился."],
   ["Zeynep","Neden? Bence çok etkileyiciydi. Ağladım!","Почему? По-моему, было очень трогательно. Я плакала!"],
   ["Emre","Bütün sezon Kerem'in kötü biri olduğunu düşündük, son bölümde birden iyi biri oldu. Bu bana mantıklı gelmedi.","Весь сезон мы думали, что Керем плохой, а в последней серии он вдруг стал хорошим. Мне это показалось нелогичным."],
   ["Zeynep","Ama aslında ipuçları vardı. Annesiyle konuştuğu sahneyi hatırlıyor musun?","Но ведь были подсказки. Помнишь сцену, где он говорит с мамой?"],
   ["Emre","Haklı olabilirsin. Belki o sahneyi tekrar izlemeliyim.","Может, ты и права. Наверное, стоит пересмотреть ту сцену."],
   ["Zeynep","Yeni sezon ne zaman başlıyor, biliyor musun?","Не знаешь, когда начнётся новый сезон?"],
   ["Emre","Duyduğuma göre eylülde. Ama oyuncuların yarısı değişecekmiş.","Говорят, в сентябре. Но вроде бы половина актёров сменится."],
   ["Zeynep","Olamaz! O zaman izler miyim, bilmiyorum.","Не может быть! Тогда не знаю, буду ли смотреть."]],
  q:[["Понравился ли Эмре финал?",["Нет","Да","Он его не видел"],0],["Что смутило Эмре?",["Керем вдруг стал хорошим","Плохая музыка","Слишком короткая серия"],0],["Когда начнётся новый сезон?",["В сентябре","Завтра","Через год"],0]]},
 {id:"s32",ci:4,t:"Задержка рейса",d:"Анна добивается своих прав",cast:{"Anna":"f","Görevli":"m"},
  lines:[["Anna","Merhaba. Antalya uçağımız dört saattir rötar yapıyor ve hiçbir açıklama yapılmadı.","Здравствуйте. Наш рейс в Анталью задерживается уже четыре часа, и никаких объяснений не было."],
   ["Görevli","Yaşadığınız mağduriyet için özür dileriz. Teknik bir arıza nedeniyle yedek uçak bekleniyor.","Приносим извинения за неудобства. Из-за технической неисправности ждём резервный самолёт."],
   ["Anna","Anlıyorum, ama bu süre zarfında yolculara yiyecek ve içecek verilmesi gerekmiyor mu?","Понимаю, но разве за это время пассажирам не положены еда и напитки?"],
   ["Görevli","Haklısınız. Biniş kartınızı gösterirseniz size yemek kuponu verebilirim.","Вы правы. Если покажете посадочный талон, я выдам вам талон на питание."],
   ["Anna","Teşekkürler. Ayrıca aktarmalı uçuşumu kaçıracağım. Bu konuda ne yapabilirsiniz?","Спасибо. Кроме того, я опоздаю на стыковочный рейс. Что вы можете сделать?"],
   ["Görevli","Sizi ücretsiz olarak bir sonraki uçuşa aktarabiliriz. Gerekirse otel konaklaması da sağlanır.","Мы бесплатно пересадим вас на следующий рейс. При необходимости предоставим и гостиницу."],
   ["Anna","Peki, gecikme nedeniyle tazminat talep edebilir miyim?","А могу ли я потребовать компенсацию за задержку?"],
   ["Görevli","Yönetmeliğe göre bu hakkınız var. Başvurunuzu web sitemizdeki form üzerinden yapabilirsiniz.","По правилам у вас есть такое право. Заявление можно подать через форму на нашем сайте."],
   ["Anna","O zaman lütfen bana yazılı bir gecikme belgesi verin; başvuruda lazım olacak.","Тогда дайте мне, пожалуйста, письменную справку о задержке — она понадобится для заявления."],
   ["Görevli","Elbette, hemen hazırlıyorum.","Конечно, сейчас подготовлю."]],
  q:[["Почему задерживается рейс?",["Техническая неисправность","Плохая погода","Забастовка"],0],["Что Анна получает сразу?",["Талон на питание","Деньги наличными","Место в бизнес-классе"],0],["Зачем ей справка о задержке?",["Для заявления на компенсацию","Для работы","Для визы"],0]]},
 {id:"s33",ci:4,t:"Удалёнка или офис?",d:"Селин и Джан спорят о работе из дома",cast:{"Can":"m","Selin":"f"},
  lines:[["Can","Şirket herkesin haftada dört gün ofise gelmesini istiyor. Sen ne düşünüyorsun?","Компания хочет, чтобы все приходили в офис четыре дня в неделю. Что ты думаешь?"],
   ["Selin","Açıkçası hiç memnun değilim. Evden çalışırken çok daha verimliyim, yolda da iki saat kaybetmiyorum.","Честно говоря, я совсем не довольна. Дома я работаю гораздо продуктивнее и не теряю два часа на дорогу."],
   ["Can","Haklısın, ama ofiste fikir alışverişi daha kolay oluyor. Online toplantılarda insanlar pek konuşmuyor.","Ты права, но в офисе проще обмениваться идеями. На онлайн-встречах люди почти не говорят."],
   ["Selin","Bence bu, toplantıların nasıl yönetildiğiyle ilgili. İyi bir moderatör olursa herkes katılır.","По-моему, дело в том, как ведут встречи. С хорошим модератором участвуют все."],
   ["Can","Yeni başlayanlar için de ofis önemli. Deneyimli birinin yanında oturmak çok şey öğretiyor.","Для новичков офис тоже важен. Сидеть рядом с опытным человеком многому учит."],
   ["Selin","Bu konuda sana katılıyorum. Belki hibrit bir model en adil çözüm olur: haftada iki gün ofis, üç gün ev.","Тут я с тобой согласна. Может, гибридная модель будет самым честным решением: два дня в офисе, три дома."],
   ["Can","Bunu yönetime önermeliyiz. Ama somut verilerle gitmezsek ikna olmazlar.","Надо предложить это руководству. Но без конкретных данных их не убедить."],
   ["Selin","O zaman ekipte kısa bir anket yapalım ve sonuçları sunalım.","Тогда давай проведём в команде короткий опрос и представим результаты."]],
  q:[["Почему Селин против офиса?",["Дома она продуктивнее и не тратит время на дорогу","Не любит коллег","Офис слишком маленький"],0],["С чем Селин соглашается?",["Офис важен для новичков","Онлайн-встречи бесполезны","Нужно 4 дня в офисе"],0],["Что они решают сделать?",["Провести опрос и предложить гибридный формат","Уволиться","Ничего не менять"],0]]}

 ["Kolay mı?","Турецкий кажется трудным из-за длинных слов, но окончания очень регулярные: выучив правило гармонии гласных, вы поймёте тысячи слов."],
];

// Turkish verb conjugation by rule, for the «Спряжение» tool and its drills.
// Covers the tenses of the course (A0–B2) in four forms: affirmative, negative, question, negative question.
// Irregular corners handled: ye-/de- (yiyor, diyecek), t→d before a vowel (gidiyor, ediyor, kaybediyor),
// the 13 one-syllable verbs with aorist -ır (gelir, alır…), compound verbs written in two words (yardım etmek).
const CONJ = (() => {
  const V = "aeıioöuü", BACK = "aıou", HARD = "fstkçşhp";
  const lastV = s => { for (let i = s.length - 1; i >= 0; i--) if (V.includes(s[i])) return s[i]; return "e"; };
  const h4 = s => ({ a: "ı", ı: "ı", o: "u", u: "u", e: "i", i: "i", ö: "ü", ü: "ü" })[lastV(s)];
  const a2 = s => BACK.includes(lastV(s)) ? "a" : "e";
  const endsV = s => V.includes(s[s.length - 1]);
  const nVow = s => [...s].filter(c => V.includes(c)).length;
  const AOR_IR = new Set(["al", "bil", "bul", "dur", "gel", "gör", "kal", "ol", "öl", "san", "ver", "var", "vur"]);
  // t→d before a vowel: only these stems (not satmak, tutmak, öğretmek…)
  const SOFT = new Set(["git", "et", "tat", "güt", "dit", "affet", "kaybet", "hisset", "seyret", "reddet", "keşfet", "hallet", "zannet", "sabret", "terket", "emret", "naklet", "şükret", "kahret"]);
  const soft = st => SOFT.has(st) ? st.slice(0, -1) + "d" : st;
  const yeDe = st => st === "ye" || st === "de";
  // stem before a suffix that starts with a vowel (adds the y buffer after a vowel)
  const vbase = st => yeDe(st) ? st[0] + "iy" : endsV(st) ? st + "y" : soft(st);
  const PERS = ["ben", "sen", "o", "biz", "siz", "onlar"];

  function parse(input) {
    const s = String(input || "").toLocaleLowerCase("tr").replace(/\s+/g, " ").trim();
    if (!s || !/^[a-zçğıöşüâîû ]+$/.test(s)) return null;
    const parts = s.split(" "); const last = parts.pop(); const pre = parts.length ? parts.join(" ") + " " : "";
    let stem = /m[ae]k$/.test(last) && last.length > 3 ? last.slice(0, -3) : last;
    if (!stem || !V.split("").some(c => stem.includes(c))) return null;
    return { pre, stem, inf: pre + stem + "m" + a2(stem) + "k" };
  }
  // question particle with personal endings: miyim, misin, mi, miyiz, misiniz
  const qp = (word, p) => { const v = h4(word); return " m" + v + ["y" + v + "m", "s" + v + "n", "", "y" + v + "z", "s" + v + "n" + v + "z"][p]; };

  // --- one function per tense: (stem, person 0–5, form "aff" | "neg" | "q" | "negq") → word ---
  function yorBase(st, neg) {
    if (neg) return st + "m" + h4(st) + "yor";
    if (yeDe(st)) return st[0] + "iyor";
    if (endsV(st)) { if ("ae".includes(st[st.length - 1])) { const b = st.slice(0, -1); return b + h4(b) + "yor"; } return st + "yor"; }
    return soft(st) + h4(st) + "yor";
  }
  const YOR = ["um", "sun", "", "uz", "sunuz", "lar"];
  function prs(st, p, f) {
    const b = yorBase(st, f === "neg" || f === "negq");
    if (f === "aff" || f === "neg") return b + YOR[p];
    return p === 5 ? b + "lar mı" : b + qp(b, p);
  }
  function past(st, p, f) {
    const neg = f === "neg" || f === "negq";
    const s = neg ? st + "m" + a2(st) : st;
    const b = s + (HARD.includes(s[s.length - 1]) ? "t" : "d") + h4(s);
    const v = h4(b), a = a2(b);
    const w = b + ["m", "n", "", "k", "n" + v + "z", "l" + a + "r"][p];
    return f === "q" || f === "negq" ? w + " m" + h4(w) : w;
  }
  function futBase(st, neg) { const s = neg ? st + "m" + a2(st) : st; const x = neg ? s + "y" : vbase(s); const a = a2(s); return x + a + "c" + a + "k"; }
  function futPers(b, p) { const v = h4(b), a = a2(b), g = b.slice(0, -1) + "ğ"; return [g + v + "m", b + "s" + v + "n", b, g + v + "z", b + "s" + v + "n" + v + "z", b + "l" + a + "r"][p]; }
  function fut(st, p, f) {
    const b = futBase(st, f === "neg" || f === "negq");
    if (f === "aff" || f === "neg") return futPers(b, p);
    return p === 5 ? futPers(b, 5) + " m" + h4(futPers(b, 5)) : b + qp(b, p);
  }
  function aorBase(st) {
    if (endsV(st)) return st + "r";
    if (AOR_IR.has(st) || (nVow(st) > 1 && !SOFT.has(st))) return st + h4(st) + "r";
    return soft(st) + a2(st) + "r";
  }
  function aorPos(b, p) { const v = h4(b), a = a2(b); return b + ["" + v + "m", "s" + v + "n", "", v + "z", "s" + v + "n" + v + "z", "l" + a + "r"][p]; }
  function aorNeg(n, p) { // n = stem + ma/me
    const v = h4(n + "z"), a = a2(n);
    return [n + "m", n + "zs" + v + "n", n + "z", n + "y" + v + "z", n + "zs" + v + "n" + v + "z", n + "zl" + a + "r"][p];
  }
  function aorQ(b, p) { return p === 5 ? aorPos(b, 5) + " m" + h4(aorPos(b, 5)) : b + qp(b, p); }
  function aor(st, p, f) {
    const b = aorBase(st), n = st + "m" + a2(st);
    if (f === "aff") return aorPos(b, p);
    if (f === "neg") return aorNeg(n, p);
    if (f === "q") return aorQ(b, p);
    return p === 5 ? aorNeg(n, 5) + " m" + h4(aorNeg(n, 5)) : n + "z" + qp(n + "z", p);
  }
  function mis(st, p, f) {
    const s = f === "neg" || f === "negq" ? st + "m" + a2(st) : st;
    const b = s + "m" + h4(s) + "ş", v = h4(b), a = a2(b);
    if (f === "aff" || f === "neg") return b + [v + "m", "s" + v + "n", "", v + "z", "s" + v + "n" + v + "z", "l" + a + "r"][p];
    return p === 5 ? b + "l" + a + "r m" + h4(b + "l" + a + "r") : b + qp(b, p);
  }
  function iyordu(st, p, f) {
    const b = yorBase(st, f === "neg" || f === "negq");
    if (f === "aff" || f === "neg") return p === 5 ? b + "lardı" : b + "du" + ["m", "n", "", "k", "nuz"][p];
    return p === 5 ? b + "lar mıydı" : b + " muydu" + ["m", "n", "", "k", "nuz"][p];
  }
  function abil(st, p, f) {
    if (f === "aff" || f === "q") { const b = vbase(st) + a2(st) + "bilir"; return f === "aff" ? aorPos(b, p) : aorQ(b, p); }
    const n = vbase(st) + a2(st) + "m" + a2(st); // geleme-, yapama-
    return f === "neg" ? aorNeg(n, p) : (p === 5 ? aorNeg(n, 5) + " m" + h4(aorNeg(n, 5)) : n + "z" + qp(n + "z", p));
  }
  function meli(st, p, f) {
    const s = f === "neg" || f === "negq" ? st + "m" + a2(st) : st;
    const b = s + "m" + a2(st) + "l" + h4(a2(st)), v = h4(b), a = a2(b);
    if (f === "aff" || f === "neg") return b + ["y" + v + "m", "s" + v + "n", "", "y" + v + "z", "s" + v + "n" + v + "z", "l" + a + "r"][p];
    return p === 5 ? b + "l" + a + "r m" + h4(b + "l" + a + "r") : b + qp(b, p);
  }
  function cond(st, p, f) {
    const b = f === "neg" ? st + "m" + a2(st) + "z" : aorBase(st), a = a2(b), v = h4(a);
    return p === 5 ? b + "l" + a + "rs" + a2(b + "l" + a + "r") : b + "s" + a + ["m", "n", "", "k", "n" + v + "z"][p];
  }
  function imp(st, p, f) {
    const neg = f === "neg", n = st + "m" + a2(st);
    switch (p) {
      case 0: return neg ? n + "y" + a2(n) + "y" + h4(a2(n)) + "m" : vbase(st) + a2(st) + "y" + h4(a2(st)) + "m"; // geleyim
      case 1: return neg ? n : st;
      case 2: return neg ? n + "s" + h4(n) + "n" : st + "s" + h4(st) + "n";
      case 3: return neg ? n + "y" + a2(n) + "l" + h4(a2(n)) + "m" : vbase(st) + a2(st) + "l" + h4(a2(st)) + "m"; // gelelim
      case 4: if (neg) return n + "y" + h4(n) + "n";
        if (st === "ye") return "yiyin"; if (st === "de") return "deyin";
        return (endsV(st) ? st + "y" : soft(st)) + h4(st) + "n";
      default: { const o = neg ? n + "s" + h4(n) + "n" : st + "s" + h4(st) + "n"; return o + "l" + a2(o) + "r"; }
    }
  }

  const TENSES = [
    { id: "prs", ru: "Сейчас", sfx: "-iyor", lesson: "A0-23", note: "Что происходит сейчас. Основа + -ıyor/-iyor/-uyor/-üyor + лицо. Конечная a/e отпадает: başla → başlıyor.", fn: prs },
    { id: "past", ru: "Прошедшее", sfx: "-dı", lesson: "A1-15", note: "То, что точно случилось. -dı/-di/-du/-dü, после глухих согласных -tı: geldim, yaptın.", fn: past },
    { id: "fut", ru: "Будущее", sfx: "-acak", lesson: "A2-1", note: "-acak/-ecek, после гласной -yacak. Перед гласной k → ğ: geleceğim, yapacağız.", fn: fut },
    { id: "aor", ru: "Широкое время", sfx: "-ır / -ar", lesson: "A2-5", note: "Привычки и общие истины. Односложные — -ar/-er (yapar, gider), кроме 13 глаголов на -ır (gelir, alır, bilir…); многосложные — -ır (çalışır). «Не» — -maz, «я не» — -mam.", fn: aor },
    { id: "mis", ru: "Говорят, что…", sfx: "-mış", lesson: "A2-15", note: "Пересказ и то, что узнали не сами: gelmiş — говорят, пришёл; оказывается, пришёл.", fn: mis },
    { id: "iyordu", ru: "Было в процессе", sfx: "-iyordu", lesson: "A2-16", note: "Действие шло в какой-то момент прошлого: Ben yemek yapıyordum — я готовила (в тот момент).", fn: iyordu },
    { id: "abil", ru: "Могу", sfx: "-ebil", lesson: "A2-2", note: "Основа + -abil/-ebil + широкое время. «Не могу» — -ama/-eme: gelemem, yapamazsın.", fn: abil },
    { id: "meli", ru: "Надо", sfx: "-malı", lesson: "A2-3", note: "Долженствование: gitmeliyim — мне надо идти, yapmamalısın — тебе не стоит делать.", fn: meli },
    { id: "cond", ru: "Если", sfx: "-rsa", lesson: "A2-19", note: "Реальное условие: широкое время + -sa/-se. Gelirsen sevinirim — если придёшь, я обрадуюсь.", fn: cond, forms: ["aff", "neg"] },
    { id: "imp", ru: "Просьбы и «давай»", sfx: "gel / gelin", lesson: "A1-emir", note: "ben — «давай я», sen — просьба к «ты», o — «пусть он», biz — «давайте», siz — вежливая просьба, onlar — «пусть они».", fn: imp, forms: ["aff", "neg"] },
  ];
  const FORMS = [["aff", "Да"], ["neg", "Нет"], ["q", "Вопрос"], ["negq", "Не…?"]];
  function form(verb, tense, p, f) {
    const v = typeof verb === "string" ? parse(verb) : verb; if (!v) return null;
    const t = TENSES.find(x => x.id === tense); if (!t) return null;
    if (t.forms && !t.forms.includes(f)) return null;
    return v.pre + t.fn(v.stem, p, f);
  }
  function table(verb, tense, f) { const v = parse(verb); if (!v) return null; return PERS.map((pr, p) => [pr, form(v, tense, p, f)]); }
  return { parse, form, table, TENSES, FORMS, PERS };
})();

<script>
// Website-only layer (included by build-web.js, not in the Claude-hosted build).
// When the site is served by our own server (/api/health answers), this file:
//  • provides window.claude.use("db"/"user") backed by the server API, so the app's existing sync, rating,
//    club, promos and reports work unchanged with real accounts;
//  • adds accounts UI (sign-up, sign-in, captcha, 2FA, password reset), level purchases, sales admin;
//  • adds analytics goals (Yandex Metrica, only after cookie consent) and client error reporting.
// Without a server (e.g. GitHub Pages) everything here stays dormant and the app runs locally.
const ACC=(()=>{
  const H={"Content-Type":"application/json","X-Requested-With":"turkce"};
  async function api(method,path,body){
    const r=await fetch(path,{method,headers:H,credentials:"same-origin",body:body===undefined?undefined:JSON.stringify(body)});
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok){const e=new Error(j.message||"Нет связи с сервером. Проверьте интернет.");e.code=j.error;e.status=r.status;e.data=j;throw e}
    return j;
  }
  let health=null,me=null;
  const ready=(async()=>{
    if(location.protocol==="file:")return;
    try{const r=await fetch("/api/health",{credentials:"same-origin"});if(!r.ok)throw 0;const h=await r.json();if(!h||!h.ok)throw 0;health=h;me=(await api("GET","/api/me")).me}catch(e){health=null}
  })();

  // ---- window.claude shim: the app's data layer talks to the server through it ----
  const enc=encodeURIComponent;
  function docApi(path){return{
    get:async()=>{const j=await api("GET","/api/docs?path="+enc(path));return{exists:!!j.exists,data:()=>j.data}},
    set:async d=>{await api("PUT","/api/docs?path="+enc(path),{data:d})},
    delete:async()=>{await api("DELETE","/api/docs?path="+enc(path))}}}
  function query(name,q){q=q||{};return{
    doc:id=>docApi(name+"/"+id),
    limit:n=>query(name,{...q,limit:n}),
    orderBy:(f,dir)=>query(name,{...q,orderBy:f,dir:dir||"asc"}),
    where:(f,op,v)=>query(name,{...q,where:[...(q.where||[]),[f,v]]}),
    async get(){
      const p=new URLSearchParams({name,limit:String(q.where?1000:(q.limit||200))});if(q.orderBy){p.set("orderBy",q.orderBy);p.set("dir",q.dir)}
      let docs=(await api("GET","/api/coll?"+p)).docs;
      if(q.where)docs=docs.filter(d=>q.where.every(([f,v])=>d.data[f]===v));if(q.limit)docs=docs.slice(0,q.limit);
      return{empty:!docs.length,docs:docs.map(d=>({id:d.id,data:()=>d.data}))};
    },
    onSnapshot(cb,errCb){let stop=false;const self=this;(async function tick(){if(stop)return;try{cb(await self.get())}catch(e){errCb&&errCb(e)}setTimeout(tick,document.hidden?60000:20000)})();return()=>{stop=true}}
  }}
  const dbApi={doc:docApi,collection:n=>query(n)};
  const userApi={id:async()=>me.id,isOwner:async()=>!!me.isAdmin,me:async()=>({id:me.id,name:"",email:me.email}),profiles:async()=>({}),canEdit:()=>!!me.isAdmin,can:()=>true};
  // AI (tutor, role-play scenes) goes through our server, which talks to YandexGPT and enforces per-user limits.
  async function aiCall(input,opts){
    opts=opts||{};const messages=(typeof input==="string"?[{role:"user",content:input}]:input).map(m=>({role:m.role==="assistant"?"assistant":"user",content:String(m.content||"")}));
    let r;try{r=await fetch("/api/ai/complete",{method:"POST",headers:H,credentials:"same-origin",body:JSON.stringify({messages,json:!!opts.json}),signal:opts.signal})}
    catch(e){const x=new Error(e&&e.name==="AbortError"?"Остановлено":"Нет связи с сервером");x.code=e&&e.name==="AbortError"?"cancelled":"network";throw x}
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok){const x=new Error(j.message||"ИИ сейчас недоступен");x.code=r.status===429?"rate_limited":(j.error||"error");throw x}
    if(opts.onText)try{opts.onText({text:j.text||"",delta:j.text||""})}catch(e){}
    return {text:j.text||"",truncated:false};
  }
  const sampleShim=Object.assign((input,opts)=>aiCall(input,opts),{
    json:async(input,opts)=>{const {text}=await aiCall(input,{...(opts||{}),json:true});const t=String(text),i=t.indexOf("{"),k=t.lastIndexOf("}");if(i<0||k<i)throw Object.assign(new Error("bad json"),{code:"bad_output"});return JSON.parse(t.slice(i,k+1))},
    limits:async()=>({images:false})});
  window.claude={use:async name=>{await ready;if(!health||!me)return null;if(name==="db")return dbApi;if(name==="user")return userApi;if(name==="sample")return health.ai?sampleShim:null;return null}};

  // ---- analytics (Yandex Metrica goals; loaded only after consent) & error reports ----
  const MID=typeof METRIKA_ID!=="undefined"?METRIKA_ID:"";
  function cookieChoice(){try{return localStorage.getItem("turkce.cookies")}catch(e){return null}}
  function loadMetrika(){
    if(!MID||window.ym)return;
    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();k=e.createElement(t),a=e.getElementsByTagName(t)[0];k.async=1;k.src=r;a.parentNode.insertBefore(k,a)})(window,document,"script","https://mc.yandex.ru/metrika/tag.js","ym");
    window.ym(MID,"init",{clickmap:true,trackLinks:true,accurateTrackBounce:true,webvisor:false});
  }
  function cookieBanner(){
    if(!MID||cookieChoice())return;
    const el=document.createElement("div");el.className="cookie-bar";
    el.innerHTML=`<span>Мы используем cookie и Яндекс Метрику, чтобы понимать, что в приложении удобно, а что нет. <a href="#" data-legal="privacy" class="link">Подробнее</a></span><div><button class="btn sm" data-ck="no">Только нужные</button><button class="btn sm primary" data-ck="yes">Хорошо</button></div>`;
    document.body.appendChild(el);
    el.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>{try{localStorage.setItem("turkce.cookies",b.dataset.ck)}catch(e){}el.remove();if(b.dataset.ck==="yes")loadMetrika()});
  }
  if(cookieChoice()==="yes")loadMetrika();
  function track(goal,params){try{if(window.ym&&MID)window.ym(MID,"reachGoal",goal,params||{})}catch(e){}}

    box.hidden=false;const sc=await loadCaptcha();if(!sc){box.textContent="Не удалось загрузить проверку «я не робот». Обновите страницу.";return{token:()=>"",reset(){}}}

  // Invitation links (…/?ref=CODE on the landing page or the app): the first link a visitor opens is kept for 30 days
  // in this browser, sent with the registration and cleared afterwards. A signed-in learner without a referrer gets it
  // applied at once (the server allows that only before the first purchase and never for one's own link).
  const REF_KEY="turkce.ref",REF_TTL=30*864e5;
  const cleanRef=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
  function saveRef(code){code=cleanRef(code);if(code.length<4)return;
    try{const cur=JSON.parse(localStorage.getItem(REF_KEY)||"null");if(cur&&cur.code&&Date.now()-cur.at<REF_TTL)return;localStorage.setItem(REF_KEY,JSON.stringify({code,at:Date.now()}))}
    catch(e){try{sessionStorage.setItem(REF_KEY,code)}catch(_){}}}
  function refFromUrl(){try{const r=JSON.parse(localStorage.getItem(REF_KEY)||"null");if(r&&r.code&&Date.now()-r.at<REF_TTL)return cleanRef(r.code)}catch(e){}
    try{return cleanRef(sessionStorage.getItem(REF_KEY))}catch(e){return""}}
  function clearRef(){try{localStorage.removeItem(REF_KEY)}catch(e){}try{sessionStorage.removeItem(REF_KEY)}catch(e){}}
  async function applyStoredRef(){const code=refFromUrl();if(!code||!me)return;

    catch(e){clearRef()}}

  let ex=[];
  if(only){
    if(only==="letter")return letterEx(len);
    if(only==="suffix")return drill==="conj"?conjEx(len,d):drillEx(drill||"pl",len,d);
    if(only==="speed"){const src=items.filter(w=>w.tr.length<=18&&w.ru.length<=24);return [{type:"speed",pairs:pickPairs(src.length>=6?src:items,6)}]}
    if(only==="speak"){const src=items.filter(w=>w.tr.length<=60);return pick(src.length?src:items,Math.min(len,8)).map(w=>({type:"speak",w}))}
    if(only==="wordle"){const ok=w=>{const u=w.tr.toLocaleUpperCase("tr");return /^[A-ZÇĞİÖŞÜ]{4,6}$/.test(u)};let src=items.filter(ok);if(src.length<3)src=ALL.filter(w=>ok(w)&&w.ci<=Math.max(0,currentCourse()));return pick(src,Math.min(len,5)).map(w=>({type:"wordle",w}))}
    if(only==="match"){for(let i=0;i<Math.max(2,Math.round(len/4));i++)ex.push({type:"match",pairs:pickPairs(items,d.pairs)});return ex}
    let src=only==="build"?multi:(only==="type"||only==="dictation")?shortOnes:items;if(!src.length)src=items;
    let q=[];while(ex.length<len){if(!q.length)q=shuffle(src);ex.push(basic(only,q.pop()))}
    return ex;
  }
  if(abc)ex.push(...letterEx(6));
  if(drill)ex.push(...drillEx(drill,4,d));
  if(items.length>=d.pairs&&ex.length<len-2)ex.push({type:"match",pairs:pickPairs(items,d.pairs)});
  pick(multi,Math.min(exam?3:2,multi.length)).forEach(w=>{if(ex.length<len-2)ex.push({type:"build",w})});
  pick(shortOnes,d.type+(exam?1:0)).forEach(w=>{if(ex.length<len-1)ex.push({type:"type",w})});
  pick(shortOnes,d.dict).forEach(w=>{if(ex.length<len-1)ex.push({type:"dictation",w})});
  const kinds=["choice_tr","listen","choice_ru"];let k=0,q=[];
  while(ex.length<len){if(!q.length)q=shuffle(items);ex.push(basic(kinds[k++%3],q.pop()))}
  if(!exam&&speakOK()&&ex.length>=6){const cand=(multi.length?multi:items).filter(w=>w.tr.length<=48&&/[a-zçğıöşü]{2}/i.test(w.tr));const at=ex.findIndex(e=>e.type==="choice_ru"||e.type==="choice_tr");if(cand.length&&at>=0)ex[at]={type:"speak",w:pick(cand,1)[0]}}
  ex=shuffle(ex);const first=ex.filter(e=>e.type==="letter"||e.type==="soundof");
  return [...first,...ex.filter(e=>!first.includes(e))];
}

/* ================= DIALOGS: modal semantics and focus ================= */
// Every [role=dialog] that appears is treated as modal: aria-modal, focus moves into it, Tab stays inside,
// Escape closes it the same way as its own close button, the page behind it is inert, and when it closes
// focus goes back to the control that opened it (or the same control after a re-render).
const DLG=(function(){
  const SEL='a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  const stack=[];let seq=0;
  // the dialog on top is the one drawn on top (z-index), not simply the newest
  const zOf=d=>{let z=0;for(let e=d;e&&e!==document.body;e=e.parentElement){const v=parseInt(getComputedStyle(e).zIndex,10);if(v>z)z=v}return z};
  const order=()=>{stack.forEach(s=>s.z=zOf(s.d));stack.sort((a,b)=>a.z-b.z||a.n-b.n)};
  const shown=el=>!!(el.offsetWidth||el.offsetHeight||el.getClientRects().length);
  const items=d=>[...d.querySelectorAll(SEL)].filter(el=>shown(el)&&!el.closest("[inert]"));
  const hostOf=d=>{let h=d;while(h.parentElement&&h.parentElement!==document.body)h=h.parentElement;return h};
  function sig(el){if(!el||el===document.body)return null;if(el.id)return "#"+CSS.escape(el.id);
    for(const a of el.attributes)if(a.name.startsWith("data-")&&a.value&&a.value.length<80)return `[${a.name}="${CSS.escape(a.value)}"]`;return null}
  function background(on){for(const el of [document.querySelector(".app"),document.querySelector(".nav"),document.getElementById("beta")])if(el){if(on)el.setAttribute("inert","");else el.removeAttribute("inert")}
    stack.forEach((s,i)=>{if(s.host===document.body)return;if(i<stack.length-1)s.host.setAttribute("inert","");else s.host.removeAttribute("inert")})}
  function restore(prev,key){
    let t=prev&&prev.isConnected&&shown(prev)?prev:null;
    if(!t&&key){try{t=document.querySelector(key)}catch(e){}}
    if(!t||!shown(t)){t=document.querySelector("#view h1, #view h2")||document.getElementById("view");if(t&&!t.hasAttribute("tabindex"))t.setAttribute("tabindex","-1")}
    if(t)try{t.focus({preventScroll:true})}catch(e){}
  }
  function open(d,inherit){
    d.setAttribute("aria-modal","true");if(!d.hasAttribute("tabindex"))d.setAttribute("tabindex","-1");
    if(!d.getAttribute("aria-label")&&!d.getAttribute("aria-labelledby")){const h=d.querySelector("h1,h2,h3");if(h){if(!h.id)h.id="dlg-h-"+Math.random().toString(36).slice(2,8);d.setAttribute("aria-labelledby",h.id)}}
    const prev=inherit?inherit.prev:document.activeElement,key=inherit?inherit.key:sig(document.activeElement);
    stack.push({d,host:hostOf(d),prev,key,n:++seq});order();background(true);
    if(stack[stack.length-1].d!==d)return; // opened underneath another dialog: it gets focus when that one closes
    const first=d.querySelector("[data-autofocus]");
    setTimeout(()=>{if(d.isConnected&&!d.contains(document.activeElement))try{(first||d).focus({preventScroll:true})}catch(e){}},0);
  }
  function sync(){
    const live=[...document.querySelectorAll('[role="dialog"]')];
    const gone=stack.filter(s=>!live.includes(s.d)||!s.d.isConnected);
    gone.forEach(s=>stack.splice(stack.indexOf(s),1));
    const fresh=live.filter(d=>!stack.some(s=>s.d===d));
    fresh.forEach((d,i)=>open(d,i===0&&gone.length?gone[0]:null));
    if(!fresh.length&&gone.length){order();background(stack.length>0);const top=stack[stack.length-1];
      if(top){if(!top.d.contains(document.activeElement))try{top.d.focus({preventScroll:true})}catch(e){}}else restore(gone[0].prev,gone[0].key)}
  }
  new MutationObserver(sync).observe(document.body,{childList:true,subtree:true});
  document.addEventListener("keydown",e=>{
    const top=stack[stack.length-1];if(!top)return;const d=top.d;
    if(e.key==="Tab"){const list=items(d);if(!list.length){e.preventDefault();d.focus();return}
      const i=list.indexOf(document.activeElement);
      if(e.shiftKey&&(i<=0)){e.preventDefault();list[list.length-1].focus()}
      else if(!e.shiftKey&&(i===-1||i===list.length-1)){e.preventDefault();list[0].focus()}}
    else if(e.key==="Escape"){
      const btn=[...d.querySelectorAll('[data-close],#legalClose,#repNo,#dNo,[aria-label="Закрыть"],[aria-label="Выйти"]')].find(shown);
      if(btn){e.preventDefault();btn.click();return}
      const bg=d.closest(".sheet-bg");if(bg&&bg.onclick){e.preventDefault();bg.dispatchEvent(new MouseEvent("click",{bubbles:true}))}}
  },true);
  return {stack,sync};
})();

const MASTER=21;

function decks(){
  const d=[{id:"learned",name:"Выученные слова",desc:"Из пройденных уроков",ic:"book",col:"#2255C4",cards:learnedWords()},
    {id:"own",name:"Мои карточки",desc:"Карточки, которые вы создали",ic:"pen",col:"#7C4CC2",cards:allCustom()},
    {id:"notes",name:"Из конспектов",desc:"Примеры из конспектов пройденных уроков",ic:"note",col:"#12908A",cards:noteWords()},
    {id:"mist",name:"Мои ошибки",desc:"Слова, где были ошибки",ic:"target",col:"#D9483B",cards:Object.keys(S.mistakes).map(tr=>ALL.find(w=>w.tr===tr)).filter(Boolean)}];
  COURSES.forEach((c,ci)=>{if(courseOpen(ci))d.push({id:"c"+ci,name:cname(ci),desc:"Все слова курса",ic:"cards",col:["#2255C4","#0E7F79","#7C4CC2","#C2582B","#B0306A"][ci],cards:c.lessons.flatMap(l=>l.words)})});
  d.forEach(x=>{const m=new Map();x.cards.forEach(w=>{const k=cardId(w);if(!m.has(k))m.set(k,w)});x.cards=[...m.values()]});
  return d;
}
function reviewCards(ds){const m=new Map();const learned=new Set(ds[0].cards.map(cardId));ds.forEach(dk=>dk.cards.forEach(w=>{const k=cardId(w);if(m.has(k))return;if(S.srs[k]||learned.has(k)||dk.id==="own")m.set(k,w)}));return [...m.values()]}
function deckStats(dk){
  const t=today();let nw=0,due=0,mast=0;
  dk.cards.forEach(w=>{const s=S.srs[cardId(w)];if(!s){nw++;return}if(s.d<=t)due++;mast+=Math.min(1,(s.i||0)/MASTER)});
  return {nw,due,pct:dk.cards.length?Math.round(mast/dk.cards.length*100):0};
}
const newLeft=()=>Math.max(0,P.newPerDay-(S.newDone[today()]||0));
function ivlLabel(days){if(days<=0)return "<10 мин";if(days<30)return days+" д";if(days<365)return Math.round(days/30)+" мес";return (days/365).toFixed(1)+" г"}
function nextIvl(s,g){
  s=s||{i:0,e:2.5,r:0};let i=s.i||0,e=s.e||2.5,r=s.r||0;
  if(g===1)return {i:0,e:Math.max(1.3,e-.2),r:0};
  if(g===2)return {i:Math.max(1,Math.round((i||1)*1.2)),e:Math.max(1.3,e-.15),r:r+1};
  if(g===3)return {i:r===0?1:r===1?3:Math.round(i*e),e,r:r+1};

async function applyRefCode(code){
  code=(code||"").trim().toUpperCase();
  if(!lbCol)return WEB?NOACC:"Войдите в аккаунт Claude, чтобы использовать код";
  if(S.refBy)return "Вы уже ввели код приглашения";

async function applyPromo(code){

function calendar(){
  const [y,m]=today().split("-").map(Number);const first=new Date(y,m-1,1),n=new Date(y,m,0).getDate(),lead=(first.getDay()+6)%7;
  let h=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>`<span class="h">${x}</span>`).join("");for(let i=0;i<lead;i++)h+=`<span></span>`;

function xpChart(){
  const t=today(),days=[...Array(14)].map((_,i)=>addDays(t,i-13)),vals=days.map(d=>S.xp[d]||0);
  const top=Math.ceil(Math.max(FEAT.goal?P.goal*1.5:10,...vals)/10)*10;
  const W=340,H=170,pl=26,pr=4,pt=10,pb=24,cw=(W-pl-pr)/14,bw=Math.min(16,cw-4),y=v=>pt+(H-pt-pb)*(1-v/top);
  let g="";[0,top/2,top].forEach(v=>{g+=`<line class="grid-line" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`});
  if(FEAT.goal)g+=`<line class="goal-line" x1="${pl}" x2="${W-pr}" y1="${y(P.goal)}" y2="${y(P.goal)}"/>`;
  days.forEach((d,i)=>{const x=pl+i*cw+(cw-bw)/2,v=vals[i],hg=Math.max(0,y(0)-y(v));
    if(v>0){const r=Math.min(4,hg);g+=`<path class="bar-r ${d===t?"today":""}" d="M${x},${y(0)} v${-(hg-r)} q0,${-r} ${r},${-r} h${bw-2*r} q${r},0 ${r},${r} v${hg-r} z"><title>${+d.slice(8)}.${d.slice(5,7)}: ${v} XP</title></path>`}
    if(i%2===1||d===t)g+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" ${d===t?'style="fill:var(--ink)"':""}>${d===t?"сег.":+d.slice(8)}</text>`});
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Опыт по дням за две недели">${g}</svg></div>`;
}

// Accepts this format and the older {app:"turkce",v:3,state}. Returns {state,prefs} or an error text.
function parseBackup(text){
  if(typeof text!=="string"||!text.trim())return {err:"Файл пустой"};
  if(text.length>8e6)return {err:"Файл слишком большой для файла прогресса"};
  let j;try{j=JSON.parse(text)}catch(e){return {err:"Файл повреждён: это не JSON"}}
  if(!isObj(j)||j.app!=="turkce"||!isObj(j.state))return {err:"Это не файл прогресса «CepteTurk»"};
  const st=fixState(j.state);
  if(!Object.keys(st.xp).length&&!Object.keys(st.lessons).length&&!st.custom.length&&!Object.keys(st.srs).length&&!st.profile)return {err:"В файле нет прогресса"};
  return {state:st,prefs:isObj(j.prefs)?j.prefs:null,date:typeof j.exported==="string"?j.exported:(typeof j.at==="string"?j.at:"")};
}
function applyBackup(b,how){
  if(how==="replace"){const keep={refBy:S.refBy,refClaimed:S.refClaimed,promos:S.promos};S=fixState(b.state);Object.assign(S,{refBy:S.refBy||keep.refBy,refClaimed:[...new Set([...S.refClaimed,...keep.refClaimed])],promos:[...new Set([...S.promos,...keep.promos])]});S.resetAt=Date.now();if(b.prefs){P=fixPrefs({...P,...b.prefs});savePrefs();applyTheme();applyZoom();applyVolume()}}
  else{const st={...b.state,resetAt:S.resetAt||0};S=mergeState(S,st)}
  if(S.profile)S.guest=null;
  persist();render();
  toast("📂",how==="replace"?"Прогресс восстановлен из файла":"Прогресс объединён с файлом",saveLocal()?"Всё сохранено":"Но браузер не дал сохранить — оставьте файл у себя");
}

function wireProfileForm(onboarding){
  const root=onboarding?$("#overlay"):$("#view");
  const nm=root.querySelector("#pName");if(!nm)return;nm.value=(S.profile&&S.profile.name)||"";
  let av=(S.profile&&S.profile.avatar)||"🦊";
  root.querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>{av=b.dataset.av;root.querySelectorAll("[data-av]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  root.querySelector("#pSave").onclick=async()=>{
    const name=nm.value.trim().slice(0,24);if(!name){nm.focus();nm.style.borderColor="var(--bad)";return}
    const ag=root.querySelector("#pAgree"),pd=root.querySelector("#pPd");
    const boxes=[ag,pd].filter(Boolean);
    if(boxes.some(x=>!x.checked)){boxes.forEach(x=>{const c=x.closest(".consent");if(!x.checked){c.style.borderColor="var(--bad)";c.setAttribute("aria-invalid","true")}});const first=boxes.find(x=>!x.checked);first.focus();
      toast("📄",boxes.length>1?"Нужно отметить обе галочки":"Нужно принять соглашение","Без этого профиль не создать. Можно продолжить без профиля");return}
    S.profile={name,avatar:av,created:(S.profile&&S.profile.created)||Date.now(),u:Date.now(),consent:(S.profile&&S.profile.consent)||(ag?{terms:Date.now(),pd:pd?Date.now():null,version:"2026-10-11",mode:LEGAL.mode}:null)};delete S.guest;
    const rc=root.querySelector("#obRef");
    if(rc&&rc.value.trim()){const err=await applyRefCode(rc.value);if(err){root.querySelector("#obMsg").textContent=err;persist();return}}
    persist();editProfile=false;
    if(onboarding){$("#overlay").innerHTML="";toast(av,"Профиль создан","Хорошей учёбы, "+name+"!");if(!S.placement&&!Object.values(S.lessons).some(x=>x.done)){render();aimSheet(()=>{render();startChoice()});return}}
    render();
  };
}

const reduceMotion=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(){
  if(reduceMotion())return;
  let c=$("#confetti");if(c)c.remove();c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const cols=["#58CC02","#1CB0F6","#FFC800","#FF4B4B","#CE82FF","#FF9600"];
  const ps=Array.from({length:110},(_,i)=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[i%cols.length]}));
  let t0=performance.now();

    ps.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-t/2600);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));x.restore()});
    if(t<2600)requestAnimationFrame(f);else c.remove()})(t0);
}

  from=from||0;dur=dur||800;const pre=el.dataset.prefix||"",suf=el.dataset.suffix||"";

  const t0=performance.now();(function f(now){const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=pre+Math.round(from+(to-from)*e)+suf;if(k<1)requestAnimationFrame(f)})(t0);

const lvlXp=n=>20*(n-1)*n;

const LVL_TITLES=[[30,"Легенда"],[20,"Эксперт"],[15,"Мастер"],[10,"Знаток"],[5,"Ученик"],[1,"Новичок"]];
const lvlTitle=n=>LVL_TITLES.find(([k])=>n>=k)[1];
function lvlInfo(){const x=totalXp(),n=lvlOf(x),a=lvlXp(n),b=lvlXp(n+1);return {n,x,into:x-a,need:b-a,pct:(x-a)/(b-a)*100,title:lvlTitle(n)}}
function checkLevelUp(){
  if(!FEAT.levels)return;

}

// Character-level comparison of a typed answer with the correct one (LCS), rendered as two highlighted lines.
function diffHTML(typed,right){
  const a=[...String(typed).trim()],b=[...String(right)];if(!a.length||a.length*b.length>60000)return "";
  const lo=c=>c.toLocaleLowerCase("tr"),n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=lo(a[i])===lo(b[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,ta="",tb="";
  while(i<n||j<m){
    if(i<n&&j<m&&lo(a[i])===lo(b[j])){ta+=esc(a[i]);tb+=esc(b[j]);i++;j++}
    else if(j<m&&(i>=n||dp[i][j+1]>=dp[i+1][j])){tb+=`<ins>${esc(b[j])}</ins>`;j++}
    else{ta+=`<del>${esc(a[i])}</del>`;i++}
  }
  const onlyLetters=deacc(typed)===deacc(right);
  return `<div class="diff"><div><small>Вы написали</small><span>${ta}</span></div><div><small>Правильно</small><span>${tb}</span></div>${onlyLetters?`<p>Разница только в турецких буквах: ı, ş, ç, ğ, ö, ü.</p>`:""}</div>`;
}
function mistakeWords(){return Object.keys(S.mistakes).map(tr=>ALL.find(w=>w.tr===tr)).filter(Boolean)}

// Drill: a verb, a person and a form — pick the right word. Wrong options are mostly the other persons of the same tense.
let CJ_TRAIN=null;
const CJ_LEVEL=[["prs"],["prs","past","imp"]];
function conjEx(n,d){
  const fromView=CJ_TRAIN;CJ_TRAIN=null;
  const ci=currentCourse(),tenses=CJ_LEVEL[ci]||CONJ.TENSES.map(t=>t.id);
  const verbs=VERB_LIST.slice(0,40).map(x=>x[0]);
  const out=[];let guard=0;
  while(out.length<n&&guard++<n*30){
    // from the conjugation screen: half the items use the verb and tense on screen
    const mine=fromView&&out.length%2===0;
    const v=mine&&fromView.verb?fromView.verb:pick(verbs,1)[0],tid=mine?fromView.tense:pick(tenses,1)[0],t=cjT(tid);
    const forms=t.forms||(ci<1?["aff","neg","q"]:["aff","neg","q","negq"]),f=pick(forms,1)[0],p=Math.floor(Math.random()*6);
    const right=CONJ.form(v,tid,p,f);if(!right||out.some(e=>e.right===right))continue;
    const pers=shuffle(CONJ.PERS.map((_,q)=>q!==p?CONJ.form(v,tid,q,f):null)),other=shuffle(forms.filter(x=>x!==f).map(x=>CONJ.form(v,tid,p,x)));
    const otherT=shuffle(tenses.filter(x=>x!==tid).map(x=>CONJ.form(v,x,p,f)));
    const wrong=[...new Set([pers[0],pers[1],other[0],otherT[0],...pers.slice(2),...other.slice(1)].filter(x=>x&&x!==right))];
    const fl=tid==="imp"?IMP_FORM:FORM_RU;
    out.push({type:"suffix",mode:"conj",base:v,ru:cjRu(v),right,opts:shuffle([right,...wrong.slice(0,d.opts-1)]),name:"Спряжение · "+t.ru,ask:`${CONJ.PERS[p]} (${cjPers(tid,p)}) · ${fl[f]}`});
  }
  return out;
}

  return Math.max(0,Math.round((1-prev[m]/Math.max(n,m))*100))}

function trNum(n){n=+n;if(!(n>=0&&n<1e6))return String(n);if(n===0)return "sıfır";const p=[];const th=Math.floor(n/1000),r=n%1000;
  if(th)p.push(th===1?"bin":trNum(th)+" bin");const h=Math.floor(r/100),t=Math.floor(r%100/10),o=r%10;
  if(h)p.push(h===1?"yüz":TR_ONES[h]+" yüz");if(t)p.push(TR_TENS[t]);if(o)p.push(TR_ONES[o]);return p.join(" ")}

async function toPcm16k(blob){
  const c=ensureCtx();const buf=await c.decodeAudioData(await blob.arrayBuffer());
  const len=Math.max(1,Math.ceil(buf.duration*16000));const off=new OfflineAudioContext(1,len,16000);
  const s=off.createBufferSource();s.buffer=buf;s.connect(off.destination);s.start();const out=(await off.startRendering()).getChannelData(0);
  const i16=new Int16Array(out.length);for(let k=0;k<out.length;k++){const x=Math.max(-1,Math.min(1,out[k]));i16[k]=x<0?x*32768:x*32767}return i16.buffer;

    try{player.pause()}catch(err){}
    const chunks=[];let rec=null;try{rec=new MediaRecorder(stream)}catch(err){}
    const st={rec,stream,on:true,asr:null,alts:null,asrDone:!(ASR&&P.asr!==false),stopped:false};recState=st;
    const finish=async()=>{
      if(!st.stopped||!st.asrDone||st.finished)return;st.finished=true;

      else if(check)info("Не расслышал. Говорите чуть громче и ближе к телефону — или оцените себя сами.");

        if(L.state.myUrl)URL.revokeObjectURL(L.state.myUrl);st.blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});L.state.myUrl=URL.createObjectURL(st.blob);
        const mb=$("#spMine");if(mb)mb.disabled=false;st.stopped=true;finish()};
      rec.start()}else st.stopped=true;

    setTimeout(()=>{if(!st.finished){st.asrDone=true;st.stopped=true;finish()}},13000);
    if(!rec)finish();
  };
